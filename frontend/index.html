<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Role-Based Campus Placement Portal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for runtime JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <!-- React Application Core -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- API CLIENT ---
    const API_BASE = "/api";
    const getStoredToken = () => localStorage.getItem("placement_token");
    const setStoredToken = (t) => localStorage.setItem("placement_token", t);
    const removeStoredToken = () => {
      localStorage.removeItem("placement_token");
      localStorage.removeItem("placement_user");
    };
    const getStoredUser = () => {
      const u = localStorage.getItem("placement_user");
      return u ? JSON.parse(u) : null;
    };
    const setStoredUser = (u) => localStorage.setItem("placement_user", JSON.stringify(u));

    async function apiRequest(endpoint, options = {}) {
      const token = getStoredToken();
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (token) headers["Authorization"] = `Bearer ${token}`;

      const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        let msg = "A server error occurred.";
        if (data.detail) {
          if (typeof data.detail === "object" && data.detail.reasons) {
            msg = `Eligibility Criteria Unmet:\n• ` + data.detail.reasons.join("\n• ");
          } else if (typeof data.detail === "object") {
            msg = data.detail.message || JSON.stringify(data.detail);
          } else {
            msg = data.detail;
          }
        }
        const err = new Error(msg);
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    const api = {
      login: (creds) => apiRequest("/auth/login", { method: "POST", body: JSON.stringify(creds) }),
      registerStudent: (d) => apiRequest("/auth/register/student", { method: "POST", body: JSON.stringify(d) }),
      registerRecruiter: (d) => apiRequest("/auth/register/recruiter", { method: "POST", body: JSON.stringify(d) }),
      getStudentProfile: () => apiRequest("/student/profile"),
      updateStudentProfile: (p) => apiRequest("/student/profile", { method: "PUT", body: JSON.stringify(p) }),
      getStudentJobs: () => apiRequest("/student/jobs"),
      applyJob: (id) => apiRequest(`/student/jobs/${id}/apply`, { method: "POST" }),
      getStudentApplications: () => apiRequest("/student/applications"),
      getStudentNotifications: () => apiRequest("/student/notifications"),
      markNotificationRead: (id) => apiRequest(`/student/notifications/${id}/read`, { method: "POST" }),
      getRecruiterProfile: () => apiRequest("/recruiter/profile"),
      getRecruiterJobs: () => apiRequest("/recruiter/jobs"),
      createJob: (j) => apiRequest("/recruiter/jobs", { method: "POST", body: JSON.stringify(j) }),
      updateJob: (id, j) => apiRequest(`/recruiter/jobs/${id}`, { method: "PUT", body: JSON.stringify(j) }),
      submitJob: (id) => apiRequest(`/recruiter/jobs/${id}/submit`, { method: "POST" }),
      closeJob: (id) => apiRequest(`/recruiter/jobs/${id}/close`, { method: "POST" }),
      deleteJob: (id) => apiRequest(`/recruiter/jobs/${id}`, { method: "DELETE" }),
      getJobApplications: (id, page = 1, limit = 20, status = "", branch = "") => {
        let u = `/recruiter/jobs/${id}/applications?page=${page}&limit=${limit}`;
        if (status) u += `&status=${encodeURIComponent(status)}`;
        if (branch) u += `&branch=${encodeURIComponent(branch)}`;
        return apiRequest(u);
      },
      batchUpdate: (id, ids, status) => apiRequest(`/recruiter/jobs/${id}/applications/batch-update`, {
        method: "POST",
        body: JSON.stringify({ application_ids: ids, status }),
      }),
      getPendingRecruiters: () => apiRequest("/admin/recruiters/pending"),
      approveRecruiter: (id) => apiRequest(`/admin/recruiters/${id}/approve`, { method: "POST" }),
      rejectRecruiter: (id) => apiRequest(`/admin/recruiters/${id}/reject`, { method: "POST" }),
      getPendingJobs: () => apiRequest("/admin/jobs/pending"),
      approveJob: (id) => apiRequest(`/admin/jobs/${id}/approve`, { method: "POST" }),
      requestChanges: (id, feedback) => apiRequest(`/admin/jobs/${id}/request-changes`, {
        method: "POST",
        body: JSON.stringify({ admin_feedback: feedback }),
      }),
      getAuditLogs: (page = 1) => apiRequest(`/admin/audit-logs?page=${page}&limit=25`),
      getMetrics: () => apiRequest("/admin/metrics"),
    };

    // --- APPLICATION ROOT COMPONENT ---
    function App() {
      const [user, setUser] = useState(null);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authModalMode, setAuthModalMode] = useState("LOGIN");
      const [notificationsOpen, setNotificationsOpen] = useState(false);
      const [notifications, setNotifications] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const u = getStoredUser();
        const t = getStoredToken();
        if (u && t) {
          setUser(u);
          if (u.role === "STUDENT") loadNotifications();
        }
        setLoading(false);
      }, []);

      const loadNotifications = async () => {
        try {
          const list = await api.getStudentNotifications();
          setNotifications(list);
        } catch (e) {}
      };

      const handleLogout = () => {
        removeStoredToken();
        setUser(null);
        setNotifications([]);
      };

      const handleQuickLogin = async (email, password, role) => {
        try {
          const res = await api.login({ email, password, role });
          setStoredToken(res.access_token);
          const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
          setStoredUser(u);
          setUser(u);
          if (u.role === "STUDENT") loadNotifications();
        } catch (e) {
          alert(`Quick Login Error: ${e.message}`);
        }
      };

      const unreadCount = notifications.filter(n => !n.is_read).length;

      if (loading) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center text-indigo-400">
            <div className="animate-spin text-4xl">⚙</div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
          {/* Header */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-lg">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setUser(user)}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-sky-400 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/30">
                  CP
                </div>
                <div>
                  <div className="font-extrabold text-base sm:text-lg bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">
                    Campus Placement Portal
                  </div>
                  <div className="text-[10px] text-slate-400">Institutional Multi-Tenant Recruitment Architecture</div>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                {user ? (
                  <>
                    {user.role === "STUDENT" && (
                      <button
                        onClick={() => setNotificationsOpen(true)}
                        className="relative p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors"
                        title="Alert Inbox"
                      >
                        🔔
                        {unreadCount > 0 && (
                          <span className="absolute -top-1 -right-1 px-1.5 py-0.2 bg-rose-500 text-white font-bold text-[10px] rounded-full animate-pulse">
                            {unreadCount}
                          </span>
                        )}
                      </button>
                    )}

                    <div className="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                      <div className="text-right">
                        <div className="text-xs font-semibold text-white">{user.name || user.email}</div>
                        <div className="text-[10px] text-slate-400">{user.email}</div>
                      </div>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${
                        user.role === "ADMIN" ? "bg-purple-500/20 text-purple-300 border border-purple-500/40" :
                        user.role === "RECRUITER" ? (user.status === "ACTIVE" ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40" : "bg-amber-500/20 text-amber-300 border border-amber-500/40") :
                        "bg-sky-500/20 text-sky-300 border border-sky-500/40"
                      }`}>
                        {user.role} {user.role === "RECRUITER" && `(${user.status || "PENDING"})`}
                      </span>
                    </div>

                    <button
                      onClick={handleLogout}
                      className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 border border-rose-500/30"
                    >
                      Logout
                    </button>
                  </>
                ) : (
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => handleQuickLogin("admin@placement.edu", "Admin@1234", "ADMIN")}
                      className="text-xs px-2.5 py-1.5 rounded bg-purple-600/30 text-purple-200 border border-purple-500/40 hover:bg-purple-600/50"
                    >
                      Demo Admin
                    </button>
                    <button
                      onClick={() => { setAuthModalMode("LOGIN"); setAuthModalOpen(true); }}
                      className="text-xs font-bold px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/30"
                    >
                      Sign In / Register
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1">
            {!user ? (
              <LandingView
                onQuickLogin={handleQuickLogin}
                onOpenAuth={(mode) => { setAuthModalMode(mode); setAuthModalOpen(true); }}
              />
            ) : user.role === "STUDENT" ? (
              <StudentView user={user} onRefreshNotifications={loadNotifications} />
            ) : user.role === "RECRUITER" ? (
              <RecruiterView user={user} />
            ) : user.role === "ADMIN" ? (
              <AdminView user={user} />
            ) : null}
          </main>

          {/* Modals */}
          <AuthModal
            isOpen={authModalOpen}
            initialMode={authModalMode}
            onClose={() => setAuthModalOpen(false)}
            onSuccess={(u) => {
              setUser(u);
              if (u.role === "STUDENT") loadNotifications();
            }}
          />

          <NotificationModal
            isOpen={notificationsOpen}
            onClose={() => setNotificationsOpen(false)}
            notifications={notifications}
            onRefresh={loadNotifications}
          />

          <footer className="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
            Institutional Campus Placement Portal &bull; FastAPI + React + PostgreSQL Architecture
          </footer>
        </div>
      );
    }

    // --- LANDING VIEW ---
    function LandingView({ onQuickLogin, onOpenAuth }) {
      return (
        <div className="max-w-5xl mx-auto px-4 py-16 text-center space-y-8">
          <div className="inline-block px-4 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-semibold">
            Institutional Placement Architecture &bull; Strict RBAC &bull; ACID ATS Pipeline
          </div>

          <h1 className="text-4xl sm:text-5xl font-black text-white tracking-tight leading-tight">
            Role-Based Campus <br />
            <span className="bg-gradient-to-r from-indigo-400 via-sky-300 to-emerald-400 bg-clip-text text-transparent">
              Placement Portal
            </span>
          </h1>

          <p className="text-slate-400 max-w-2xl mx-auto text-sm leading-relaxed">
            Enterprise recruitment platform with physical table isolation, server-side eligibility gating,
            statechart lifecycle workflows, asynchronous soft-delete notification dispatches, and immutable audit trails.
          </p>

          <div className="pt-6 grid grid-cols-1 md:grid-cols-3 gap-5 text-left">
            {/* Student Tile */}
            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex flex-col justify-between hover:border-sky-500/40 shadow-xl transition-all">
              <div>
                <div className="text-3xl mb-3">🎓</div>
                <h3 className="font-bold text-white text-base">Student Applicant</h3>
                <p className="text-xs text-slate-400 mt-1">
                  Manage academic profile (CGPA, branch, resume URL), discover active drives with live eligibility checks, and track application funnels.
                </p>
              </div>
              <div className="mt-6 space-y-2">
                <button
                  onClick={() => onOpenAuth("REGISTER")}
                  className="w-full py-2 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs rounded-xl shadow"
                >
                  Register as Student
                </button>
                <button
                  onClick={() => onOpenAuth("LOGIN")}
                  className="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl"
                >
                  Sign In
                </button>
              </div>
            </div>

            {/* Recruiter Tile */}
            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex flex-col justify-between hover:border-emerald-500/40 shadow-xl transition-all">
              <div>
                <div className="text-3xl mb-3">🏢</div>
                <h3 className="font-bold text-white text-base">Company Recruiter</h3>
                <p className="text-xs text-slate-400 mt-1">
                  Draft job drives with hard constraints. Upon admin approval, manage ATS candidate table with ACID multi-select batch updates.
                </p>
              </div>
              <div className="mt-6 space-y-2">
                <button
                  onClick={() => onOpenAuth("REGISTER")}
                  className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow"
                >
                  Register as Recruiter
                </button>
                <button
                  onClick={() => onOpenAuth("LOGIN")}
                  className="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl"
                >
                  Sign In
                </button>
              </div>
            </div>

            {/* Admin Tile */}
            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex flex-col justify-between hover:border-purple-500/40 shadow-xl transition-all">
              <div>
                <div className="text-3xl mb-3">🛡️</div>
                <h3 className="font-bold text-white text-base">Placement Cell Admin</h3>
                <p className="text-xs text-slate-400 mt-1">
                  Super-user overseeing platform integrity. Vet recruiters, inspect job postings with feedback loops, view live KPIs and audit trails.
                </p>
              </div>
              <div className="mt-6 space-y-2">
                <button
                  onClick={() => onQuickLogin("admin@placement.edu", "Admin@1234", "ADMIN")}
                  className="w-full py-2 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-xl shadow"
                >
                  Sign In as Default Admin
                </button>
                <div className="text-[10px] text-slate-500 text-center">admin@placement.edu / Admin@1234</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- STUDENT VIEW ---
    function StudentView({ user, onRefreshNotifications }) {
      const [tab, setTab] = useState("JOBS");
      const [profile, setProfile] = useState(null);
      const [jobs, setJobs] = useState([]);
      const [apps, setApps] = useState([]);
      const [msg, setMsg] = useState({ text: "", type: "" });
      const [cgpa, setCgpa] = useState("");
      const [branch, setBranch] = useState("");
      const [gradYear, setGradYear] = useState("");
      const [resumeUrl, setResumeUrl] = useState("");

      useEffect(() => { loadData(); }, []);

      const loadData = async () => {
        try {
          const [p, j, a] = await Promise.all([
            api.getStudentProfile(),
            api.getStudentJobs(),
            api.getStudentApplications(),
          ]);
          setProfile(p);
          setCgpa(p.cgpa);
          setBranch(p.branch);
          setGradYear(p.graduation_year);
          setResumeUrl(p.resume_url || "");
          setJobs(j);
          setApps(a);
        } catch (e) {
          setMsg({ text: e.message, type: "error" });
        }
      };

      const handleUpdate = async (e) => {
        e.preventDefault();
        try {
          const updated = await api.updateStudentProfile({
            cgpa: parseFloat(cgpa) || 0.0,
            branch,
            graduation_year: parseInt(gradYear) || 2026,
            resume_url: resumeUrl || null,
          });
          setProfile(updated);
          setMsg({ text: "Profile updated! Real-time eligibility recomputed across job feed.", type: "success" });
          const newJobs = await api.getStudentJobs();
          setJobs(newJobs);
        } catch (e) {
          setMsg({ text: e.message, type: "error" });
        }
      };

      const handleApply = async (jobId) => {
        setMsg({ text: "", type: "" });
        try {
          await api.applyJob(jobId);
          setMsg({ text: "Application submitted successfully to ATS pipeline!", type: "success" });
          loadData();
        } catch (e) {
          setMsg({ text: e.message, type: "error" });
        }
      };

      const appliedIds = new Set(apps.map(a => a.job_id));

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-bold text-white">Student Applicant Dashboard</h1>
              <p className="text-xs text-slate-400 mt-1">
                Roll No: <span className="text-indigo-400 font-mono font-bold">{profile?.roll_number}</span> |
                CGPA: <span className="text-emerald-400 font-bold">{profile?.cgpa}</span> |
                Branch: <span className="text-sky-400 font-semibold">{profile?.branch}</span> |
                Graduation: <span className="text-purple-400 font-semibold">{profile?.graduation_year}</span>
              </p>
            </div>
            <div className="flex space-x-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700">
              <button
                onClick={() => setTab("JOBS")}
                className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${tab === "JOBS" ? "bg-indigo-600 text-white" : "text-slate-400 hover:text-white"}`}
              >
                Smart Job Board ({jobs.length})
              </button>
              <button
                onClick={() => setTab("APPS")}
                className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${tab === "APPS" ? "bg-indigo-600 text-white" : "text-slate-400 hover:text-white"}`}
              >
                My Applications ({apps.length})
              </button>
              <button
                onClick={() => setTab("PROFILE")}
                className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${tab === "PROFILE" ? "bg-indigo-600 text-white" : "text-slate-400 hover:text-white"}`}
              >
                Academic Profile
              </button>
            </div>
          </div>

          {msg.text && (
            <div className={`p-4 rounded-xl border text-xs whitespace-pre-line ${msg.type === "success" ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-300" : "bg-rose-500/10 border-rose-500/30 text-rose-300"}`}>
              {msg.text}
            </div>
          )}

          {tab === "JOBS" && (
            <div className="space-y-4">
              <h2 className="text-lg font-bold text-white">Active Placement Drives & Gating Engine</h2>
              {jobs.length === 0 ? (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-400">
                  No active recruitment drives at this moment.
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {jobs.map(job => {
                    const hasApplied = appliedIds.has(job.id);
                    return (
                      <div key={job.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between">
                        <div>
                          <div className="flex items-start justify-between">
                            <div>
                              <h3 className="font-bold text-white text-base">{job.title}</h3>
                              <div className="text-xs font-semibold text-indigo-400">{job.company_name}</div>
                            </div>
                            <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full border ${job.is_eligible ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/40" : "bg-amber-500/20 text-amber-300 border-amber-500/40"}`}>
                              {job.is_eligible ? "✓ Eligible" : "⚠ Ineligible"}
                            </span>
                          </div>
                          <p className="text-xs text-slate-300 mt-3 line-clamp-3">{job.description}</p>
                          <div className="mt-4 pt-3 border-t border-slate-800 flex flex-wrap gap-2 text-[11px]">
                            <span className="bg-slate-800 px-2 py-0.5 rounded text-slate-300">Min CGPA: <strong className="text-white">{job.min_cgpa.toFixed(1)}</strong></span>
                            <span className="bg-slate-800 px-2 py-0.5 rounded text-slate-300">Branches: <strong className="text-white">{job.allowed_branches?.length ? job.allowed_branches.join(", ") : "All"}</strong></span>
                            <span className="bg-slate-800 px-2 py-0.5 rounded text-slate-300">Batches: <strong className="text-white">{job.allowed_graduation_years?.length ? job.allowed_graduation_years.join(", ") : "All"}</strong></span>
                          </div>
                          {!job.is_eligible && job.reasons && (
                            <div className="mt-3 p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/20 text-[11px] text-amber-200">
                              <div className="font-semibold text-amber-300 mb-0.5">Missing Eligibility Criteria:</div>
                              <ul className="list-disc list-inside space-y-0.5 text-[10px]">
                                {job.reasons.map((r, i) => <li key={i}>{r}</li>)}
                              </ul>
                            </div>
                          )}
                        </div>
                        <div className="mt-5 pt-3 border-t border-slate-800 flex items-center justify-between">
                          <span className="text-[10px] text-slate-500">Posted {new Date(job.created_at).toLocaleDateString()}</span>
                          {hasApplied ? (
                            <span className="text-xs font-bold text-sky-400 bg-sky-500/10 border border-sky-500/30 px-3 py-1.5 rounded-lg">✓ Application Submitted</span>
                          ) : (
                            <button
                              onClick={() => handleApply(job.id)}
                              disabled={!job.is_eligible}
                              className={`text-xs font-bold px-4 py-2 rounded-xl transition-all ${job.is_eligible ? "bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/30" : "bg-slate-800 text-slate-500 cursor-not-allowed"}`}
                            >

                  You have not submitted applications to any position yet.

                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                  <table className="w-full text-left text-xs text-slate-300">
                    <thead className="bg-slate-800/80 text-slate-400 font-semibold border-b border-slate-700">
                      <tr>
                        <th className="p-3.5">Position Title</th>
                        <th className="p-3.5">Organization</th>
                        <th className="p-3.5">Applied Timestamp</th>
                        <th className="p-3.5">ATS Stage</th>

                    </thead>
                    <tbody className="divide-y divide-slate-800">

                          <td className="p-3.5 font-bold text-white">{app.job_title}</td>
                          <td className="p-3.5 text-indigo-300">{app.company_name}</td>
                          <td className="p-3.5 text-slate-400">{new Date(app.applied_at).toLocaleString()}</td>
                          <td className="p-3.5">

                              app.status === "SHORTLISTED" ? "bg-purple-500/20 text-purple-300 border border-purple-500/40" :
                              app.status === "UNDER_REVIEW" ? "bg-sky-500/20 text-sky-300 border border-sky-500/40" :
                              app.status === "REJECTED" ? "bg-rose-500/20 text-rose-300 border border-rose-500/40" :
                              "bg-slate-700 text-slate-300"

                  </table>

          {tab === "PROFILE" && (

                  <label className="block text-xs font-semibold text-slate-300 mb-1">Cumulative GPA (0.0 - 10.0)</label>
                  <input
                    type="number" step="0.01" min="0" max="10" value={cgpa}
                    onChange={e => setCgpa(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Academic Department / Branch</label>
                  <input
                    type="text" value={branch}
                    onChange={e => setBranch(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Graduation Batch Year</label>
                  <input
                    type="number" value={gradYear}
                    onChange={e => setGradYear(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                  />

                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Resume Link (HttpUrl Format)</label>
                  <input
                    type="url" value={resumeUrl}
                    onChange={e => setResumeUrl(e.target.value)}

    // --- RECRUITER VIEW ---
    function RecruiterView({ user }) {
      const [profile, setProfile] = useState(null);
      const [jobs, setJobs] = useState([]);
      const [selectedJob, setSelectedJob] = useState(null);
      const [apps, setApps] = useState([]);
      const [atsTotal, setAtsTotal] = useState(0);
      const [atsPage, setAtsPage] = useState(1);
      const [atsTotalPages, setAtsTotalPages] = useState(1);
      const [statusFilter, setStatusFilter] = useState("");
      const [branchFilter, setBranchFilter] = useState("");
      const [selectedAppIds, setSelectedAppIds] = useState([]);
      const [msg, setMsg] = useState({ text: "", type: "" });
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingJob, setEditingJob] = useState(null);
      const [title, setTitle] = useState("");
      const [desc, setDesc] = useState("");
      const [minCgpa, setMinCgpa] = useState("7.0");
      const [branches, setBranches] = useState("CSE, ECE, IT");
      const [batches, setBatches] = useState("2026");

      useEffect(() => { loadData(); }, []);

      useEffect(() => {
        if (selectedJob) loadApps(selectedJob.id, atsPage, statusFilter, branchFilter);
      }, [selectedJob, atsPage, statusFilter, branchFilter]);

      const loadData = async () => {
        try {
          const [p, j] = await Promise.all([api.getRecruiterProfile(), api.getRecruiterJobs()]);
          setProfile(p);
          setJobs(j);
          if (j.length > 0 && !selectedJob) setSelectedJob(j[0]);
        } catch (e) {
          setMsg({ text: e.message, type: "error" });
        }
      };

      const loadApps = async (jobId, page = 1, st = "", br = "") => {
        try {
          const data = await api.getJobApplications(jobId, page, 20, st, br);
          setApps(data.items);
          setAtsTotal(data.total);
          setAtsTotalPages(data.total_pages);
          setSelectedAppIds([]);
        } catch (e) {
          setMsg({ text: e.message, type: "error" });
        }
      };

      const handleSaveJob = async (e) => {
        e.preventDefault();
        const bArr = branches.split(",").map(b => b.trim()).filter(Boolean);
        const yArr = batches.split(",").map(y => parseInt(y.trim())).filter(y => !isNaN(y));
        try {
          if (editingJob) {
            await api.updateJob(editingJob.id, { title, description: desc, min_cgpa: parseFloat(minCgpa) || 0.0, allowed_branches: bArr, allowed_graduation_years: yArr });
            setMsg({ text: "Job updated!", type: "success" });
          } else {
            await api.createJob({ title, description: desc, min_cgpa: parseFloat(minCgpa) || 0.0, allowed_branches: bArr, allowed_graduation_years: yArr });
            setMsg({ text: "Job drafted successfully!", type: "success" });
          }
          setIsModalOpen(false);
          setEditingJob(null);
          loadData();
        } catch (e) {
          setMsg({ text: e.message, type: "error" });
        }
      };

      const handleBatch = async (st) => {
        if (selectedAppIds.length === 0) return alert("Select candidates using checkboxes.");
        try {
          const res = await api.batchUpdate(selectedJob.id, selectedAppIds, st);
          setMsg({ text: `ACID Batch Success: ${res.message}`, type: "success" });
          loadApps(selectedJob.id, atsPage, statusFilter, branchFilter);
        } catch (e) {
          setMsg({ text: `Batch Transaction Aborted: ${e.message}`, type: "error" });
        }
      };

      const isPending = profile?.status === "PENDING";

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-bold text-white">{profile?.company_name || user.name}</h1>
              <p className="text-xs text-slate-400 mt-1">
                Recruiter Portal | HR Lead: <strong className="text-white">{profile?.hr_name}</strong> | Status:{" "}
                <span className={`font-bold uppercase px-2 py-0.5 rounded text-[11px] ${profile?.status === "ACTIVE" ? "bg-emerald-500/20 text-emerald-300" : "bg-amber-500/20 text-amber-300"}`}>
                  {profile?.status}
                </span>
              </p>
            </div>
            <button
              onClick={() => {
                setEditingJob(null); setTitle(""); setDesc(""); setMinCgpa("7.0"); setBranches("CSE, ECE, IT"); setBatches("2026");
                setIsModalOpen(true);
              }}
              disabled={isPending}
              className={`py-2 px-4 rounded-xl text-xs font-bold transition-all ${isPending ? "bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700" : "bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30"}`}
            >
              + Draft New Position
            </button>
          </div>

          {isPending && (
            <div className="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-4 text-amber-300 text-xs flex items-center space-x-3">
              <span className="text-xl">⏳</span>
              <div>
                <strong>Account Pending Placement Cell Approval:</strong> Job creation and ATS actions are gated (HTTP 403) until an administrator activates your company account.
              </div>
            </div>
          )}

          {msg.text && (
            <div className={`p-4 rounded-xl border text-xs whitespace-pre-line ${msg.type === "success" ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-300" : "bg-rose-500/10 border-rose-500/30 text-rose-300"}`}>
              {msg.text}
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="space-y-4">
              <h2 className="text-lg font-bold text-white">Your Job Drives ({jobs.length})</h2>
              {jobs.length === 0 ? (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-400 text-xs">
                  No jobs drafted yet.
                </div>
              ) : (
                <div className="space-y-3">
                  {jobs.map(job => (
                    <div
                      key={job.id}
                      onClick={() => { setSelectedJob(job); setAtsPage(1); }}
                      className={`bg-slate-900 border rounded-2xl p-4 cursor-pointer transition-all ${selectedJob?.id === job.id ? "border-indigo-500 bg-slate-800/60 shadow-lg" : "border-slate-800 hover:border-slate-700"}`}
                    >
                      <div className="flex items-start justify-between">
                        <h3 className="font-bold text-white text-sm">{job.title}</h3>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                          job.status === "ACTIVE" ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/40" :
                          job.status === "PENDING_APPROVAL" ? "bg-amber-500/20 text-amber-300 border-amber-500/40" :
                          job.status === "REQUIRES_CHANGES" ? "bg-rose-500/20 text-rose-300 border-rose-500/40" :
                          job.status === "CLOSED" ? "bg-slate-700 text-slate-400 border-slate-600" :
                          "bg-sky-500/20 text-sky-300 border-sky-500/40"
                        }`}>
                          {job.status}
                        </span>
                      </div>
                      <p className="text-[11px] text-slate-400 mt-1 line-clamp-2">{job.description}</p>
                      {job.status === "REQUIRES_CHANGES" && job.admin_feedback && (
                        <div className="mt-2.5 p-2 bg-rose-500/10 border border-rose-500/30 rounded-lg text-[11px] text-rose-300">
                          <strong>Admin Feedback:</strong> {job.admin_feedback}
                        </div>
                      )}
                      <div className="mt-3 pt-2 border-t border-slate-800 flex items-center justify-between text-[11px]">
                        {(job.status === "DRAFT" || job.status === "REQUIRES_CHANGES") && (
                          <div className="flex space-x-1">
                            <button
                              onClick={(e) => {
                                e.stopPropagation(); setEditingJob(job); setTitle(job.title); setDesc(job.description);
                                setMinCgpa(job.min_cgpa.toString()); setBranches(job.allowed_branches?.join(", ") || ""); setBatches(job.allowed_graduation_years?.join(", ") || "");
                                setIsModalOpen(true);
                              }}
                              className="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 font-semibold"
                            >
                              Edit
                            </button>
                            <button
                              onClick={async (e) => {
                                e.stopPropagation();
                                await api.submitJob(job.id);
                                loadData();
                              }}
                              className="px-2 py-1 bg-indigo-600 hover:bg-indigo-500 rounded text-white font-bold"
                            >
                              Submit
                            </button>
                          </div>
                        )}
                        {job.status === "ACTIVE" && (
                          <button
                            onClick={async (e) => {
                              e.stopPropagation();
                              await api.closeJob(job.id);
                              loadData();
                            }}
                            className="px-2 py-1 bg-amber-600/30 text-amber-200 border border-amber-500/30 rounded"
                          >
                            Close Drive
                          </button>
                        )}
                        <button
                          onClick={async (e) => {
                            e.stopPropagation();
                            if (window.confirm("Soft delete this job? Applicants will receive automated background alerts.")) {
                              const r = await api.deleteJob(job.id);
                              setMsg({ text: r.message, type: "success" });
                              loadData();
                            }
                          }}
                          className="px-2 py-1 bg-rose-500/10 text-rose-300 rounded ml-auto"
                        >
                          Archive
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="lg:col-span-2 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 className="text-lg font-bold text-white">Applicant Tracking System (ATS) Pipeline</h2>
                  {selectedJob && <p className="text-xs text-indigo-400">Position: {selectedJob.title}</p>}
                </div>
                {selectedJob && (
                  <div className="flex items-center space-x-2">
                    <span className="text-xs text-slate-400">{selectedAppIds.length} selected</span>
                    <button onClick={() => handleBatch("SHORTLISTED")} className="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-lg">Shortlist All</button>
                    <button onClick={() => handleBatch("OFFERED")} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg">Offer All</button>
                    <button onClick={() => handleBatch("REJECTED")} className="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-lg">Reject All</button>
                  </div>
                )}
              </div>

              {selectedJob && (
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-wrap items-center gap-3 text-xs">
                  <span className="font-semibold text-slate-400">Filter:</span>
                  <select
                    value={statusFilter}
                    onChange={e => { setStatusFilter(e.target.value); setAtsPage(1); }}
                    className="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-white"
                  >
                    <option value="">All Stages</option>
                    <option value="APPLIED">Applied</option>
                    <option value="UNDER_REVIEW">Under Review</option>
                    <option value="SHORTLISTED">Shortlisted</option>
                    <option value="OFFERED">Offered</option>
                    <option value="REJECTED">Rejected</option>
                  </select>
                  <input
                    type="text" value={branchFilter}
                    onChange={e => { setBranchFilter(e.target.value); setAtsPage(1); }}
                    placeholder="Filter by branch..."
                    className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1 text-white placeholder-slate-500"
                  />
                  <span className="ml-auto text-slate-400">Total: {atsTotal}</span>
                </div>
              )}

              {!selectedJob ? (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-400">
                  Select a job on the left to inspect applicant candidates.
                </div>
              ) : apps.length === 0 ? (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-400 text-xs">
                  No applicants matching this query.
                </div>
              ) : (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                  <table className="w-full text-left text-xs text-slate-300">
                    <thead className="bg-slate-800/80 text-slate-400 font-semibold border-b border-slate-700">
                      <tr>
                        <th className="p-3 w-8">
                          <input
                            type="checkbox"
                            onChange={e => setSelectedAppIds(e.target.checked ? apps.map(a => a.id) : [])}
                            checked={selectedAppIds.length === apps.length && apps.length > 0}
                          />
                        </th>
                        <th className="p-3">Candidate</th>
                        <th className="p-3">CGPA</th>
                        <th className="p-3">Branch</th>
                        <th className="p-3">Resume Link</th>
                        <th className="p-3">ATS Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {apps.map(app => (
                        <tr key={app.id} className="hover:bg-slate-800/40">
                          <td className="p-3">
                            <input
                              type="checkbox"
                              checked={selectedAppIds.includes(app.id)}
                              onChange={() => setSelectedAppIds(prev => prev.includes(app.id) ? prev.filter(i => i !== app.id) : [...prev, app.id])}
                            />
                          </td>
                          <td className="p-3">
                            <div className="font-bold text-white">{app.student?.full_name}</div>
                            <div className="text-[10px] text-slate-400">{app.student?.roll_number}</div>
                          </td>
                          <td className="p-3 font-bold text-emerald-400">{app.student?.cgpa.toFixed(2)}</td>
                          <td className="p-3">{app.student?.branch}</td>
                          <td className="p-3">
                            {app.student?.resume_url ? (
                              <a href={app.student.resume_url} target="_blank" rel="noreferrer" className="text-indigo-400 hover:underline">View PDF</a>
                            ) : <span className="text-slate-500">None</span>}
                          </td>
                          <td className="p-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                              app.status === "OFFERED" ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40" :
                              app.status === "SHORTLISTED" ? "bg-purple-500/20 text-purple-300 border border-purple-500/40" :
                              app.status === "UNDER_REVIEW" ? "bg-sky-500/20 text-sky-300 border border-sky-500/40" :
                              app.status === "REJECTED" ? "bg-rose-500/20 text-rose-300 border border-rose-500/40" :
                              "bg-slate-700 text-slate-300"
                            }`}>
                              {app.status}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div className="p-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                    <span>Page {atsPage} of {atsTotalPages}</span>
                    <div className="flex space-x-2">
                      <button onClick={() => setAtsPage(p => Math.max(1, p - 1))} disabled={atsPage <= 1} className="px-3 py-1 bg-slate-800 rounded disabled:opacity-40">Previous</button>
                      <button onClick={() => setAtsPage(p => Math.min(atsTotalPages, p + 1))} disabled={atsPage >= atsTotalPages} className="px-3 py-1 bg-slate-800 rounded disabled:opacity-40">Next</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>

          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl p-6 text-white shadow-2xl relative">
                <button onClick={() => setIsModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                <h2 className="text-xl font-bold mb-1">{editingJob ? "Edit Job Drive" : "Targeted Job Creator"}</h2>
                <p className="text-xs text-slate-400 mb-4">Hard constraints checked by the server eligibility gatekeeper.</p>
                <form onSubmit={handleSaveJob} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold mb-1">Position Title</label>
                    <input type="text" required value={title} onChange={e => setTitle(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1">Role Description</label>
                    <textarea rows="3" required value={desc} onChange={e => setDesc(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold mb-1">Minimum CGPA</label>
                      <input type="number" step="0.1" value={minCgpa} onChange={e => setMinCgpa(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1">Batches</label>
                      <input type="text" value={batches} onChange={e => setBatches(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1">Eligible Branches (comma separated)</label>
                    <input type="text" value={branches} onChange={e => setBranches(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs" />
                  </div>
                  <button type="submit" className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-xs shadow-lg">Save Job</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- ADMIN VIEW ---
    function AdminView({ user }) {
      const [tab, setTab] = useState("VETTING");
      const [metrics, setMetrics] = useState(null);
      const [pendingRecruiters, setPendingRecruiters] = useState([]);
      const [pendingJobs, setPendingJobs] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [auditPage, setAuditPage] = useState(1);
      const [auditTotalPages, setAuditTotalPages] = useState(1);
      const [msg, setMsg] = useState({ text: "", type: "" });
      const [feedbackModal, setFeedbackModal] = useState(null);
      const [feedbackText, setFeedbackText] = useState("");

      useEffect(() => { loadData(); }, []);
      useEffect(() => { if (tab === "AUDIT") loadLogs(auditPage); }, [tab, auditPage]);

      const loadData = async () => {
        try {
          const [m, r, j] = await Promise.all([api.getMetrics(), api.getPendingRecruiters(), api.getPendingJobs()]);
          setMetrics(m);
          setPendingRecruiters(r);
          setPendingJobs(j);
        } catch (e) {
          setMsg({ text: e.message, type: "error" });
        }
      };

      const loadLogs = async (p = 1) => {
        try {
          const data = await api.getAuditLogs(p);
          setAuditLogs(data.items);
          setAuditTotalPages(data.total_pages);
        } catch (e) {
          setMsg({ text: e.message, type: "error" });
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center space-x-2">
                <h1 className="text-2xl font-bold text-white">Placement Cell Admin Console</h1>
                <span className="px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 text-xs font-bold border border-purple-500/30">Super-User</span>
              </div>
              <p className="text-xs text-slate-400 mt-1">Platform integrity, recruiter vetting, job vetting with feedback loop, and immutable audit trails.</p>
            </div>
            <div className="flex space-x-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700">
              <button onClick={() => setTab("VETTING")} className={`px-3 py-1.5 text-xs font-bold rounded-lg ${tab === "VETTING" ? "bg-indigo-600 text-white" : "text-slate-400"}`}>Pending Recruiters ({pendingRecruiters.length})</button>
              <button onClick={() => setTab("JOBS")} className={`px-3 py-1.5 text-xs font-bold rounded-lg ${tab === "JOBS" ? "bg-indigo-600 text-white" : "text-slate-400"}`}>Job Queue ({pendingJobs.length})</button>
              <button onClick={() => setTab("AUDIT")} className={`px-3 py-1.5 text-xs font-bold rounded-lg ${tab === "AUDIT" ? "bg-indigo-600 text-white" : "text-slate-400"}`}>Audit Trail</button>
            </div>
          </div>

          {msg.text && (
            <div className={`p-4 rounded-xl border text-xs whitespace-pre-line ${msg.type === "success" ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-300" : "bg-rose-500/10 border-rose-500/30 text-rose-300"}`}>
              {msg.text}
            </div>
          )}

          {metrics && (
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 shadow">
                <div className="text-[11px] text-slate-400">Total Students</div>
                <div className="text-xl font-bold text-white mt-1">{metrics.total_students}</div>
              </div>
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 shadow">
                <div className="text-[11px] text-slate-400">Active Companies</div>
                <div className="text-xl font-bold text-emerald-400 mt-1">{metrics.active_recruiters}</div>
              </div>
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 shadow">
                <div className="text-[11px] text-slate-400">Pending Approvals</div>
                <div className="text-xl font-bold text-amber-400 mt-1">{metrics.pending_recruiters}</div>
              </div>
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 shadow">
                <div className="text-[11px] text-slate-400">Active Drives</div>
                <div className="text-xl font-bold text-indigo-400 mt-1">{metrics.active_jobs}</div>
              </div>
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 shadow">
                <div className="text-[11px] text-slate-400">Applications</div>
                <div className="text-xl font-bold text-sky-400 mt-1">{metrics.total_applications}</div>
              </div>
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 shadow">
                <div className="text-[11px] text-slate-400">Conversion Rate</div>
                <div className="text-xl font-bold text-purple-400 mt-1">{metrics.conversion_rate_percentage.toFixed(1)}%</div>
              </div>
            </div>
          )}

          {tab === "VETTING" && (
            <div className="space-y-4">
              <h2 className="text-lg font-bold text-white">Recruiter Company Staging Queue</h2>
              {pendingRecruiters.length === 0 ? (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-400 text-xs">
                  ✓ All recruiter applications processed. Queue is clear!
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {pendingRecruiters.map(r => (
                    <div key={r.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between">
                      <div>
                        <div className="flex items-start justify-between">
                          <h3 className="font-bold text-white text-base">{r.company_name}</h3>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300">PENDING</span>
                        </div>
                        <div className="text-xs text-slate-300 mt-2 space-y-0.5">
                          <div>HR Lead: <strong>{r.hr_name}</strong></div>
                          <div>Email: <span className="text-indigo-400">{r.email}</span></div>
                          <div className="text-[10px] text-slate-500">Registered {new Date(r.created_at).toLocaleString()}</div>
                        </div>
                      </div>
                      <div className="mt-4 pt-3 border-t border-slate-800 flex space-x-2">
                        <button
                          onClick={async () => {
                            await api.approveRecruiter(r.id);
                            setMsg({ text: `Approved recruiter: ${r.company_name}. Audit log recorded.`, type: "success" });
                            loadData();
                          }}
                          className="w-1/2 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs"
                        >
                          ✓ Approve
                        </button>
                        <button
                          onClick={async () => {
                            await api.rejectRecruiter(r.id);
                            setMsg({ text: `Rejected recruiter: ${r.company_name}. Audit log recorded.`, type: "success" });
                            loadData();
                          }}
                          className="w-1/2 py-2 rounded-xl bg-rose-600/30 text-rose-300 border border-rose-500/30 text-xs font-bold"
                        >
                          Reject
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {tab === "JOBS" && (
            <div className="space-y-4">
              <h2 className="text-lg font-bold text-white">Job Drive Vetting & Feedback Loop</h2>
              {pendingJobs.length === 0 ? (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-400 text-xs">
                  ✓ No pending jobs in review queue.
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {pendingJobs.map(job => (
                    <div key={job.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between">
                      <div>
                        <div className="flex items-start justify-between">
                          <div>
                            <h3 className="font-bold text-white text-base">{job.title}</h3>
                            <div className="text-xs font-semibold text-indigo-400">{job.company_name}</div>
                          </div>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300">PENDING_APPROVAL</span>
                        </div>
                        <p className="text-xs text-slate-300 mt-2 line-clamp-3">{job.description}</p>
                        <div className="mt-3 pt-2 border-t border-slate-800 text-[11px] text-slate-400 space-y-0.5">
                          <div>Min CGPA: <strong className="text-white">{job.min_cgpa.toFixed(1)}</strong></div>
                          <div>Allowed Branches: <strong className="text-white">{job.allowed_branches?.join(", ") || "All"}</strong></div>
                          <div>Allowed Batches: <strong className="text-white">{job.allowed_graduation_years?.join(", ") || "All"}</strong></div>
                        </div>
                      </div>
                      <div className="mt-4 pt-3 border-t border-slate-800 flex space-x-2">
                        <button
                          onClick={async () => {
                            await api.approveJob(job.id);
                            setMsg({ text: `Approved job: ${job.title}. Audit log recorded.`, type: "success" });
                            loadData();
                          }}
                          className="w-1/2 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs"
                        >
                          ✓ Approve Post
                        </button>
                        <button
                          onClick={() => { setFeedbackModal(job); setFeedbackText(""); }}
                          className="w-1/2 py-2 rounded-xl bg-amber-600/30 text-amber-300 border border-amber-500/30 font-bold text-xs"
                        >
                          Request Changes
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {tab === "AUDIT" && (
            <div className="space-y-4">
              <h2 className="text-lg font-bold text-white">Immutable Administrative Audit Log</h2>
              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <table className="w-full text-left text-xs text-slate-300">
                  <thead className="bg-slate-800/80 text-slate-400 font-semibold border-b border-slate-700">
                    <tr>
                      <th className="p-3">Timestamp (UTC)</th>
                      <th className="p-3">Admin Authority</th>
                      <th className="p-3">Action</th>
                      <th className="p-3">Target</th>
                      <th className="p-3">Details</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {auditLogs.map(l => (
                      <tr key={l.id} className="hover:bg-slate-800/40">
                        <td className="p-3 font-mono text-slate-400">{new Date(l.timestamp).toLocaleString()}</td>
                        <td className="p-3 text-indigo-300">{l.admin_email}</td>
                        <td className="p-3"><span className="px-2 py-0.5 rounded bg-slate-800 text-white font-mono text-[10px]">{l.action}</span></td>
                        <td className="p-3 font-bold text-slate-200">{l.target_entity} #{l.target_id}</td>
                        <td className="p-3 text-slate-300 max-w-xs truncate">{l.details}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div className="p-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                  <span>Page {auditPage} of {auditTotalPages}</span>
                  <div className="flex space-x-2">
                    <button onClick={() => setAuditPage(p => Math.max(1, p - 1))} disabled={auditPage <= 1} className="px-3 py-1 bg-slate-800 rounded disabled:opacity-40">Previous</button>
                    <button onClick={() => setAuditPage(p => Math.min(auditTotalPages, p + 1))} disabled={auditPage >= auditTotalPages} className="px-3 py-1 bg-slate-800 rounded disabled:opacity-40">Next</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {feedbackModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-6 text-white relative">
                <button onClick={() => setFeedbackModal(null)} className="absolute top-4 right-4 text-slate-400">✕</button>
                <h2 className="text-xl font-bold mb-1">Statechart Feedback Loop</h2>
                <p className="text-xs text-slate-400 mb-4">Set status to <strong>REQUIRES_CHANGES</strong> with feedback for "{feedbackModal.title}".</p>
                <textarea
                  rows="4" required value={feedbackText} onChange={e => setFeedbackText(e.target.value)}
                  placeholder="Specify corrections needed before approval..."
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs mb-4"
                />
                <div className="flex space-x-2">
                  <button onClick={() => setFeedbackModal(null)} className="w-1/2 py-2 rounded-xl bg-slate-800 text-xs">Cancel</button>
                  <button
                    onClick={async () => {
                      if (!feedbackText.trim()) return alert("Feedback is required.");
                      await api.requestChanges(feedbackModal.id, feedbackText);
                      setFeedbackModal(null);
                      setMsg({ text: `Requested changes for "${feedbackModal.title}". Audit log created.`, type: "success" });
                      loadData();
                    }}
                    className="w-1/2 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 font-bold text-xs"
                  >
                    Send Feedback
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- NOTIFICATION MODAL ---
    function NotificationModal({ isOpen, onClose, notifications, onRefresh }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-end bg-black/50 backdrop-blur-sm p-4">
          <div className="bg-slate-900 border border-slate-800 w-full max-w-md h-full max-h-[90vh] rounded-2xl p-6 shadow-2xl relative text-white flex flex-col">
            <div className="flex items-center justify-between pb-4 border-b border-slate-800">
              <div>
                <h2 className="text-lg font-bold text-white">Student Alert Inbox</h2>
                <p className="text-[11px] text-slate-400">FastAPI Asynchronous Background Observer Alerts</p>
              </div>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white">✕</button>
            </div>
            <div className="flex-1 overflow-y-auto py-4 space-y-3">
              {notifications.length === 0 ? (
                <div className="text-center text-slate-500 py-12 text-xs">No alerts in your inbox.</div>
              ) : (
                notifications.map(n => (
                  <div key={n.id} className={`p-3.5 rounded-xl border ${n.is_read ? "bg-slate-800/40 border-slate-800 text-slate-400" : "bg-indigo-950/20 border-indigo-500/40 text-slate-200"}`}>
                    <div className="flex items-start justify-between">
                      <div className="font-bold text-xs text-white">{n.title}</div>
                      {!n.is_read && (
                        <button
                          onClick={async () => { await api.markNotificationRead(n.id); onRefresh(); }}
                          className="text-[10px] text-indigo-400 hover:underline"
                        >
                          Mark read
                        </button>
                      )}
                    </div>
                    <p className="text-xs mt-1 text-slate-300">{n.message}</p>
                    <div className="text-[10px] text-slate-500 mt-2">{new Date(n.created_at).toLocaleString()}</div>
                  </div>
                ))
              )}
            </div>
            <button onClick={onClose} className="w-full py-2 rounded-xl bg-slate-800 text-xs font-semibold">Close</button>
          </div>
        </div>
      );
    }

    // --- AUTH MODAL ---
    function AuthModal({ isOpen, initialMode, onClose, onSuccess }) {
      if (!isOpen) return null;
      const [mode, setMode] = useState(initialMode);
      const [role, setRole] = useState("STUDENT");
      const [err, setErr] = useState("");
      const [loading, setLoading] = useState(false);
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [fullName, setFullName] = useState("");
      const [rollNumber, setRollNumber] = useState("");
      const [cgpa, setCgpa] = useState("8.5");
      const [branch, setBranch] = useState("CSE");
      const [gradYear, setGradYear] = useState("2026");
      const [resumeUrl, setResumeUrl] = useState("https://drive.google.com/resume.pdf");
      const [companyName, setCompanyName] = useState("");
      const [hrName, setHrName] = useState("");

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErr("");
        setLoading(true);
        try {
          let res;
          if (mode === "LOGIN") {
            res = await api.login({ email, password, role });
          } else {
            if (role === "STUDENT") {
              res = await api.registerStudent({ email, password, full_name: fullName, roll_number: rollNumber, cgpa: parseFloat(cgpa) || 0.0, branch, graduation_year: parseInt(gradYear) || 2026, resume_url: resumeUrl || null });
            } else {
              res = await api.registerRecruiter({ email, password, company_name: companyName, hr_name: hrName });
            }
          }
          setStoredToken(res.access_token);
          const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
          setStoredUser(u);
          onSuccess(u);
          onClose();
        } catch (e) {
          setErr(e.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
          <div className="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl relative text-white">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400">✕</button>
            <h2 className="text-xl font-bold mb-1">{mode === "LOGIN" ? "Sign In" : "Register New Account"}</h2>
            <p className="text-xs text-slate-400 mb-4">Stateless JWT claims & isolated table routing.</p>
            <div className="grid grid-cols-2 gap-1 p-1 bg-slate-800 rounded-xl mb-4">
              <button type="button" onClick={() => { setMode("LOGIN"); setErr(""); }} className={`py-1.5 text-xs font-bold rounded-lg ${mode === "LOGIN" ? "bg-indigo-600 text-white" : "text-slate-400"}`}>Sign In</button>
              <button type="button" onClick={() => { setMode("REGISTER"); setErr(""); }} className={`py-1.5 text-xs font-bold rounded-lg ${mode === "REGISTER" ? "bg-indigo-600 text-white" : "text-slate-400"}`}>Register</button>
            </div>
            <div className="mb-4">
              <label className="block text-xs font-semibold text-slate-300 mb-1">Role Context</label>
              <div className="grid grid-cols-3 gap-2">
                {["STUDENT", "RECRUITER", "ADMIN"].map(r => (
                  <button
                    key={r} type="button" onClick={() => setRole(r)} disabled={mode === "REGISTER" && r === "ADMIN"}
                    className={`py-2 text-xs font-bold rounded-lg border ${role === r ? "border-indigo-500 bg-indigo-500/20 text-indigo-300" : "border-slate-700 bg-slate-800 text-slate-400"} ${mode === "REGISTER" && r === "ADMIN" ? "opacity-30 cursor-not-allowed" : ""}`}
                  >
                    {r}
                  </button>
                ))}
              </div>
            </div>
            {err && <div className="mb-4 p-3 rounded-lg bg-rose-500/20 border border-rose-500/40 text-xs text-rose-300 whitespace-pre-line">{err}</div>}
            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-xs text-slate-300 mb-1">Email</label>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
              </div>
              <div>
                <label className="block text-xs text-slate-300 mb-1">Password</label>
                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
              </div>
              {mode === "REGISTER" && role === "STUDENT" && (
                <>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Full Name</label>
                      <input type="text" required value={fullName} onChange={e => setFullName(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Roll Number</label>
                      <input type="text" required value={rollNumber} onChange={e => setRollNumber(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">CGPA</label>
                      <input type="number" step="0.01" value={cgpa} onChange={e => setCgpa(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Branch</label>
                      <input type="text" value={branch} onChange={e => setBranch(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">Batch</label>
                      <input type="number" value={gradYear} onChange={e => setGradYear(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">Resume Link (HttpUrl)</label>
                    <input type="url" value={resumeUrl} onChange={e => setResumeUrl(e.target.value)} placeholder="https://drive.google.com/..." className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                  </div>
                </>
              )}
              {mode === "REGISTER" && role === "RECRUITER" && (
                <>
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">Company Name</label>
                    <input type="text" required value={companyName} onChange={e => setCompanyName(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">HR Lead Name</label>
                    <input type="text" required value={hrName} onChange={e => setHrName(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                  </div>
                </>
              )}
              <button type="submit" disabled={loading} className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-xs shadow-lg text-white">
                {loading ? "Processing..." : mode === "LOGIN" ? `Sign In as ${role}` : "Register"}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
