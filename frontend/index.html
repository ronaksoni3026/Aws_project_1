                        <td className="py-3 px-3 font-bold text-indigo-400">{r.jobs_count || 0}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 4: AUDIT TRAIL */}
          {activeTab === "AUDIT" && (
            <div className="company-card rounded-2xl p-6 space-y-4 text-left">
              <div className="flex items-center justify-between pb-3 border-b border-white/[0.08]">
                <h3 className="font-extrabold text-white text-sm">Cryptographic Application-Level Audit Logs</h3>
                <span className="text-[11px] text-gray-400 font-mono">APPEND-ONLY INTEGRITY</span>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-white/[0.08] text-gray-400 uppercase text-[10px]">
                      <th className="py-2.5 px-3">Timestamp</th>
                      <th className="py-2.5 px-3">Admin</th>
                      <th className="py-2.5 px-3">Action</th>
                      <th className="py-2.5 px-3">Entity</th>
                      <th className="py-2.5 px-3">Details</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-white/[0.05] font-mono text-[11px]">
                    {auditLogs.map((log) => (
                      <tr key={log.id} className="hover:bg-gray-900/40">
                        <td className="py-2.5 px-3 text-gray-400">{new Date(log.timestamp).toLocaleString()}</td>
                        <td className="py-2.5 px-3 text-purple-300">{log.admin_email}</td>
                        <td className="py-2.5 px-3 font-bold text-white">{log.action}</td>
                        <td className="py-2.5 px-3 text-cyan-400">{log.target_entity} #{log.target_id}</td>
                        <td className="py-2.5 px-3 text-gray-300 font-sans">{log.details}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* REQUEST CHANGES MODAL */}
          {feedbackModalJob && (
            <RequestFeedbackModal
              job={feedbackModalJob}
              onClose={() => setFeedbackModalJob(null)}
              onSuccess={() => {
                setFeedbackModalJob(null);
                addToast("Change request dispatched to recruiter.", "info");
                loadAdminData();
              }}
              addToast={addToast}
            />
          )}
        </div>
      );
    }

    // --- REQUEST FEEDBACK MODAL ---
    function RequestFeedbackModal({ job, onClose, onSuccess, addToast }) {
      const [feedback, setFeedback] = useState("");
      const [sending, setSending] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSending(true);
        try {
          await api.requestChanges(job.id, feedback);
          onSuccess();
        } catch (err) {
          addToast(`Error: ${err.message}`, "error");
        } finally {
          setSending(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
          <div className="company-card rounded-2xl max-w-md w-full p-6 text-left border border-white/10 shadow-2xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-white/10">
              <h3 className="font-extrabold text-base text-white">Request Job Corrections</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-gray-400 font-semibold mb-1">
                  Mandatory Correction Feedback for {job.company_name}
                </label>
                <textarea
                  required
                  rows={4}
                  placeholder="Explain requested corrections (e.g. adjust minimum CGPA, clarify branch requirements)..."
                  value={feedback}
                  onChange={(e) => setFeedback(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-amber-500"
                />
              </div>

              <div className="pt-2 flex gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-gray-300 font-bold border border-white/5"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={sending}
                  className="btn-shine flex-1 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold disabled:opacity-50"
                >
                  {sending ? "Sending..." : "Submit Feedback"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- CHANGE PASSWORD MODAL ---
    function ChangePasswordModal({ isOpen, onClose, addToast }) {
      const [oldPassword, setOldPassword] = useState("");
      const [newPassword, setNewPassword] = useState("");
      const [saving, setSaving] = useState(false);

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          await api.changePassword({ old_password: oldPassword, new_password: newPassword });
          addToast("Password updated successfully!", "success");
          onClose();
        } catch (err) {
          addToast(`Error: ${err.message}`, "error");
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
          <div className="company-card rounded-2xl max-w-sm w-full p-6 text-left border border-white/10 shadow-2xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-white/10">
              <h3 className="font-extrabold text-base text-white">Change Password</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-gray-400 font-semibold mb-1">Current Password</label>
                <input
                  type="password"
                  required
                  value={oldPassword}
                  onChange={(e) => setOldPassword(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">New Password (Min 6 characters)</label>
                <input
                  type="password"
                  required
                  minLength={6}
                  value={newPassword}
                  onChange={(e) => setNewPassword(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="pt-2 flex gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-gray-300 font-bold border border-white/5"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="btn-shine flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold disabled:opacity-50"
                >
                  {saving ? "Updating..." : "Confirm Update"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- NOTIFICATION MODAL ---
    function NotificationModal({ isOpen, onClose, notifications, onRefresh }) {
      if (!isOpen) return null;

      const handleMarkRead = async (id) => {
        try {
          await api.markNotificationRead(id);
          onRefresh();
        } catch (e) {}
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
          <div className="company-card rounded-2xl max-w-md w-full p-6 text-left border border-white/10 shadow-2xl space-y-4 max-h-[80vh] flex flex-col">
            <div className="flex items-center justify-between pb-3 border-b border-white/10">
              <h3 className="font-extrabold text-base text-white">Student Alert Inbox</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-2.5 pr-1">
              {notifications.length === 0 ? (
                <div className="py-8 text-center text-gray-400 text-xs">No alerts in your inbox.</div>
              ) : (
                notifications.map((n) => (
                  <div
                    key={n.id}
                    className={`p-3.5 rounded-xl border text-xs space-y-1.5 transition-all ${
                      n.is_read
                        ? "bg-gray-900/40 border-gray-800 text-gray-400"
                        : "bg-indigo-950/40 border-indigo-700/50 text-gray-200"
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <div className="font-bold text-white text-xs">{n.title}</div>
                      {!n.is_read && (
                        <button
                          onClick={() => handleMarkRead(n.id)}
                          className="text-[10px] text-cyan-400 hover:underline font-bold"
                        >
                          Mark as read
                        </button>
                      )}
                    </div>
                    <div className="text-[11px] leading-relaxed">{n.message}</div>
                    <div className="text-[10px] text-gray-500 font-mono">
                      {new Date(n.created_at).toLocaleString()}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- AUTH MODAL ---
    // --- AUTH MODAL ---
    function AuthModal({ isOpen, initialMode, initialRole, onClose, onSuccess }) {
      const [mode, setMode] = useState(initialMode || "LOGIN");
      const [role, setRole] = useState(initialRole || "STUDENT");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [fullName, setFullName] = useState("");
      const [rollNumber, setRollNumber] = useState("");
      const [cgpa, setCgpa] = useState(8.0);
      const [branch, setBranch] = useState("CSE");
      const [gradYear, setGradYear] = useState(2025);
      const [companyName, setCompanyName] = useState("");
      const [hrName, setHrName] = useState("");
      const [error, setError] = useState("");
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        if (isOpen) {
          if (initialMode) setMode(initialMode);
          if (initialRole) setRole(initialRole);
          setError("");
        }
      }, [isOpen, initialMode, initialRole]);

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError("");
        setSubmitting(true);

        try {
          if (mode === "LOGIN") {
            const res = await api.login({ email, password, role });
            setStoredToken(res.access_token);
            const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
            setStoredUser(u);
            onSuccess(u);
            onClose();
          } else if (mode === "REGISTER_STUDENT") {
            const res = await api.registerStudent({
              email,
              password,
              full_name: fullName,
              roll_number: rollNumber,
              cgpa: parseFloat(cgpa),
              branch,
              graduation_year: parseInt(gradYear),
            });
            setStoredToken(res.access_token);
            const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
            setStoredUser(u);
            onSuccess(u);
            onClose();
          } else if (mode === "REGISTER_RECRUITER") {
            const res = await api.registerRecruiter({
              email,
              password,
              company_name: companyName,
              hr_name: hrName,
            });
            setStoredToken(res.access_token);
            const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
            setStoredUser(u);
            onSuccess(u);
            onClose();
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setSubmitting(false);
        }
      };

      const getSubmitBtnStyle = () => {
        if (mode !== "LOGIN") return "bg-blue-600 hover:bg-blue-700";
        if (role === "STUDENT") return "bg-blue-600 hover:bg-blue-700";
        if (role === "RECRUITER") return "bg-emerald-600 hover:bg-emerald-700";
        if (role === "ADMIN") return "bg-purple-600 hover:bg-purple-700";
        return "bg-blue-600 hover:bg-blue-700";
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-xl max-w-md w-full p-6 text-left border border-slate-200 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between pb-3 border-b border-slate-200">
              <h3 className="font-bold text-base text-slate-900">
                {mode === "LOGIN"
                  ? "Sign In • Campus Placement Portal"
                  : mode === "REGISTER_STUDENT"
                  ? "Register Student Applicant"
                  : "Register Partner Recruiter"}
              </h3>
              <button
                type="button"
                onClick={onClose}
                className="text-slate-400 hover:text-slate-600 text-base font-bold leading-none"
              >
                ✕
              </button>
            </div>

            {error && (
              <div className="p-3.5 rounded-lg bg-red-50 border border-red-200 text-red-700 text-xs whitespace-pre-line">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              {mode === "LOGIN" && (
                <div>
                  <label className="block text-slate-700 font-semibold mb-1.5">Portal Role</label>
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { id: "STUDENT", label: "Student", activeClass: "bg-blue-600 text-white" },
                      { id: "RECRUITER", label: "Company", activeClass: "bg-emerald-600 text-white" },
                      { id: "ADMIN", label: "Admin", activeClass: "bg-purple-600 text-white" },
                    ].map((item) => (
                      <button
                        type="button"
                        key={item.id}
                        onClick={() => setRole(item.id)}
                        className={`py-2 rounded-lg font-semibold text-xs transition-colors ${
                          role === item.id
                            ? `${item.activeClass} shadow-sm`
                            : "bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200"
                        }`}
                      >
                        {item.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {mode === "REGISTER_STUDENT" && (
                <>
                  <div>
                    <label className="block text-slate-700 font-semibold mb-1">Full Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Ronak Soni"
                      value={fullName}
                      onChange={(e) => setFullName(e.target.value)}
                      className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-700 font-semibold mb-1">Roll Number</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. 21CS001"
                        value={rollNumber}
                        onChange={(e) => setRollNumber(e.target.value)}
                        className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-700 font-semibold mb-1">Academic CGPA</label>
                      <input
                        type="number"
                        step="0.01"
                        min="0"
                        max="10"
                        required
                        value={cgpa}
                        onChange={(e) => setCgpa(e.target.value)}
                        className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-700 font-semibold mb-1">Branch</label>
                      <select
                        value={branch}
                        onChange={(e) => setBranch(e.target.value)}
                        className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                      >
                        <option value="CSE">CSE</option>
                        <option value="ECE">ECE</option>
                        <option value="IT">IT</option>
                        <option value="ME">ME</option>
                        <option value="CE">CE</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-700 font-semibold mb-1">Batch Year</label>
                      <input
                        type="number"
                        required
                        value={gradYear}
                        onChange={(e) => setGradYear(e.target.value)}
                        className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                      />
                    </div>
                  </div>
                </>
              )}

              {mode === "REGISTER_RECRUITER" && (
                <>
                  <div>
                    <label className="block text-slate-700 font-semibold mb-1">Company Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Amazon Web Services"
                      value={companyName}
                      onChange={(e) => setCompanyName(e.target.value)}
                      className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-700 font-semibold mb-1">HR Representative Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Priya Sharma"
                      value={hrName}
                      onChange={(e) => setHrName(e.target.value)}
                      className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                    />
                  </div>
                </>
              )}

              <div>
                <label className="block text-slate-700 font-semibold mb-1">Email Address</label>
                <input
                  type="email"
                  required
                  placeholder="name@placement.edu"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                />
              </div>

              <div>
                <label className="block text-slate-700 font-semibold mb-1">Password</label>
                <input
                  type="password"
                  required
                  placeholder="••••••••"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                />
              </div>

              <div className="pt-2">
                <button
                  type="submit"
                  disabled={submitting}
                  className={`w-full py-2.5 rounded-lg text-white font-semibold text-xs transition-colors shadow-sm disabled:opacity-50 ${getSubmitBtnStyle()}`}
                >
                  {submitting
                    ? "Validating..."
                    : mode === "LOGIN"
                    ? "Sign In"
                    : "Create Account"}
                </button>
              </div>

              <div className="pt-2 text-center text-xs text-slate-500 space-y-1.5">
                {mode === "LOGIN" ? (
                  <>
                    <div>
                      Student applicant?{" "}
                      <button
                        type="button"
                        onClick={() => { setMode("REGISTER_STUDENT"); setError(""); }}
                        className="text-blue-600 hover:underline font-semibold"
                      >
                        Register as Student
                      </button>
                    </div>
                    <div>
                      Company recruiter?{" "}
                      <button
                        type="button"
                        onClick={() => { setMode("REGISTER_RECRUITER"); setError(""); }}
                        className="text-emerald-600 hover:underline font-semibold"
                      >
                        Register Organization
                      </button>
                    </div>
                  </>
                ) : (
                  <div>
                    Already registered?{" "}
                    <button
                      type="button"
                      onClick={() => { setMode("LOGIN"); setError(""); }}
                      className="text-blue-600 hover:underline font-semibold"
                    >
                      Sign In here
                    </button>
                  </div>
                )}
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render into root
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
