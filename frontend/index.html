<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Placement Portal • Institutional Campus Placement Portal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for runtime JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gradient-border {
      position: relative;
    }
    .gradient-border::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(to bottom right, rgba(99, 102, 241, 0.4), rgba(168, 85, 247, 0.1), rgba(14, 165, 233, 0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f293d;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 antialiased selection:bg-indigo-500 selection:text-white min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- React Application Core -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- API CLIENT ---
    const API_BASE = "/api";
    const getStoredToken = () => localStorage.getItem("placement_token");
    const setStoredToken = (t) => localStorage.setItem("placement_token", t);
    const removeStoredToken = () => {
      localStorage.removeItem("placement_token");
      localStorage.removeItem("placement_user");
    };
    const getStoredUser = () => {
      const u = localStorage.getItem("placement_user");
      return u ? JSON.parse(u) : null;
    };
    const setStoredUser = (u) => localStorage.setItem("placement_user", JSON.stringify(u));

    async function apiRequest(endpoint, options = {}) {
      const token = getStoredToken();
      const headers = { ...(options.headers || {}) };

      if (!(options.body instanceof FormData) && !headers["Content-Type"]) {
        headers["Content-Type"] = "application/json";
      }
      if (token) {
        headers["Authorization"] = `Bearer ${token}`;
      }

      const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        let msg = "A server error occurred.";
        if (data.detail) {
          if (typeof data.detail === "object" && data.detail.reasons) {
            msg = `Eligibility Criteria Unmet:\n• ` + data.detail.reasons.join("\n• ");
          } else if (typeof data.detail === "object") {
            msg = data.detail.message || JSON.stringify(data.detail);
          } else {
            msg = data.detail;
          }
        }
        const err = new Error(msg);
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    const api = {
      // System & AWS
      getAwsStatus: () => apiRequest("/aws/status"),

      // Auth
      login: (creds) => apiRequest("/auth/login", { method: "POST", body: JSON.stringify(creds) }),
      registerStudent: (d) => apiRequest("/auth/register/student", { method: "POST", body: JSON.stringify(d) }),
      registerRecruiter: (d) => apiRequest("/auth/register/recruiter", { method: "POST", body: JSON.stringify(d) }),
      getMe: () => apiRequest("/auth/me"),
      changePassword: (d) => apiRequest("/auth/change-password", { method: "POST", body: JSON.stringify(d) }),

      // Student
      getStudentProfile: () => apiRequest("/student/profile"),
      updateStudentProfile: (p) => apiRequest("/student/profile", { method: "PUT", body: JSON.stringify(p) }),
      uploadResume: (file) => {
        const formData = new FormData();
        formData.append("file", file);
        return apiRequest("/student/resume/upload", { method: "POST", body: formData });
      },
      getStudentJobs: () => apiRequest("/student/jobs"),
      applyJob: (id) => apiRequest(`/student/jobs/${id}/apply`, { method: "POST" }),
      getStudentApplications: () => apiRequest("/student/applications"),
      getStudentNotifications: () => apiRequest("/student/notifications"),
      markNotificationRead: (id) => apiRequest(`/student/notifications/${id}/read`, { method: "POST" }),

      // Recruiter
      getRecruiterProfile: () => apiRequest("/recruiter/profile"),
      getRecruiterJobs: () => apiRequest("/recruiter/jobs"),
      createJob: (j) => apiRequest("/recruiter/jobs", { method: "POST", body: JSON.stringify(j) }),
      updateJob: (id, j) => apiRequest(`/recruiter/jobs/${id}`, { method: "PUT", body: JSON.stringify(j) }),
      submitJob: (id) => apiRequest(`/recruiter/jobs/${id}/submit`, { method: "POST" }),
      closeJob: (id) => apiRequest(`/recruiter/jobs/${id}/close`, { method: "POST" }),
      deleteJob: (id) => apiRequest(`/recruiter/jobs/${id}`, { method: "DELETE" }),
      getJobApplications: (id, page = 1, limit = 50, status = "", branch = "") => {
        let u = `/recruiter/jobs/${id}/applications?page=${page}&limit=${limit}`;
        if (status) u += `&status=${encodeURIComponent(status)}`;
        if (branch) u += `&branch=${encodeURIComponent(branch)}`;
        return apiRequest(u);
      },
      batchUpdate: (id, ids, status) => apiRequest(`/recruiter/jobs/${id}/applications/batch-update`, {
        method: "POST",
        body: JSON.stringify({ application_ids: ids, status }),
      }),
      scheduleInterview: (jobId, appId, payload) => apiRequest(`/recruiter/jobs/${jobId}/applications/${appId}/schedule-interview`, {
        method: "POST",
        body: JSON.stringify(payload),
      }),
      exportJobCsvUrl: (jobId) => `${API_BASE}/recruiter/jobs/${jobId}/export-csv`,

      // Admin
      getPendingRecruiters: () => apiRequest("/admin/recruiters/pending"),
      approveRecruiter: (id) => apiRequest(`/admin/recruiters/${id}/approve`, { method: "POST" }),
      rejectRecruiter: (id) => apiRequest(`/admin/recruiters/${id}/reject`, { method: "POST" }),
      getPendingJobs: () => apiRequest("/admin/jobs/pending"),
      approveJob: (id) => apiRequest(`/admin/jobs/${id}/approve`, { method: "POST" }),
      requestChanges: (id, feedback) => apiRequest(`/admin/jobs/${id}/request-changes`, {
        method: "POST",
        body: JSON.stringify({ admin_feedback: feedback }),
      }),
      getAuditLogs: (page = 1) => apiRequest(`/admin/audit-logs?page=${page}&limit=25`),
      getMetrics: () => apiRequest("/admin/metrics"),
      getAdminStudents: (page = 1, limit = 50, search = "", branch = "") => {
        let u = `/admin/students?page=${page}&limit=${limit}`;
        if (search) u += `&search=${encodeURIComponent(search)}`;
        if (branch) u += `&branch=${encodeURIComponent(branch)}`;
        return apiRequest(u);
      },
      getAdminRecruiters: (page = 1, limit = 50, status = "", search = "") => {
        let u = `/admin/recruiters?page=${page}&limit=${limit}`;
        if (status) u += `&status=${encodeURIComponent(status)}`;
        if (search) u += `&search=${encodeURIComponent(search)}`;
        return apiRequest(u);
      },
      exportStudentsCsvUrl: () => `${API_BASE}/admin/export/students-csv`,
      exportPlacementsCsvUrl: () => `${API_BASE}/admin/export/placements-csv`,
    };

    // --- TOAST NOTIFICATION COMPONENT ---
    function ToastContainer({ toasts, onDismiss }) {
      return (
        <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none">
          {toasts.map((t) => (
            <div
              key={t.id}
              className={`pointer-events-auto p-4 rounded-xl shadow-2xl border flex items-start gap-3 transform transition-all duration-300 animate-slide-up ${
                t.type === "error"
                  ? "bg-rose-950/90 border-rose-700/50 text-rose-100"
                  : t.type === "success"
                  ? "bg-emerald-950/90 border-emerald-700/50 text-emerald-100"
                  : "bg-slate-900/90 border-slate-700 text-slate-100"
              }`}
            >
              <div className="text-xl">
                {t.type === "error" ? "⚠️" : t.type === "success" ? "✅" : "ℹ️"}
              </div>
              <div className="flex-1 text-xs whitespace-pre-line leading-relaxed font-medium">
                {t.message}
              </div>
              <button
                onClick={() => onDismiss(t.id)}
                className="text-gray-400 hover:text-white text-sm leading-none"
              >
                ✕
              </button>
            </div>
          ))}
        </div>
      );
    }

    // --- APPLICATION ROOT COMPONENT ---
    function App() {
      const [user, setUser] = useState(null);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authModalMode, setAuthModalMode] = useState("LOGIN");
      const [passwordModalOpen, setPasswordModalOpen] = useState(false);
      const [notificationsOpen, setNotificationsOpen] = useState(false);
      const [notifications, setNotifications] = useState([]);
      const [awsStatus, setAwsStatus] = useState(null);
      const [loading, setLoading] = useState(true);
      const [toasts, setToasts] = useState([]);

      const addToast = (message, type = "info") => {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 5000);
      };

      const dismissToast = (id) => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      };

      useEffect(() => {
        const u = getStoredUser();
        const t = getStoredToken();
        if (u && t) {
          setUser(u);
          if (u.role === "STUDENT") loadNotifications();
        }
        loadAwsStatus();
        setLoading(false);
      }, []);

      const loadAwsStatus = async () => {
        try {
          const s = await api.getAwsStatus();
          setAwsStatus(s);
        } catch (e) {
          console.error("AWS status check:", e);
        }
      };

      const loadNotifications = async () => {
        try {
          const list = await api.getStudentNotifications();
          setNotifications(list);
        } catch (e) {}
      };

      const handleLogout = () => {
        removeStoredToken();
        setUser(null);
        setNotifications([]);
        addToast("Signed out successfully", "info");
      };

      const handleQuickLogin = async (email, password, role) => {
        try {
          const res = await api.login({ email, password, role });
          setStoredToken(res.access_token);
          const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
          setStoredUser(u);
          setUser(u);
          if (u.role === "STUDENT") loadNotifications();
          addToast(`Logged in as ${u.name} (${u.role})`, "success");
        } catch (e) {
          addToast(`Login failed: ${e.message}`, "error");
        }
      };

      const unreadCount = notifications.filter((n) => !n.is_read).length;

      if (loading) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center text-indigo-400 gap-3">
            <div className="w-10 h-10 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
            <div className="text-xs font-semibold tracking-wider text-gray-400">INITIALIZING APEX PLACEMENT ENGINE...</div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-950 text-gray-100 flex flex-col font-sans">
          {/* Header */}
          <header className="bg-gray-900/90 backdrop-blur-md border-b border-gray-800/80 sticky top-0 z-40 shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              {/* Brand Logo */}
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setUser(user)}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/25">
                  <span className="text-lg tracking-tighter font-extrabold">AP</span>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-base sm:text-lg bg-gradient-to-r from-white via-indigo-100 to-gray-300 bg-clip-text text-transparent">
                      Apex Placement Portal
                    </span>
                    {/* AWS Cloud Badge */}
                    <div
                      className="hidden sm:inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/10 border border-emerald-500/30 text-emerald-400"
                      title={awsStatus ? `AWS Region: ${awsStatus.region} | S3: ${awsStatus.s3_configured ? 'Active' : 'Fallback'}` : 'Cloud Connected'}
                    >
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                      AWS Cloud Ready
                    </div>
                  </div>
                  <div className="text-[10px] text-gray-400 font-medium">Institutional Campus Recruitment & ATS Engine</div>
                </div>
              </div>

              {/* Navigation & User Menu */}
              <div className="flex items-center space-x-2 sm:space-x-3">
                {user ? (
                  <>
                    {/* Student Alert Bell */}
                    {user.role === "STUDENT" && (
                      <button
                        onClick={() => setNotificationsOpen(true)}
                        className="relative p-2.5 rounded-xl bg-gray-800/80 hover:bg-gray-800 text-gray-300 hover:text-white border border-gray-700/60 transition-all shadow-sm"
                        title="Alert Inbox"
                      >
                        🔔
                        {unreadCount > 0 && (
                          <span className="absolute -top-1 -right-1 px-1.5 py-0.5 bg-rose-500 text-white font-bold text-[10px] rounded-full animate-bounce">
                            {unreadCount}
                          </span>
                        )}
                      </button>
                    )}

                    {/* User Profile Pill */}
                    <div className="flex items-center space-x-2.5 bg-gray-900/90 px-3 py-1.5 rounded-xl border border-gray-800 shadow-sm">
                      <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white text-xs">
                        {user.name ? user.name.charAt(0).toUpperCase() : "U"}
                      </div>
                      <div className="text-right hidden sm:block">
                        <div className="text-xs font-semibold text-white leading-tight">{user.name || user.email}</div>
                        <div className="text-[10px] text-gray-400">{user.email}</div>
                      </div>
                      <span
                        className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${
                          user.role === "ADMIN"
                            ? "bg-purple-500/15 text-purple-300 border border-purple-500/30"
                            : user.role === "RECRUITER"
                            ? user.status === "ACTIVE"
                              ? "bg-emerald-500/15 text-emerald-300 border border-emerald-500/30"
                              : "bg-amber-500/15 text-amber-300 border border-amber-500/30"
                            : "bg-cyan-500/15 text-cyan-300 border border-cyan-500/30"
                        }`}
                      >
                        {user.role} {user.role === "RECRUITER" && `(${user.status || "PENDING"})`}
                      </span>
                    </div>

                    {/* Password Button */}
                    <button
                      onClick={() => setPasswordModalOpen(true)}
                      className="p-2 sm:px-2.5 sm:py-1.5 rounded-xl bg-gray-800/80 hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-700/60 text-xs font-medium transition-all"
                      title="Change Password"
                    >
                      🔑 <span className="hidden md:inline">Key</span>
                    </button>

                    {/* Logout */}
                    <button
                      onClick={handleLogout}
                      className="text-xs font-semibold px-3 py-2 rounded-xl bg-rose-500/10 text-rose-300 hover:bg-rose-500/20 border border-rose-500/30 transition-all"
                    >
                      Logout
                    </button>
                  </>
                ) : (
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => { setAuthModalMode("LOGIN"); setAuthModalOpen(true); }}
                      className="text-xs font-bold px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 transition-all transform hover:-translate-y-0.5"
                    >
                      Sign In / Register
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 flex flex-col">
            {!user ? (
              <LandingView
                onQuickLogin={handleQuickLogin}
                onOpenAuth={(mode) => { setAuthModalMode(mode); setAuthModalOpen(true); }}
                awsStatus={awsStatus}
              />
            ) : user.role === "STUDENT" ? (
              <StudentView user={user} onRefreshNotifications={loadNotifications} addToast={addToast} />
            ) : user.role === "RECRUITER" ? (
              <RecruiterView user={user} addToast={addToast} />
            ) : user.role === "ADMIN" ? (
              <AdminView user={user} addToast={addToast} />
            ) : null}
          </main>

          {/* Modals */}
          <AuthModal
            isOpen={authModalOpen}
            initialMode={authModalMode}
            onClose={() => setAuthModalOpen(false)}
            onSuccess={(u) => {
              setUser(u);
              if (u.role === "STUDENT") loadNotifications();
              addToast(`Welcome ${u.name}!`, "success");
            }}
          />

          <ChangePasswordModal
            isOpen={passwordModalOpen}
            onClose={() => setPasswordModalOpen(false)}
            addToast={addToast}
          />

          <NotificationModal
            isOpen={notificationsOpen}
            onClose={() => setNotificationsOpen(false)}
            notifications={notifications}
            onRefresh={loadNotifications}
          />

          <ToastContainer toasts={toasts} onDismiss={dismissToast} />

          <footer className="border-t border-gray-800/80 bg-gray-950 py-6 text-center text-xs text-gray-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div>
                Apex Placement Portal &bull; Multi-Tenant Academic Recruitment System
              </div>
              <div className="flex items-center gap-3 text-gray-400">
                <span className="flex items-center gap-1">
                  <span className="w-2 h-2 rounded-full bg-indigo-500"></span> FastAPI 2.0
                </span>
                <span>•</span>
                <span className="flex items-center gap-1">
                  <span className="w-2 h-2 rounded-full bg-cyan-400"></span> React 18 SPA
                </span>
                <span>•</span>
                <span className="flex items-center gap-1">
                  <span className="w-2 h-2 rounded-full bg-amber-400"></span> AWS S3 & SES
                </span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // --- LANDING VIEW ---
    function LandingView({ onQuickLogin, onOpenAuth, awsStatus }) {
      return (
        <div className="flex-1 flex flex-col justify-center">
          <div className="max-w-6xl mx-auto px-4 sm:px-6 py-12 sm:py-16 space-y-12">
            {/* Hero Header */}
            <div className="text-center space-y-5 max-w-3xl mx-auto">
              <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/25 text-indigo-300 text-xs font-semibold shadow-inner">
                <span className="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></span>
                Institutional Placement Architecture &bull; AWS Cloud Integration
              </div>
              <h1 className="text-4xl sm:text-6xl font-black tracking-tight leading-tight bg-gradient-to-r from-white via-indigo-100 to-indigo-300 bg-clip-text text-transparent">
                Precision Campus Placements. <br />
                <span className="bg-gradient-to-r from-indigo-400 via-purple-300 to-cyan-400 bg-clip-text text-transparent">
                  Enterprise-Grade RBAC.
                </span>
              </h1>
              <p className="text-sm sm:text-base text-gray-400 leading-relaxed">
                Streamline university recruitment with server-side eligibility enforcement, direct AWS S3 resume storage, automated transactional ATS pipelines, and administrative audit logging.
              </p>
            </div>

            {/* Quick Demo Login Cards */}
            <div className="space-y-4">
              <div className="text-center text-xs font-bold uppercase tracking-wider text-gray-400">
                Instant 1-Click Interactive Demo Profiles
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                {/* Student Card */}
                <div className="glass-card rounded-2xl p-6 text-left relative overflow-hidden group hover:border-cyan-500/40 transition-all duration-300 hover:shadow-xl hover:shadow-cyan-500/10">
                  <div className="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-2xl mb-4">
                    🎓
                  </div>
                  <div className="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-1">Student Applicant</div>
                  <h3 className="text-lg font-bold text-white mb-2">Ronak Soni</h3>
                  <div className="space-y-1.5 text-xs text-gray-400 mb-6">
                    <div>• Department: <b className="text-gray-200">CSE (2025)</b></div>
                    <div>• Academic CGPA: <b className="text-emerald-400">9.20 / 10.0</b></div>
                    <div>• Verified Resume in AWS S3</div>
                  </div>
                  <button
                    onClick={() => onQuickLogin("student@placement.edu", "Student@1234", "STUDENT")}
                    className="w-full py-2.5 px-4 rounded-xl font-bold text-xs bg-cyan-600 hover:bg-cyan-500 text-white shadow-lg shadow-cyan-600/25 transition-all flex items-center justify-center gap-2"
                  >
                    Launch Student Portal →
                  </button>
                </div>

                {/* Recruiter Card */}
                <div className="glass-card rounded-2xl p-6 text-left relative overflow-hidden group hover:border-indigo-500/40 transition-all duration-300 hover:shadow-xl hover:shadow-indigo-500/10">
                  <div className="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-2xl mb-4">
                    🏢
                  </div>
                  <div className="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-1">Company Recruiter</div>
                  <h3 className="text-lg font-bold text-white mb-2">Amazon Web Services</h3>
                  <div className="space-y-1.5 text-xs text-gray-400 mb-6">
                    <div>• HR Partner: <b className="text-gray-200">Priya Sharma</b></div>

    // --- STUDENT VIEW ---
    function StudentView({ user, onRefreshNotifications, addToast }) {
      const [profile, setProfile] = useState(null);
      const [jobs, setJobs] = useState([]);
      const [applications, setApplications] = useState([]);
      const [activeTab, setActiveTab] = useState("JOBS"); // "JOBS" | "APPLICATIONS" | "PROFILE"
      const [searchQuery, setSearchQuery] = useState("");
      const [filterEligibleOnly, setFilterEligibleOnly] = useState(false);
      const [uploadingResume, setUploadingResume] = useState(false);
      const [profileModalOpen, setProfileModalOpen] = useState(false);
      const [eligibilityModalJob, setEligibilityModalJob] = useState(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        loadData();
      }, []);

      const loadData = async () => {
        try {
          const [p, j, a] = await Promise.all([
            api.getStudentProfile(),
            api.getStudentJobs(),
            api.getStudentApplications(),
          ]);
          setProfile(p);
          setJobs(j);
          setApplications(a);
        } catch (e) {
          addToast(`Error loading student data: ${e.message}`, "error");
        }
      };

      const handleResumeFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.name.toLowerCase().endsWith(".pdf")) {
          addToast("Only PDF documents (.pdf) are permitted for resumes.", "error");
          return;
        }

        setUploadingResume(true);
        try {
          const res = await api.uploadResume(file);
          setProfile((prev) => ({ ...prev, resume_url: res.resume_url }));
          addToast(`Resume uploaded successfully (${res.storage})`, "success");
          loadData();
        } catch (err) {
          addToast(`Upload failed: ${err.message}`, "error");
        } finally {
          setUploadingResume(false);
          if (fileInputRef.current) fileInputRef.current.value = "";
        }
      };

      const handleApply = async (job) => {
        try {
          await api.applyJob(job.id);
          addToast(`Successfully applied to ${job.title} at ${job.company_name}!`, "success");
          loadData();
        } catch (e) {
          addToast(e.message, "error");
        }
      };

      const appliedJobIds = useMemo(() => new Set(applications.map((a) => a.job_id)), [applications]);

      const filteredJobs = useMemo(() => {
        return jobs.filter((j) => {
          const matchesSearch =
            j.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            j.company_name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (j.job_location && j.job_location.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchesEligible = filterEligibleOnly ? j.is_eligible : true;
          return matchesSearch && matchesEligible;

                          <button

                                : "bg-amber-500/10 border-amber-500/30 text-amber-300 hover:bg-amber-500/20"

                            <span>{job.is_eligible ? "✓ Eligible" : "⚠️ Ineligible"}</span>

                    </div>
                    <span className={`font-bold ${profile?.resume_url ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {profile?.resume_url ? 'Attached ✓' : 'Missing ✗'}
                    </span>
                  </div>

                  {/* Ineligibility Reasons */}
                  {!eligibilityModalJob.is_eligible && eligibilityModalJob.reasons && eligibilityModalJob.reasons.length > 0 && (
                    <div className="p-3 rounded-xl bg-rose-950/40 border border-rose-800/50 text-rose-300 text-[11px] space-y-1">
                      <div className="font-bold">Reasons for Ineligibility:</div>
                      {eligibilityModalJob.reasons.map((r, idx) => (
                        <div key={idx}>• {r}</div>
                      ))}
                    </div>
                  )}
                </div>

                <div className="pt-2">
                  <button
                    onClick={() => setEligibilityModalJob(null)}
                    className="w-full py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-white font-bold text-xs"
                  >
                    Close Breakdown
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* EDIT PROFILE MODAL */}
          {profileModalOpen && profile && (
            <EditProfileModal
              profile={profile}
              onClose={() => setProfileModalOpen(false)}
              onSuccess={(updated) => {
                setProfile(updated);
                addToast("Profile metrics updated successfully", "success");
                setProfileModalOpen(false);
                loadData();
              }}
              addToast={addToast}
            />
          )}
        </div>
      );
    }

    // --- EDIT PROFILE MODAL ---
    function EditProfileModal({ profile, onClose, onSuccess, addToast }) {
      const [fullName, setFullName] = useState(profile.full_name || "");
      const [cgpa, setCgpa] = useState(profile.cgpa || 0.0);
      const [branch, setBranch] = useState(profile.branch || "CSE");
      const [gradYear, setGradYear] = useState(profile.graduation_year || 2025);
      const [saving, setSaving] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          const updated = await api.updateStudentProfile({
            full_name: fullName,
            cgpa: parseFloat(cgpa),
            branch: branch,
            graduation_year: parseInt(gradYear),
          });
          onSuccess(updated);
        } catch (err) {
          addToast(`Error updating profile: ${err.message}`, "error");
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
          <div className="glass-panel rounded-2xl max-w-md w-full p-6 text-left border border-gray-700 shadow-2xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-gray-800">
              <h3 className="font-bold text-base text-white">Edit Academic Metrics</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-gray-400 font-semibold mb-1">Full Name</label>
                <input
                  type="text"
                  required
                  value={fullName}
                  onChange={(e) => setFullName(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Academic CGPA (0.00 - 10.00)</label>
                <input
                  type="number"
                  step="0.01"
                  min="0"
                  max="10"
                  required
                  value={cgpa}
                  onChange={(e) => setCgpa(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Department / Branch</label>
                <select
                  value={branch}
                  onChange={(e) => setBranch(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                >
                  <option value="CSE">CSE (Computer Science & Engineering)</option>
                  <option value="ECE">ECE (Electronics & Communication)</option>
                  <option value="IT">IT (Information Technology)</option>
                  <option value="ME">ME (Mechanical Engineering)</option>
                  <option value="CE">CE (Civil Engineering)</option>
                  <option value="EEE">EEE (Electrical & Electronics)</option>
                </select>
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Graduation Batch Year</label>
                <input
                  type="number"
                  required
                  value={gradYear}
                  onChange={(e) => setGradYear(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                />
              </div>

              <div className="pt-2 flex gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="flex-1 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold disabled:opacity-50"
                >
                  {saving ? "Saving..." : "Save Changes"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- RECRUITER VIEW ---
    function RecruiterView({ user, addToast }) {
      const [profile, setProfile] = useState(null);
      const [jobs, setJobs] = useState([]);
      const [selectedJob, setSelectedJob] = useState(null);
      const [applications, setApplications] = useState([]);
      const [selectedAppIds, setSelectedAppIds] = useState([]);
      const [statusFilter, setStatusFilter] = useState("");
      const [branchFilter, setBranchFilter] = useState("");
      const [createModalOpen, setCreateModalOpen] = useState(false);
      const [interviewModalApp, setInterviewModalApp] = useState(null);
      const [loadingApps, setLoadingApps] = useState(false);

      useEffect(() => {
        loadRecruiterData();
      }, []);

      const loadRecruiterData = async () => {
        try {
          const [p, j] = await Promise.all([
            api.getRecruiterProfile(),
            api.getRecruiterJobs(),
          ]);
          setProfile(p);
          setJobs(j);
          if (j.length > 0 && !selectedJob) {
            selectJobForAts(j[0]);
          }
        } catch (e) {
          addToast(`Error: ${e.message}`, "error");
        }
      };

      const selectJobForAts = async (job) => {
        setSelectedJob(job);
        setSelectedAppIds([]);
        setLoadingApps(true);
        try {
          const res = await api.getJobApplications(job.id, 1, 50, statusFilter, branchFilter);
          setApplications(res.items || []);
        } catch (err) {
          addToast(`Failed to load applications: ${err.message}`, "error");
        } finally {
          setLoadingApps(false);
        }
      };

      useEffect(() => {
        if (selectedJob) {
          selectJobForAts(selectedJob);
        }
      }, [statusFilter, branchFilter]);

      const handleBatchUpdate = async (newStatus) => {
        if (selectedAppIds.length === 0) {
          addToast("Please select at least one candidate using the checkboxes.", "info");
          return;
        }
        try {
          const res = await api.batchUpdate(selectedJob.id, selectedAppIds, newStatus);
          addToast(`ACID Batch Complete: ${res.updated_count} candidate(s) set to ${newStatus}`, "success");
          setSelectedAppIds([]);
          selectJobForAts(selectedJob);
        } catch (e) {
          addToast(`Batch update failed: ${e.message}`, "error");
        }
      };

      const handleSubmitJob = async (jobId) => {
        try {
          await api.submitJob(jobId);
          addToast("Job successfully submitted for placement admin vetting!", "success");
          loadRecruiterData();
        } catch (e) {
          addToast(e.message, "error");
        }
      };

      const handleCloseJob = async (jobId) => {
        try {
          await api.closeJob(jobId);
          addToast("Job posting closed.", "info");
          loadRecruiterData();
        } catch (e) {
          addToast(e.message, "error");
        }
      };

      const handleDeleteJob = async (jobId) => {
        if (!confirm("Are you sure you want to soft-delete this job? Applicants will receive automated background notifications.")) return;
        try {
          await api.deleteJob(jobId);
          addToast("Job deleted and background notifications dispatched.", "info");
          loadRecruiterData();
        } catch (e) {
          addToast(e.message, "error");
        }
      };

      const toggleAppSelection = (id) => {
        setSelectedAppIds((prev) =>
          prev.includes(id) ? prev.filter((i) => i !== id) : [...prev, id]
        );
      };

      const toggleSelectAll = () => {
        if (selectedAppIds.length === applications.length) {
          setSelectedAppIds([]);
        } else {
          setSelectedAppIds(applications.map((a) => a.id));
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
          {/* Recruiter Header */}
          <div className="glass-panel rounded-2xl p-6 shadow-xl gradient-border">
            <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <h2 className="text-xl sm:text-2xl font-bold text-white">{profile?.company_name}</h2>
                  <span
                    className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${
                      profile?.status === "ACTIVE"
                        ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40"
                        : "bg-amber-500/20 text-amber-300 border border-amber-500/40"
                    }`}
                  >
                    {profile?.status}
                  </span>
                </div>
                <div className="text-xs text-gray-400 mt-1">
                  HR Lead: <b className="text-gray-200">{profile?.hr_name}</b> &bull; Account: {profile?.email}
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setCreateModalOpen(true)}
                  disabled={profile?.status !== "ACTIVE"}
                  className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center gap-2 shadow-lg shadow-indigo-600/25 transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                >
                  <span>➕ Post New Job Opening</span>
                </button>
              </div>
            </div>

            {profile?.status === "PENDING" && (
              <div className="mt-4 p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs flex items-center gap-2.5">
                <span>⏳</span>
                <span>
                  Your recruiter profile is pending vetting by the Placement Cell Admin. Job posting unlocks upon approval.
                </span>
              </div>
            )}
          </div>

          {/* Job Drives Overview */}
          <div className="space-y-3">
            <h3 className="text-sm font-bold uppercase tracking-wider text-gray-400">Recruitment Drives</h3>
            {jobs.length === 0 ? (
              <div className="glass-card rounded-2xl p-8 text-center text-gray-400 text-xs">
                No job postings created yet. Click "Post New Job Opening" to initiate your recruitment drive!
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {jobs.map((job) => {
                  const isSelected = selectedJob?.id === job.id;
                  return (
                    <div
                      key={job.id}
                      onClick={() => selectJobForAts(job)}
                      className={`glass-card rounded-2xl p-4 text-left border cursor-pointer transition-all flex flex-col justify-between space-y-3 ${
                        isSelected
                          ? "border-indigo-500 bg-indigo-950/20 ring-1 ring-indigo-500"
                          : "border-gray-800 hover:border-gray-700"
                      }`}
                    >
                      <div className="space-y-1.5">
                        <div className="flex items-center justify-between gap-2">
                          <span
                            className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${
                              job.status === "ACTIVE"
                                ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40"
                                : job.status === "REQUIRES_CHANGES"
                                ? "bg-rose-500/20 text-rose-300 border border-rose-500/40"
                                : job.status === "PENDING_APPROVAL"
                                ? "bg-amber-500/20 text-amber-300 border border-amber-500/40"
                                : "bg-gray-800 text-gray-400"
                            }`}
                          >
                            {job.status.replace("_", " ")}
                          </span>
                          {job.ctc_lpa > 0 && (
                            <span className="text-xs font-bold text-emerald-400">₹{job.ctc_lpa} LPA</span>
                          )}
                        </div>
                        <h4 className="text-sm font-bold text-white line-clamp-1">{job.title}</h4>
                        <div className="text-[11px] text-gray-400">{job.job_location || "On-site / Hybrid"}</div>
                      </div>

                      {/* Admin Feedback Warning */}
                      {job.status === "REQUIRES_CHANGES" && job.admin_feedback && (
                        <div className="p-2 rounded-lg bg-rose-950/60 border border-rose-800 text-rose-200 text-[11px]">
                          <b>Admin Feedback:</b> {job.admin_feedback}
                        </div>
                      )}

                      {/* Action buttons */}
                      <div className="pt-2 border-t border-gray-800 flex items-center justify-between gap-2 text-xs">
                        <div className="flex items-center gap-1.5">
                          {["DRAFT", "REQUIRES_CHANGES"].includes(job.status) && (
                            <button
                              onClick={(e) => { e.stopPropagation(); handleSubmitJob(job.id); }}
                              className="px-2.5 py-1 rounded bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 hover:bg-indigo-600/50 text-[10px] font-bold"
                            >
                              Submit
                            </button>
                          )}
                          {job.status === "ACTIVE" && (
                            <button
                              onClick={(e) => { e.stopPropagation(); handleCloseJob(job.id); }}
                              className="px-2.5 py-1 rounded bg-gray-800 text-gray-300 hover:bg-gray-700 text-[10px]"
                            >
                              Close
                            </button>
                          )}
                        </div>

                        <div className="flex items-center gap-1.5">
                          {/* Export CSV */}
                          <a
                            href={api.exportJobCsvUrl(job.id)}
                            onClick={(e) => e.stopPropagation()}
                            download
                            className="px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 text-gray-300 text-[10px] font-medium"
                            title="Download Applicants CSV"
                          >
                            📥 CSV
                          </a>

                          <button
                            onClick={(e) => { e.stopPropagation(); handleDeleteJob(job.id); }}
                            className="px-2 py-1 rounded bg-rose-500/10 text-rose-300 hover:bg-rose-500/20 text-[10px]"
                          >
                            🗑️
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Applicant Tracking System (ATS Pipeline Table) */}
          {selectedJob && (
            <div className="glass-card rounded-2xl p-6 shadow-xl space-y-4">
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b border-gray-800">
                <div>
                  <div className="text-xs text-indigo-400 font-semibold uppercase tracking-wider">Candidate Tracking System (ATS)</div>
                  <h3 className="text-lg font-bold text-white">
                    Applicants for: <span className="text-indigo-200">{selectedJob.title}</span>
                  </h3>
                </div>

                {/* Filters */}
                <div className="flex items-center gap-3 flex-wrap">
                  <select
                    value={statusFilter}
                    onChange={(e) => setStatusFilter(e.target.value)}
                    className="px-3 py-1.5 bg-gray-900 border border-gray-800 rounded-lg text-xs text-white"
                  >
                    <option value="">All Statuses</option>
                    <option value="APPLIED">Applied</option>
                    <option value="UNDER_REVIEW">Under Review</option>
                    <option value="SHORTLISTED">Shortlisted</option>
                    <option value="OFFERED">Offered</option>
                    <option value="REJECTED">Rejected</option>
                  </select>

                  <select
                    value={branchFilter}
                    onChange={(e) => setBranchFilter(e.target.value)}
                    className="px-3 py-1.5 bg-gray-900 border border-gray-800 rounded-lg text-xs text-white"
                  >
                    <option value="">All Branches</option>
                    <option value="CSE">CSE</option>
                    <option value="ECE">ECE</option>
                    <option value="IT">IT</option>
                    <option value="ME">ME</option>
                  </select>

                  <a
                    href={api.exportJobCsvUrl(selectedJob.id)}
                    download
                    className="px-3 py-1.5 rounded-lg bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 text-xs font-bold hover:bg-emerald-600/30 flex items-center gap-1.5"
                  >
                    <span>📊 Export CSV</span>
                  </a>
                </div>
              </div>

              {/* ACID Batch Operations Toolbar */}
              {selectedAppIds.length > 0 && (
                <div className="p-3 rounded-xl bg-indigo-950/40 border border-indigo-500/40 flex items-center justify-between flex-wrap gap-3 animate-fade-in">
                  <span className="text-xs font-bold text-indigo-200">
                    {selectedAppIds.length} candidate(s) selected for atomic batch action:
                  </span>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => handleBatchUpdate("UNDER_REVIEW")}
                      className="px-3 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold"
                    >
                      Mark Under Review
                    </button>
                    <button
                      onClick={() => handleBatchUpdate("SHORTLISTED")}
                      className="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold"
                    >
                      Shortlist All
                    </button>
                    <button
                      onClick={() => handleBatchUpdate("OFFERED")}
                      className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold"
                    >
                      Make Offer All
                    </button>
                    <button
                      onClick={() => handleBatchUpdate("REJECTED")}
                      className="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold"
                    >
                      Reject All
                    </button>
                  </div>
                </div>
              )}

              {/* Candidates Table */}
              {loadingApps ? (
                <div className="py-12 text-center text-gray-400 text-xs animate-pulse">Loading ATS candidates...</div>
              ) : applications.length === 0 ? (
                <div className="py-12 text-center text-gray-400 text-xs">
                  No applicants found for the current filters.
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-gray-800 text-gray-400 uppercase text-[10px] tracking-wider">
                        <th className="py-3 px-3">
                          <input
                            type="checkbox"
                            checked={selectedAppIds.length === applications.length && applications.length > 0}
                            onChange={toggleSelectAll}
                            className="rounded bg-gray-800 border-gray-700 text-indigo-500"
                          />
                        </th>
                        <th className="py-3 px-3">Candidate</th>
                        <th className="py-3 px-3">Roll & Dept</th>
                        <th className="py-3 px-3">CGPA</th>
                        <th className="py-3 px-3">Resume</th>
                        <th className="py-3 px-3">Funnel Status</th>
                        <th className="py-3 px-3">Interview</th>
                        <th className="py-3 px-3 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-800/60">
                      {applications.map((app) => {
                        const student = app.student;
                        const isChecked = selectedAppIds.includes(app.id);
                        return (
                          <tr key={app.id} className="hover:bg-gray-900/40 transition-colors">
                            <td className="py-3.5 px-3">
                              <input
                                type="checkbox"
                                checked={isChecked}
                                onChange={() => toggleAppSelection(app.id)}
                                className="rounded bg-gray-800 border-gray-700 text-indigo-500"
                              />
                            </td>
                            <td className="py-3.5 px-3">
                              <div className="font-bold text-white">{student?.full_name || "N/A"}</div>
                              <div className="text-[10px] text-gray-400">{student?.email}</div>
                            </td>
                            <td className="py-3.5 px-3">
                              <div className="font-semibold text-gray-300">{student?.branch}</div>
                              <div className="text-[10px] text-gray-400">Class {student?.graduation_year}</div>
                            </td>
                            <td className="py-3.5 px-3 font-extrabold text-emerald-400">
                              {student?.cgpa ? student.cgpa.toFixed(2) : "N/A"}
                            </td>
                            <td className="py-3.5 px-3">
                              {student?.resume_url ? (
                                <a
                                  href={student.resume_url}
                                  target="_blank"
                                  rel="noreferrer"
                                  className="px-2.5 py-1 rounded bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 hover:bg-indigo-500/20 font-semibold text-[11px]"
                                >
                                  📄 View Resume
                                </a>
                              ) : (
                                <span className="text-gray-500 text-[10px]">None</span>
                              )}
                            </td>
                            <td className="py-3.5 px-3">
                              <span
                                className={`px-2.5 py-1 rounded-lg font-bold text-[10px] uppercase ${
                                  app.status === "OFFERED"
                                    ? "bg-emerald-500/20 text-emerald-300"
                                    : app.status === "SHORTLISTED"
                                    ? "bg-indigo-500/20 text-indigo-300"
                                    : app.status === "UNDER_REVIEW"
                                    ? "bg-cyan-500/20 text-cyan-300"
                                    : app.status === "REJECTED"
                                    ? "bg-rose-500/20 text-rose-300"
                                    : "bg-gray-800 text-gray-300"
                                }`}
                              >
                                {app.status.replace("_", " ")}
                              </span>
                            </td>
                            <td className="py-3.5 px-3">
                              {app.interview_round ? (
                                <div>
                                  <div className="font-bold text-indigo-300">{app.interview_round}</div>
                                  <div className="text-[10px] text-gray-400">
                                    {new Date(app.interview_scheduled_at).toLocaleDateString()}
                                  </div>
                                </div>
                              ) : (
                                <span className="text-gray-500 text-[10px]">—</span>
                              )}
                            </td>
                            <td className="py-3.5 px-3 text-right">
                              <button
                                onClick={() => setInterviewModalApp(app)}
                                className="px-2.5 py-1 rounded bg-purple-600/30 text-purple-200 border border-purple-500/40 hover:bg-purple-600/50 font-semibold text-[11px]"
                              >
                                🎙️ Schedule Interview
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {/* CREATE JOB MODAL */}
          {createModalOpen && (
            <CreateJobModal
              onClose={() => setCreateModalOpen(false)}
              onSuccess={() => {
                setCreateModalOpen(false);
                addToast("New job draft successfully created!", "success");
                loadRecruiterData();
              }}
              addToast={addToast}
            />
          )}

          {/* SCHEDULE INTERVIEW MODAL */}
          {interviewModalApp && (
            <ScheduleInterviewModal
              app={interviewModalApp}
              jobId={selectedJob.id}
              onClose={() => setInterviewModalApp(null)}
              onSuccess={() => {
                setInterviewModalApp(null);
                addToast("Interview scheduled and email dispatched to candidate!", "success");
                selectJobForAts(selectedJob);
              }}
              addToast={addToast}
            />
          )}
        </div>
      );
    }

    // --- CREATE JOB MODAL ---
    function CreateJobModal({ onClose, onSuccess, addToast }) {
      const [title, setTitle] = useState("");
      const [description, setDescription] = useState("");
      const [ctcLpa, setCtcLpa] = useState(15.0);
      const [jobLocation, setJobLocation] = useState("Bengaluru / Hybrid");
      const [jobType, setJobType] = useState("Full-Time");
      const [minCgpa, setMinCgpa] = useState(7.0);
      const [allowedBranches, setAllowedBranches] = useState(["CSE", "IT"]);
      const [allowedGradYears, setAllowedGradYears] = useState([2025, 2026]);
      const [submitting, setSubmitting] = useState(false);

      const handleBranchToggle = (branch) => {
        setAllowedBranches((prev) =>
          prev.includes(branch) ? prev.filter((b) => b !== branch) : [...prev, branch]
        );
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        try {
          await api.createJob({
            title,
            description,
            ctc_lpa: parseFloat(ctcLpa) || 0.0,
            job_location: jobLocation,
            job_type: jobType,
            min_cgpa: parseFloat(minCgpa) || 0.0,
            allowed_branches: allowedBranches,
            allowed_graduation_years: allowedGradYears,
          });
          onSuccess();
        } catch (err) {
          addToast(`Error creating job: ${err.message}`, "error");
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
          <div className="glass-panel rounded-2xl max-w-lg w-full p-6 text-left border border-gray-700 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between pb-3 border-b border-gray-800">
              <h3 className="font-bold text-base text-white">Post New Job Recruitment Drive</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-gray-400 font-semibold mb-1">Job Title</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Software Development Engineer (AWS Cloud)"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Role Description & Responsibilities</label>
                <textarea
                  required
                  rows={3}
                  placeholder="Detail tech stack, responsibilities, and qualifications..."
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-gray-400 font-semibold mb-1">Package / CTC (LPA)</label>
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    required
                    value={ctcLpa}
                    onChange={(e) => setCtcLpa(e.target.value)}
                    className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-gray-400 font-semibold mb-1">Minimum CGPA (0.0 - 10.0)</label>
                  <input
                    type="number"
                    step="0.01"
                    min="0"
                    max="10"
                    required
                    value={minCgpa}
                    onChange={(e) => setMinCgpa(e.target.value)}
                    className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-gray-400 font-semibold mb-1">Job Location</label>
                  <input
                    type="text"
                    required
                    value={jobLocation}
                    onChange={(e) => setJobLocation(e.target.value)}
                    className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-gray-400 font-semibold mb-1">Employment Type</label>
                  <select
                    value={jobType}
                    onChange={(e) => setJobType(e.target.value)}
                    className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                  >
                    <option value="Full-Time">Full-Time</option>
                    <option value="Internship">Internship</option>
                    <option value="6-Month Intern + PPO">6-Month Intern + PPO</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Eligible Academic Departments</label>
                <div className="flex flex-wrap gap-2 pt-1">
                  {["CSE", "ECE", "IT", "ME", "CE", "EEE"].map((branch) => (
                    <button
                      type="button"
                      key={branch}
                      onClick={() => handleBranchToggle(branch)}
                      className={`px-3 py-1.5 rounded-lg font-bold text-xs transition-all ${
                        allowedBranches.includes(branch)
                          ? "bg-indigo-600 text-white shadow-md shadow-indigo-600/20"
                          : "bg-gray-800 text-gray-400 hover:text-white"
                      }`}
                    >
                      {branch}
                    </button>
                  ))}
                </div>
              </div>

              <div className="pt-3 flex gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={submitting}
                  className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold disabled:opacity-50"
                >
                  {submitting ? "Creating..." : "Save Draft"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- SCHEDULE INTERVIEW MODAL ---
    function ScheduleInterviewModal({ app, jobId, onClose, onSuccess, addToast }) {
      const [round, setRound] = useState("Technical Round 1: Cloud Architecture");
      const [dateTime, setDateTime] = useState("");
      const [meetingLink, setMeetingLink] = useState("https://meet.google.com/aws-interview");
      const [notes, setNotes] = useState("");
      const [scheduling, setScheduling] = useState(false);

      useEffect(() => {
        // Default to tomorrow 10:00 AM
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(10, 0, 0, 0);
        setDateTime(tomorrow.toISOString().slice(0, 16));
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setScheduling(true);
        try {
          await api.scheduleInterview(jobId, app.id, {
            interview_round: round,
            interview_scheduled_at: new Date(dateTime).toISOString(),
            interview_meeting_link: meetingLink,
            interview_notes: notes,
          });
          onSuccess();
        } catch (err) {
          addToast(`Error scheduling interview: ${err.message}`, "error");
        } finally {
          setScheduling(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
          <div className="glass-panel rounded-2xl max-w-md w-full p-6 text-left border border-gray-700 shadow-2xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-gray-800">
              <h3 className="font-bold text-base text-white">Schedule Candidate Interview</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <div className="p-3 rounded-xl bg-gray-900 border border-gray-800 text-xs">
              <div className="text-gray-400">Candidate:</div>
              <div className="font-bold text-white text-sm">{app.student?.full_name} ({app.student?.roll_number})</div>
              <div className="text-[11px] text-gray-400">{app.student?.email}</div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-gray-400 font-semibold mb-1">Interview Round Title</label>
                <input
                  type="text"
                  required
                  value={round}
                  onChange={(e) => setRound(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-purple-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Scheduled Date & Time</label>
                <input
                  type="datetime-local"
                  required
                  value={dateTime}
                  onChange={(e) => setDateTime(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-purple-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Meeting Link (Google Meet / Zoom / Chime)</label>
                <input
                  type="url"
                  required
                  value={meetingLink}
                  onChange={(e) => setMeetingLink(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-purple-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Preparation Instructions for Candidate</label>
                <textarea
                  rows={2}
                  placeholder="Topics to prepare, assessment format, etc."
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-purple-500"
                />
              </div>

              <div className="pt-2 flex gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={scheduling}
                  className="flex-1 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold disabled:opacity-50"
                >
                  {scheduling ? "Scheduling..." : "Dispatch Invite →"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

        loadAdminData();

        try {

            api.getMetrics(),
            api.getPendingRecruiters(),
            api.getPendingJobs(),
            api.getAdminStudents(1, 50),
