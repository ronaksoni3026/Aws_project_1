<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Placement & Internship Portal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for runtime JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');
    
    body {
      background-color: #f8fafc;
      color: #1e293b;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    /* Clean Institutional Portal Card Styling */
    .company-card, .portal-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .company-card:hover, .portal-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col relative">
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- React Application Core -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- API CLIENT ---
    const API_BASE = "/api";
    const getStoredToken = () => localStorage.getItem("placement_token");
    const setStoredToken = (t) => localStorage.setItem("placement_token", t);
    const removeStoredToken = () => {
      localStorage.removeItem("placement_token");
      localStorage.removeItem("placement_user");
    };
    const getStoredUser = () => {
      const u = localStorage.getItem("placement_user");
      return u ? JSON.parse(u) : null;
    };
    const setStoredUser = (u) => localStorage.setItem("placement_user", JSON.stringify(u));

    async function apiRequest(endpoint, options = {}) {
      const token = getStoredToken();
      const headers = { ...(options.headers || {}) };

      if (!(options.body instanceof FormData) && !headers["Content-Type"]) {
        headers["Content-Type"] = "application/json";
      }
      if (token) {
        headers["Authorization"] = `Bearer ${token}`;
      }

      const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        let msg = "A server error occurred.";
        if (data.detail) {
          if (typeof data.detail === "object" && data.detail.reasons) {
            msg = `Eligibility Criteria Unmet:\n• ` + data.detail.reasons.join("\n• ");
          } else if (typeof data.detail === "object") {
            msg = data.detail.message || JSON.stringify(data.detail);
          } else {
            msg = data.detail;
          }
        }
        const err = new Error(msg);
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    const api = {
      // System & AWS
      getAwsStatus: () => apiRequest("/aws/status"),

      // Auth
      login: (creds) => apiRequest("/auth/login", { method: "POST", body: JSON.stringify(creds) }),
      registerStudent: (d) => apiRequest("/auth/register/student", { method: "POST", body: JSON.stringify(d) }),
      registerRecruiter: (d) => apiRequest("/auth/register/recruiter", { method: "POST", body: JSON.stringify(d) }),
      getMe: () => apiRequest("/auth/me"),
      changePassword: (d) => apiRequest("/auth/change-password", { method: "POST", body: JSON.stringify(d) }),

      // Student
      getStudentProfile: () => apiRequest("/student/profile"),
      updateStudentProfile: (p) => apiRequest("/student/profile", { method: "PUT", body: JSON.stringify(p) }),
      uploadResume: (file) => {
        const formData = new FormData();
        formData.append("file", file);
        return apiRequest("/student/resume/upload", { method: "POST", body: formData });
      },
      getStudentJobs: () => apiRequest("/student/jobs"),
      applyJob: (id) => apiRequest(`/student/jobs/${id}/apply`, { method: "POST" }),
      getStudentApplications: () => apiRequest("/student/applications"),
      getStudentNotifications: () => apiRequest("/student/notifications"),
      markNotificationRead: (id) => apiRequest(`/student/notifications/${id}/read`, { method: "POST" }),

      // Recruiter
      getRecruiterProfile: () => apiRequest("/recruiter/profile"),
      getRecruiterJobs: () => apiRequest("/recruiter/jobs"),
      createJob: (j) => apiRequest("/recruiter/jobs", { method: "POST", body: JSON.stringify(j) }),
      updateJob: (id, j) => apiRequest(`/recruiter/jobs/${id}`, { method: "PUT", body: JSON.stringify(j) }),
      submitJob: (id) => apiRequest(`/recruiter/jobs/${id}/submit`, { method: "POST" }),
      closeJob: (id) => apiRequest(`/recruiter/jobs/${id}/close`, { method: "POST" }),
      deleteJob: (id) => apiRequest(`/recruiter/jobs/${id}`, { method: "DELETE" }),
      getJobApplications: (id, page = 1, limit = 50, status = "", branch = "") => {
        let u = `/recruiter/jobs/${id}/applications?page=${page}&limit=${limit}`;
        if (status) u += `&status=${encodeURIComponent(status)}`;
        if (branch) u += `&branch=${encodeURIComponent(branch)}`;
        return apiRequest(u);
      },
      batchUpdate: (id, ids, status) => apiRequest(`/recruiter/jobs/${id}/applications/batch-update`, {
        method: "POST",
        body: JSON.stringify({ application_ids: ids, status }),
      }),
      scheduleInterview: (jobId, appId, payload) => apiRequest(`/recruiter/jobs/${jobId}/applications/${appId}/schedule-interview`, {
        method: "POST",
        body: JSON.stringify(payload),
      }),
      exportJobCsvUrl: (jobId) => `${API_BASE}/recruiter/jobs/${jobId}/export-csv`,

      // Admin
      getPendingRecruiters: () => apiRequest("/admin/recruiters/pending"),
      approveRecruiter: (id) => apiRequest(`/admin/recruiters/${id}/approve`, { method: "POST" }),
      rejectRecruiter: (id) => apiRequest(`/admin/recruiters/${id}/reject`, { method: "POST" }),
      getPendingJobs: () => apiRequest("/admin/jobs/pending"),
      approveJob: (id) => apiRequest(`/admin/jobs/${id}/approve`, { method: "POST" }),
      requestChanges: (id, feedback) => apiRequest(`/admin/jobs/${id}/request-changes`, {
        method: "POST",
        body: JSON.stringify({ admin_feedback: feedback }),
      }),
      getAuditLogs: (page = 1) => apiRequest(`/admin/audit-logs?page=${page}&limit=25`),
      getMetrics: () => apiRequest("/admin/metrics"),
      getAdminStudents: (page = 1, limit = 50, search = "", branch = "") => {
        let u = `/admin/students?page=${page}&limit=${limit}`;
        if (search) u += `&search=${encodeURIComponent(search)}`;
        if (branch) u += `&branch=${encodeURIComponent(branch)}`;
        return apiRequest(u);
      },
      getAdminRecruiters: (page = 1, limit = 50, status = "", search = "") => {
        let u = `/admin/recruiters?page=${page}&limit=${limit}`;
        if (status) u += `&status=${encodeURIComponent(status)}`;
        if (search) u += `&search=${encodeURIComponent(search)}`;
        return apiRequest(u);
      },
      exportStudentsCsvUrl: () => `${API_BASE}/admin/export/students-csv`,
      exportPlacementsCsvUrl: () => `${API_BASE}/admin/export/placements-csv`,
    };

    // --- POPUP HOVER COMPONENT ---
    function HoverPopup({ children, title, subtitle, badge, position = "top", icon = null, className = "" }) {
      return (
        <span className={`inline-flex ${className}`} title={title ? `${title}${subtitle ? ` - ${subtitle}` : ''}` : undefined}>
          {children}
        </span>
      );
    }

    // --- TOAST COMPONENT ---
    function ToastContainer({ toasts, onDismiss }) {
      return (
        <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2.5 max-w-sm pointer-events-none">
          {toasts.map((t) => (
            <div
              key={t.id}
              className={`pointer-events-auto p-3.5 rounded-lg shadow-lg border bg-white flex items-start gap-3 transition-all ${
                t.type === "error"
                  ? "border-red-200 text-red-800"
                  : t.type === "success"
                  ? "border-emerald-200 text-emerald-800"
                  : "border-slate-200 text-slate-800"
              }`}
            >
              <div className="flex-1 text-xs whitespace-pre-line leading-relaxed font-medium">
                {t.message}
              </div>
              <button
                type="button"
                onClick={() => onDismiss(t.id)}
                className="text-slate-400 hover:text-slate-600 text-xs font-bold leading-none p-1"
              >
                ✕
              </button>
            </div>
          ))}
        </div>
      );
    }

    // --- APPLICATION ROOT COMPONENT ---
    function App() {
      const [user, setUser] = useState(null);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authModalMode, setAuthModalMode] = useState("LOGIN");
      const [authModalRole, setAuthModalRole] = useState("STUDENT");
      const [passwordModalOpen, setPasswordModalOpen] = useState(false);
      const [notificationsOpen, setNotificationsOpen] = useState(false);
      const [notifications, setNotifications] = useState([]);
      const [loading, setLoading] = useState(true);
      const [toasts, setToasts] = useState([]);

      const addToast = (message, type = "info") => {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 5000);
      };

      const dismissToast = (id) => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      };

      useEffect(() => {
        const u = getStoredUser();
        const t = getStoredToken();
        if (u && t) {
          setUser(u);
          if (u.role === "STUDENT") loadNotifications();
        }
        setLoading(false);
      }, []);

      const loadNotifications = async () => {
        try {
          const list = await api.getStudentNotifications();
          setNotifications(list);
        } catch (e) {}
      };

      const handleLogout = () => {
        removeStoredToken();
        setUser(null);
        setNotifications([]);
        addToast("Signed out of session safely.", "info");
      };

      const handleOpenAuth = (mode = "LOGIN", role = "STUDENT") => {
        setAuthModalMode(mode);
        setAuthModalRole(role);
        setAuthModalOpen(true);
      };

      const unreadCount = notifications.filter((n) => !n.is_read).length;

      if (loading) {
        return (
          <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center text-blue-600 gap-3">
            <div className="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
            <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider">
              Loading Campus Placement Portal...
            </div>
          </div>
        );
      }

      // 1. FIRST / LANDING PAGE: Clean, professional, and light-themed (VTOP-inspired)
      if (!user) {
        return (
          <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans">
            {/* Clean Professional Institutional Header */}
            <header className="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-sm">
                    🏛️
                  </div>
                  <div>
                    <span className="font-extrabold text-slate-900 text-sm sm:text-base tracking-tight block leading-tight">
                      Campus Placement Portal
                    </span>
                    <span className="text-[11px] text-slate-500 font-medium block">
                      Training &amp; Placement Cell
                    </span>
                  </div>
                </div>

                <div className="flex items-center space-x-3 text-xs text-slate-600 font-medium">
                  <span className="hidden sm:inline-block px-3 py-1 bg-slate-100 rounded-md border border-slate-200 text-slate-600 text-xs font-semibold">
                    Academic Year 2025–26
                  </span>
                </div>
              </div>
            </header>

            {/* Landing Content: Tagline, short supporting sentence, and 3 Role Cards */}
            <main className="flex-1 flex flex-col justify-center">
              <LandingView onOpenAuth={handleOpenAuth} />
            </main>

            {/* Clean Institutional Footer */}
            <footer className="bg-white border-t border-slate-200 py-4 text-xs text-slate-500 text-center">
              <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
                <span>&copy; Campus Placement &amp; Internship Portal &bull; Directorate of Training &amp; Placement</span>
                <span className="text-slate-400">Institutional Access Gateway</span>
              </div>
            </footer>

            {/* Auth Modal with Preselected Role */}
            <AuthModal
              isOpen={authModalOpen}
              initialMode={authModalMode}
              initialRole={authModalRole}
              onClose={() => setAuthModalOpen(false)}
              onSuccess={(u) => {
                setUser(u);
                if (u.role === "STUDENT") loadNotifications();
                addToast(`Welcome back, ${u.name}!`, "success");
              }}
            />

            <ToastContainer toasts={toasts} onDismiss={dismissToast} />
          </div>
        );
      }      
      // 2. LOGGED-IN WORKSPACE (Dashboard for Student, Recruiter, Admin)
      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans relative">
          {/* Top Institutional Navigation Bar */}
          <header className="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              
              {/* Brand Logo & Portal Title */}
              <div className="flex items-center space-x-3">
                <div className="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
                  CP
                </div>

                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-sm sm:text-base tracking-tight text-slate-900">
                      Campus Placement Portal
                    </span>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md border ${
                      user.role === 'ADMIN'
                        ? 'bg-purple-50 text-purple-700 border-purple-200'
                        : user.role === 'RECRUITER'
                        ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                        : 'bg-blue-50 text-blue-700 border-blue-200'
                    }`}>
                      {user.role} WORKSPACE
                    </span>
                  </div>
                </div>
              </div>

              {/* Navigation Controls */}
              <div className="flex items-center space-x-2.5 sm:space-x-3">
                {/* Student Alert Inbox */}
                {user.role === "STUDENT" && (
                  <button
                    onClick={() => setNotificationsOpen(true)}
                    className="relative p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-200 transition-colors"
                    title="Notifications & Alerts"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    {unreadCount > 0 && (
                      <span className="absolute -top-1 -right-1 px-1.5 py-0.2 bg-red-600 text-white font-bold text-[9px] rounded-full shadow-sm">
                        {unreadCount}
                      </span>
                    )}
                  </button>
                )}

                {/* User Identity Chip */}
                <div className="flex items-center space-x-2.5 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">
                  <div className="w-7 h-7 rounded-md bg-blue-600 flex items-center justify-center font-bold text-white text-xs">
                    {user.name ? user.name.charAt(0).toUpperCase() : "U"}
                  </div>
                  <div className="text-right hidden sm:block">
                    <div className="text-xs font-semibold text-slate-800 leading-tight">{user.name}</div>
                    <div className="text-[10px] text-slate-500 font-mono">{user.email}</div>
                  </div>
                </div>

                {/* Change Password Button */}
                <button
                  onClick={() => setPasswordModalOpen(true)}
                  className="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-200 transition-colors"
                  title="Change Password"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                  </svg>
                </button>

                {/* Sign Out */}
                <button
                  onClick={handleLogout}
                  className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 transition-colors"
                >
                  Sign Out
                </button>
              </div>
            </div>
          </header>

          {/* Main Workspace Body */}
          <main className="flex-1 flex flex-col bg-slate-50">
            {user.role === "STUDENT" ? (
              <StudentView user={user} onRefreshNotifications={loadNotifications} addToast={addToast} />
            ) : user.role === "RECRUITER" ? (
              <RecruiterView user={user} addToast={addToast} />
            ) : user.role === "ADMIN" ? (
              <AdminView user={user} addToast={addToast} />
            ) : null}
          </main>

          {/* Global Modals for Logged-In User */}
          <ChangePasswordModal
            isOpen={passwordModalOpen}
            onClose={() => setPasswordModalOpen(false)}
            addToast={addToast}
          />

          <NotificationModal
            isOpen={notificationsOpen}
            onClose={() => setNotificationsOpen(false)}
            notifications={notifications}
            onRefresh={loadNotifications}
          />

          <ToastContainer toasts={toasts} onDismiss={dismissToast} />

          {/* Logged in footer */}
          <footer className="bg-white border-t border-slate-200 py-4 text-xs text-slate-500 text-center">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-2">
              <span>Campus Placement &amp; Internship Portal &bull; Directorate of Training &amp; Placement</span>
              <span className="text-slate-400 font-mono text-[11px]">Institutional Portal &bull; Active Session</span>
            </div>
          </footer>
        </div>
      );
      
    }

    // --- LANDING VIEW (CLEAN VTOP-INSPIRED LIGHT THEME) ---
    function LandingView({ onOpenAuth }) {
      return (
        <div className="flex-1 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
          <div className="max-w-5xl mx-auto w-full space-y-10">
            
            {/* Tagline / Headline at the top */}
            <div className="text-center space-y-3">
              <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                Campus Placement &amp; Internship Portal
              </h1>
              <p className="text-sm sm:text-base text-slate-600 max-w-2xl mx-auto">
                Centralized gateway for academic placement drives, corporate internships, and recruitment governance.
              </p>
            </div>

            {/* Three separate login cards: Responsive row on desktop, stacked on mobile */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8">
              
              {/* Card 1: Student */}
              <div className="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow p-6 sm:p-7 flex flex-col justify-between text-left">
                <div>
                  <div className="w-12 h-12 rounded-lg bg-blue-50 text-blue-600 border border-blue-100 flex items-center justify-center text-2xl mb-4">
                    🎓
                  </div>
                  <h2 className="text-lg font-bold text-slate-900 mb-1.5">Student</h2>
                  <p className="text-xs text-slate-600 leading-relaxed mb-6">
                    Access active placement drives, submit applications, check eligibility status, and track interview calls.
                  </p>
                </div>
                <button
                  type="button"
                  onClick={() => onOpenAuth("LOGIN", "STUDENT")}
                  className="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs transition-colors shadow-sm text-center"
                >
                  Student Login
                </button>
              </div>

              {/* Card 2: Company / Recruiter */}
              <div className="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow p-6 sm:p-7 flex flex-col justify-between text-left">
                <div>
                  <div className="w-12 h-12 rounded-lg bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center justify-center text-2xl mb-4">
                    🏢
                  </div>
                  <h2 className="text-lg font-bold text-slate-900 mb-1.5">Company / Recruiter</h2>
                  <p className="text-xs text-slate-600 leading-relaxed mb-6">
                    Publish campus job openings, review student candidates, manage candidate stages, and schedule interview rounds.
                  </p>
                </div>
                <button
                  type="button"
                  onClick={() => onOpenAuth("LOGIN", "RECRUITER")}
                  className="w-full py-2.5 px-4 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs transition-colors shadow-sm text-center"
                >
                  Company Login
                </button>
              </div>

              {/* Card 3: Administrator */}
              <div className="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow p-6 sm:p-7 flex flex-col justify-between text-left">
                <div>
                  <div className="w-12 h-12 rounded-lg bg-purple-50 text-purple-600 border border-purple-100 flex items-center justify-center text-2xl mb-4">
                    🛡️
                  </div>
                  <h2 className="text-lg font-bold text-slate-900 mb-1.5">Administrator</h2>
                  <p className="text-xs text-slate-600 leading-relaxed mb-6">
                    Verify recruiter accounts, approve job postings, oversee placement procedures, and export institutional reports.
                  </p>
                </div>
                <button
                  type="button"
                  onClick={() => onOpenAuth("LOGIN", "ADMIN")}

    // --- STUDENT VIEW (APPLICANT WORKSPACE) ---
    // --- STUDENT VIEW (APPLICANT WORKSPACE) ---
    function StudentView({ user, onRefreshNotifications, addToast }) {
      const [profile, setProfile] = useState(null);
      const [jobs, setJobs] = useState([]);
      const [applications, setApplications] = useState([]);
      const [activeTab, setActiveTab] = useState("JOBS");
      const [searchQuery, setSearchQuery] = useState("");
      const [filterEligibleOnly, setFilterEligibleOnly] = useState(false);
      const [uploadingResume, setUploadingResume] = useState(false);
      const [profileModalOpen, setProfileModalOpen] = useState(false);
      const [eligibilityModalJob, setEligibilityModalJob] = useState(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        loadData();
      }, []);

      const loadData = async () => {
        try {
          const [p, j, a] = await Promise.all([
            api.getStudentProfile(),
            api.getStudentJobs(),
            api.getStudentApplications(),
          ]);
          setProfile(p);
          setJobs(j);
          setApplications(a);
        } catch (e) {
          addToast(`Error loading student data: ${e.message}`, "error");
        }
      };

      const handleResumeFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.name.toLowerCase().endsWith(".pdf")) {
          addToast("Only PDF documents (.pdf) are permitted for resumes.", "error");
          return;
        }

        setUploadingResume(true);
        try {
          const res = await api.uploadResume(file);
          setProfile((prev) => ({ ...prev, resume_url: res.resume_url }));
          addToast(`Resume uploaded successfully (${res.storage})`, "success");
          loadData();
        } catch (err) {
          addToast(`Upload failed: ${err.message}`, "error");
        } finally {
          setUploadingResume(false);
          if (fileInputRef.current) fileInputRef.current.value = "";
        }
      };

      const handleApply = async (job) => {
        try {
          await api.applyJob(job.id);
          addToast(`Application confirmed for ${job.title} at ${job.company_name}!`, "success");
          loadData();
        } catch (e) {
          addToast(e.message, "error");
        }
      };

      const appliedJobIds = useMemo(() => new Set(applications.map((a) => a.job_id)), [applications]);

      const filteredJobs = useMemo(() => {
        return jobs.filter((j) => {
          const matchesSearch =
            j.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            j.company_name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (j.job_location && j.job_location.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchesEligible = filterEligibleOnly ? j.is_eligible : true;
          return matchesSearch && matchesEligible;
        });
      }, [jobs, searchQuery, filterEligibleOnly]);

        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">

            <div className="flex items-center gap-4">
              <div className="w-14 h-14 rounded-xl bg-blue-50 border border-blue-200 flex items-center justify-center text-xl font-bold text-blue-600">
                {profile ? profile.full_name.charAt(0) : "S"}

              <div>
                <div className="flex items-center gap-2.5 flex-wrap">

                activeTab === "APPLICATIONS"

          </div>

          {/* TAB 1: PLACEMENT DRIVES */}
          {activeTab === "JOBS" && (

              {/* Placement Drive Cards Grid */}

                        {/* Bottom Actions Bar */}

                          {isApplied ? (

                                job.is_eligible
                                  ? "bg-blue-600 hover:bg-blue-700 text-white"

              )}
            </div>
          )}

          {/* TAB 2: MY APPLICATIONS */}
          {activeTab === "APPLICATIONS" && (

              {applications.length === 0 ? (

                      >
                        <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 pb-3 border-b border-slate-100">

                              Applied on {new Date(app.applied_at).toLocaleDateString()}

                          <span
                            className={`px-3 py-1 rounded-md text-xs font-semibold uppercase tracking-wide border ${

                                : app.status === "SHORTLISTED"
                                ? "bg-blue-50 text-blue-700 border-blue-200"
                                : app.status === "UNDER_REVIEW"
                                ? "bg-indigo-50 text-indigo-700 border-indigo-200"
                                : app.status === "REJECTED"
                                ? "bg-red-50 text-red-700 border-red-200"
                                : "bg-slate-100 text-slate-700 border-slate-200"

                              <div className="font-semibold text-blue-900">
                                Interview Scheduled: {app.interview_round}
                              </div>
                              <div className="text-slate-600 mt-0.5">
                                Date &amp; Time: <b>{new Date(app.interview_scheduled_at).toLocaleString()}</b>

                    type="button"
                    onClick={() => setEligibilityModalJob(null)}

    // --- EDIT PROFILE MODAL ---
    function EditProfileModal({ profile, onClose, onSuccess, addToast }) {
      const [fullName, setFullName] = useState(profile.full_name || "");
      const [cgpa, setCgpa] = useState(profile.cgpa || 0.0);
      const [branch, setBranch] = useState(profile.branch || "CSE");
      const [gradYear, setGradYear] = useState(profile.graduation_year || 2025);
      const [saving, setSaving] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          const updated = await api.updateStudentProfile({
            full_name: fullName,
            cgpa: parseFloat(cgpa),
            branch: branch,
            graduation_year: parseInt(gradYear),
          });
          onSuccess(updated);
        } catch (err) {
          addToast(`Error updating profile: ${err.message}`, "error");
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-xl max-w-md w-full p-6 text-left border border-slate-200 shadow-xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-slate-200">
              <h3 className="font-bold text-base text-slate-900">Edit Academic Profile</h3>
              <button
                type="button"
                onClick={onClose}
                className="text-slate-400 hover:text-slate-600 text-base font-bold leading-none"
              >
                ✕
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-slate-700 font-semibold mb-1">Full Name</label>
                <input
                  type="text"
                  required
                  value={fullName}
                  onChange={(e) => setFullName(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                />
              </div>

              <div>
                <label className="block text-slate-700 font-semibold mb-1">Academic CGPA (0.00 - 10.00)</label>
                <input
                  type="number"
                  step="0.01"
                  min="0"
                  max="10"
                  required
                  value={cgpa}
                  onChange={(e) => setCgpa(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                />
              </div>

              <div>
                <label className="block text-slate-700 font-semibold mb-1">Department / Branch</label>
                <select
                  value={branch}
                  onChange={(e) => setBranch(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                >
                  <option value="CSE">CSE (Computer Science & Engineering)</option>
                  <option value="ECE">ECE (Electronics & Communication)</option>
                  <option value="IT">IT (Information Technology)</option>
                  <option value="ME">ME (Mechanical Engineering)</option>
                  <option value="CE">CE (Civil Engineering)</option>
                  <option value="EEE">EEE (Electrical & Electronics)</option>
                </select>
              </div>

              <div>
                <label className="block text-slate-700 font-semibold mb-1">Graduation Batch Year</label>
                <input
                  type="number"
                  required
                  value={gradYear}
                  onChange={(e) => setGradYear(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                />
              </div>

              <div className="pt-2 flex gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2 rounded-lg bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-semibold text-xs shadow-sm transition-colors"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="flex-1 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-sm transition-colors disabled:opacity-50"
                >
                  {saving ? "Saving..." : "Save Metrics"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- RECRUITER VIEW (ATS COMMAND CENTER) ---

      const [profile, setProfile] = useState(null);

      const [applications, setApplications] = useState([]);
      const [selectedAppIds, setSelectedAppIds] = useState([]);
      const [statusFilter, setStatusFilter] = useState("");
      const [branchFilter, setBranchFilter] = useState("");
      const [createModalOpen, setCreateModalOpen] = useState(false);
      const [interviewModalApp, setInterviewModalApp] = useState(null);
      const [loadingApps, setLoadingApps] = useState(false);

      useEffect(() => {
        loadRecruiterData();
      }, []);

      const loadRecruiterData = async () => {
        try {
          const [p, j] = await Promise.all([
            api.getRecruiterProfile(),
            api.getRecruiterJobs(),
          ]);
          setProfile(p);
          setJobs(j);
          if (j.length > 0 && !selectedJob) {
            selectJobForAts(j[0]);
          }
        } catch (e) {
          addToast(`Error: ${e.message}`, "error");
        }
      };

      const selectJobForAts = async (job) => {
        setSelectedJob(job);
        setSelectedAppIds([]);
        setLoadingApps(true);
        try {
          const res = await api.getJobApplications(job.id, 1, 50, statusFilter, branchFilter);
          setApplications(res.items || []);
        } catch (err) {
          addToast(`Failed to load applications: ${err.message}`, "error");
        } finally {
          setLoadingApps(false);
        }
      };

      useEffect(() => {
        if (selectedJob) {
          selectJobForAts(selectedJob);
        }
      }, [statusFilter, branchFilter]);

      const handleBatchUpdate = async (newStatus) => {
        if (selectedAppIds.length === 0) {
          addToast("Please select at least one candidate using the checkboxes.", "info");
          return;
        }
        try {
          const res = await api.batchUpdate(selectedJob.id, selectedAppIds, newStatus);
          addToast(`Batch update completed: ${res.updated_count} candidate(s) set to ${newStatus}`, "success");
          setSelectedAppIds([]);
          selectJobForAts(selectedJob);
        } catch (e) {
          addToast(`Batch update failed: ${e.message}`, "error");
        }
      };

      const handleSubmitJob = async (jobId) => {
        try {
          await api.submitJob(jobId);
          addToast("Job successfully submitted for placement cell vetting!", "success");
          loadRecruiterData();
        } catch (e) {
          addToast(e.message, "error");
        }
      };

      const handleCloseJob = async (jobId) => {
        try {
          await api.closeJob(jobId);
          addToast("Job posting closed.", "info");
          loadRecruiterData();
        } catch (e) {
          addToast(e.message, "error");
        }
      };

      const handleDeleteJob = async (jobId) => {
        if (!confirm("Are you sure you want to delete this job posting?")) return;
        try {
          await api.deleteJob(jobId);
          addToast("Job deleted successfully.", "info");
          loadRecruiterData();
        } catch (e) {
          addToast(e.message, "error");
        }
      };

      const toggleAppSelection = (id) => {
        setSelectedAppIds((prev) =>
          prev.includes(id) ? prev.filter((i) => i !== id) : [...prev, id]
        );
      };

      const toggleSelectAll = () => {
        if (selectedAppIds.length === applications.length) {
          setSelectedAppIds([]);
        } else {
          setSelectedAppIds(applications.map((a) => a.id));
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
          
          {/* Company Header */}
          <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2.5">
                <h1 className="text-xl sm:text-2xl font-bold text-slate-900">{profile?.company_name}</h1>
                <span
                  className={`px-2.5 py-0.5 rounded-md text-xs font-semibold border ${
                    profile?.status === "ACTIVE"
                      ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                      : profile?.status === "REJECTED"
                      ? "bg-red-50 text-red-700 border-red-200"
                      : "bg-amber-50 text-amber-700 border-amber-200"
                  }`}
                >
                  {profile?.status === "ACTIVE" ? "Approved" : profile?.status === "REJECTED" ? "Rejected" : "Pending Approval"}
                </span>
              </div>
              <div className="text-xs text-slate-500 mt-1">
                HR Representative: <b className="text-slate-800">{profile?.hr_name}</b> &bull; Email: {profile?.email}
              </div>

              {profile?.status === "PENDING" && (
                <div className="mt-3 p-3 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-xs flex items-center gap-2">
                  <span>Your organization is awaiting approval from the Placement Cell.</span>
                </div>
              )}
            </div>

            <button
              type="button"
              onClick={() => setCreateModalOpen(true)}
              disabled={profile?.status !== "ACTIVE"}
              className="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap"
            >
              Post New Drive
            </button>
          </div>

          {/* Recruitment Drives Section */}
          <div className="space-y-3">
            <h2 className="text-sm font-bold text-slate-800">Recruitment Drives</h2>
            {jobs.length === 0 ? (
              <div className="bg-white rounded-xl border border-slate-200 p-8 text-center text-slate-400 text-xs shadow-sm">
                No recruitment drives posted. Click "Post New Drive" to create an opening.
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {jobs.map((job) => {
                  const isSelected = selectedJob?.id === job.id;
                  return (
                    <div
                      key={job.id}
                      onClick={() => selectJobForAts(job)}
                      className={`bg-white rounded-xl p-5 text-left border cursor-pointer transition-all flex flex-col justify-between space-y-3 shadow-sm ${
                        isSelected
                          ? "border-blue-600 ring-2 ring-blue-100"
                          : "border-slate-200 hover:border-slate-300"
                      }`}
                    >
                      <div className="space-y-2">
                        <div className="flex items-center justify-between gap-2">
                          <span
                            className={`text-[11px] font-semibold px-2 py-0.5 rounded-md border ${
                              job.status === "ACTIVE"
                                ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                                : job.status === "REQUIRES_CHANGES"
                                ? "bg-red-50 text-red-700 border-red-200"
                                : job.status === "PENDING_APPROVAL"
                                ? "bg-amber-50 text-amber-700 border-amber-200"
                                : "bg-slate-100 text-slate-600 border-slate-200"
                            }`}
                          >
                            {job.status.replace("_", " ")}
                          </span>
                          {job.ctc_lpa > 0 && (
                            <span className="text-xs font-bold text-emerald-700">₹{job.ctc_lpa} LPA</span>
                          )}
                        </div>

                        <h3 className="text-sm font-bold text-slate-900 line-clamp-1">{job.title}</h3>
                        
                        <div className="text-[11px] text-slate-500 space-y-0.5">
                          <div>Location: {job.job_location || "On-site / Hybrid"}</div>
                          <div>Type: {job.job_type || "Full-Time"} &bull; Min CGPA: {job.min_cgpa.toFixed(2)}</div>
                          {job.allowed_branches && (
                            <div className="truncate">Depts: {job.allowed_branches.join(", ")}</div>
                          )}
                        </div>
                      </div>

                      {/* Admin Feedback Block if changes required */}
                      {job.status === "REQUIRES_CHANGES" && job.admin_feedback && (
                        <div className="p-2.5 rounded-lg bg-red-50 border border-red-200 text-red-700 text-[11px]">
                          <b>Placement Cell Feedback:</b> {job.admin_feedback}
                        </div>
                      )}

                      {/* Controls Bar */}
                      <div className="pt-2 border-t border-slate-100 flex items-center justify-between gap-2 text-xs">
                        <div className="flex items-center gap-1.5">
                          {["DRAFT", "REQUIRES_CHANGES"].includes(job.status) && (
                            <button
                              type="button"
                              onClick={(e) => { e.stopPropagation(); handleSubmitJob(job.id); }}
                              className="px-2.5 py-1 rounded-md bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 text-[11px] font-semibold"
                            >
                              Submit
                            </button>
                          )}
                          {job.status === "ACTIVE" && (
                            <button
                              type="button"
                              onClick={(e) => { e.stopPropagation(); handleCloseJob(job.id); }}
                              className="px-2.5 py-1 rounded-md bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-200 text-[11px] font-semibold"
                            >
                              Close
                            </button>
                          )}
                          <button
                            type="button"
                            onClick={(e) => { e.stopPropagation(); selectJobForAts(job); }}
                            className="px-2.5 py-1 rounded-md bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-200 text-[11px] font-semibold"
                          >
                            Applications
                          </button>
                        </div>

                        <div className="flex items-center gap-1.5">
                          <a
                            href={api.exportJobCsvUrl(job.id)}
                            onClick={(e) => e.stopPropagation()}
                            download
                            className="px-2 py-1 rounded-md bg-slate-50 hover:bg-slate-100 text-slate-600 text-[11px] font-medium border border-slate-200"
                          >
                            CSV
                          </a>

                          <button
                            type="button"
                            onClick={(e) => { e.stopPropagation(); handleDeleteJob(job.id); }}
                            className="px-2 py-1 rounded-md bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 text-[11px] font-semibold"
                          >
                            Delete
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* ATS Pipeline Table */}
          {selectedJob && (
            <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4 text-left">
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b border-slate-100">
                <div>
                  <span className="text-xs font-semibold text-blue-600 uppercase tracking-wide">Applicant Tracking (ATS)</span>
                  <h3 className="text-base font-bold text-slate-900">
                    Applicants for: <span className="text-slate-700">{selectedJob.title}</span>
                  </h3>
                </div>

                {/* Filters */}
                <div className="flex items-center gap-3 flex-wrap">
                  <select
                    value={statusFilter}
                    onChange={(e) => setStatusFilter(e.target.value)}
                    className="px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">All Statuses</option>
                    <option value="APPLIED">Applied</option>
                    <option value="UNDER_REVIEW">Under Review</option>
                    <option value="SHORTLISTED">Shortlisted</option>
                    <option value="OFFERED">Offered</option>
                    <option value="REJECTED">Rejected</option>
                  </select>

                  <select
                    value={branchFilter}
                    onChange={(e) => setBranchFilter(e.target.value)}
                    className="px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="">All Departments</option>
                    <option value="CSE">CSE</option>
                    <option value="ECE">ECE</option>
                    <option value="IT">IT</option>
                    <option value="ME">ME</option>
                  </select>

                  <a
                    href={api.exportJobCsvUrl(selectedJob.id)}
                    download
                    className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-slate-700 text-xs font-semibold hover:bg-slate-50 shadow-sm flex items-center gap-1.5"
                  >
                    Export CSV
                  </a>
                </div>
              </div>

              {/* Batch Actions Bar */}
              {selectedAppIds.length > 0 && (
                <div className="p-3.5 rounded-lg bg-blue-50 border border-blue-200 flex items-center justify-between flex-wrap gap-3">
                  <span className="text-xs font-semibold text-blue-900">
                    {selectedAppIds.length} candidate(s) selected:
                  </span>
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => handleBatchUpdate("UNDER_REVIEW")}
                      className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 text-xs font-semibold shadow-sm"
                    >
                      Under Review
                    </button>
                    <button
                      type="button"
                      onClick={() => handleBatchUpdate("SHORTLISTED")}
                      className="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold shadow-sm"
                    >
                      Shortlist
                    </button>
                    <button
                      type="button"
                      onClick={() => handleBatchUpdate("OFFERED")}
                      className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-sm"
                    >
                      Select / Offer
                    </button>
                    <button
                      type="button"
                      onClick={() => handleBatchUpdate("REJECTED")}
                      className="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white text-xs font-semibold shadow-sm"
                    >
                      Reject
                    </button>
                  </div>
                </div>
              )}

              {/* Table */}
              {loadingApps ? (
                <div className="py-12 text-center text-slate-400 text-xs">Loading applicants...</div>
              ) : applications.length === 0 ? (
                <div className="py-12 text-center text-slate-400 text-xs">
                  No applicants matching filter conditions.
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-slate-200 text-slate-500 uppercase text-[10px] tracking-wider bg-slate-50">
                        <th className="py-3 px-3">
                          <input
                            type="checkbox"
                            checked={selectedAppIds.length === applications.length && applications.length > 0}
                            onChange={toggleSelectAll}
                            className="rounded border-slate-300 text-blue-600 focus:ring-blue-500"
                          />
                        </th>
                        <th className="py-3 px-3">Student</th>
                        <th className="py-3 px-3">Registration No.</th>
                        <th className="py-3 px-3">Department</th>
                        <th className="py-3 px-3">CGPA</th>
                        <th className="py-3 px-3">Resume</th>
                        <th className="py-3 px-3">Application Status</th>
                        <th className="py-3 px-3">Interview</th>
                        <th className="py-3 px-3 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {applications.map((app) => {
                        const student = app.student;
                        const isChecked = selectedAppIds.includes(app.id);
                        return (
                          <tr key={app.id} className="hover:bg-slate-50 transition-colors">
                            <td className="py-3 px-3">
                              <input
                                type="checkbox"
                                checked={isChecked}
                                onChange={() => toggleAppSelection(app.id)}
                                className="rounded border-slate-300 text-blue-600 focus:ring-blue-500"
                              />
                            </td>
                            <td className="py-3 px-3">
                              <div className="font-semibold text-slate-900">{student?.full_name || "N/A"}</div>
                              <div className="text-[10px] text-slate-500">{student?.email}</div>
                            </td>
                            <td className="py-3 px-3 font-mono font-semibold text-slate-700">
                              {student?.roll_number}
                            </td>
                            <td className="py-3 px-3 text-slate-700">
                              {student?.branch}
                            </td>
                            <td className="py-3 px-3 font-bold text-slate-900">
                              {student?.cgpa ? student.cgpa.toFixed(2) : "N/A"}
                            </td>
                            <td className="py-3 px-3">
                              {student?.resume_url ? (
                                <a
                                  href={student.resume_url}
                                  target="_blank"
                                  rel="noreferrer"
                                  className="text-blue-600 hover:underline font-semibold"
                                >
                                  View PDF
                                </a>
                              ) : (
                                <span className="text-slate-400">—</span>
                              )}
                            </td>
                            <td className="py-3 px-3">
                              <span
                                className={`px-2 py-0.5 rounded-md font-semibold text-[10px] uppercase border ${
                                  app.status === "OFFERED"
                                    ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                                    : app.status === "SHORTLISTED"
                                    ? "bg-blue-50 text-blue-700 border-blue-200"
                                    : app.status === "UNDER_REVIEW"
                                    ? "bg-indigo-50 text-indigo-700 border-indigo-200"
                                    : app.status === "REJECTED"
                                    ? "bg-red-50 text-red-700 border-red-200"
                                    : "bg-slate-100 text-slate-700 border-slate-200"
                                }`}
                              >
                                {app.status.replace("_", " ")}
                              </span>
                            </td>
                            <td className="py-3 px-3">
                              {app.interview_round ? (
                                <div>
                                  <div className="font-semibold text-slate-900">{app.interview_round}</div>
                                  <div className="text-[10px] text-slate-500">
                                    {new Date(app.interview_scheduled_at).toLocaleDateString()}
                                  </div>
                                </div>
                              ) : (
                                <span className="text-slate-400">—</span>
                              )}
                            </td>
                            <td className="py-3 px-3 text-right">
                              <button
                                type="button"
                                onClick={() => setInterviewModalApp(app)}
                                className="px-2.5 py-1 rounded-md bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-semibold text-[11px] shadow-sm"
                              >
                                Interview
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {/* CREATE JOB MODAL */}
          {createModalOpen && (
            <CreateJobModal
              onClose={() => setCreateModalOpen(false)}
              onSuccess={() => {
                setCreateModalOpen(false);
                addToast("Job draft successfully created!", "success");
                loadRecruiterData();
              }}
              addToast={addToast}
            />
          )}

          {/* SCHEDULE INTERVIEW MODAL */}
          {interviewModalApp && (
            <ScheduleInterviewModal
              app={interviewModalApp}
              jobId={selectedJob.id}
              onClose={() => setInterviewModalApp(null)}
              onSuccess={() => {
                setInterviewModalApp(null);
                addToast("Candidate interview invitation scheduled successfully!", "success");
                selectJobForAts(selectedJob);
              }}
              addToast={addToast}
            />
          )}
        </div>
      );
    }

    // --- CREATE JOB MODAL ---
    function CreateJobModal({ onClose, onSuccess, addToast }) {
      const [title, setTitle] = useState("");
      const [description, setDescription] = useState("");
      const [ctcLpa, setCtcLpa] = useState(16.0);
      const [jobLocation, setJobLocation] = useState("Bengaluru / Hybrid");
      const [jobType, setJobType] = useState("Full-Time");
      const [minCgpa, setMinCgpa] = useState(7.0);
      const [allowedBranches, setAllowedBranches] = useState(["CSE", "IT"]);
      const [allowedGradYears, setAllowedGradYears] = useState([2025, 2026]);
      const [submitting, setSubmitting] = useState(false);

      const handleBranchToggle = (branch) => {
        setAllowedBranches((prev) =>
          prev.includes(branch) ? prev.filter((b) => b !== branch) : [...prev, branch]
        );
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        try {
          await api.createJob({
            title,
            description,
            ctc_lpa: parseFloat(ctcLpa) || 0.0,
            job_location: jobLocation,
            job_type: jobType,
            min_cgpa: parseFloat(minCgpa) || 0.0,
            allowed_branches: allowedBranches,
            allowed_graduation_years: allowedGradYears,
          });
          onSuccess();
        } catch (err) {
          addToast(`Error creating job: ${err.message}`, "error");
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-xl max-w-lg w-full p-6 text-left border border-slate-200 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between pb-3 border-b border-slate-200">
              <h3 className="font-bold text-base text-slate-900">Post New Recruitment Opening</h3>
              <button
                type="button"
                onClick={onClose}
                className="text-slate-400 hover:text-slate-600 text-base font-bold leading-none"
              >
                ✕
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-slate-700 font-semibold mb-1">Job Title</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Software Development Engineer"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                />
              </div>

              <div>
                <label className="block text-slate-700 font-semibold mb-1">Role Description</label>
                <textarea
                  required
                  rows={3}
                  placeholder="Detail responsibilities, tech stack, and qualifications..."
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-700 font-semibold mb-1">Package (LPA)</label>
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    required
                    value={ctcLpa}
                    onChange={(e) => setCtcLpa(e.target.value)}
                    className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                  />
                </div>
                <div>
                  <label className="block text-slate-700 font-semibold mb-1">Minimum CGPA</label>
                  <input
                    type="number"
                    step="0.01"
                    min="0"
                    max="10"
                    required
                    value={minCgpa}
                    onChange={(e) => setMinCgpa(e.target.value)}
                    className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-700 font-semibold mb-1">Location</label>
                  <input
                    type="text"
                    required
                    value={jobLocation}
                    onChange={(e) => setJobLocation(e.target.value)}
                    className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                  />
                </div>
                <div>
                  <label className="block text-slate-700 font-semibold mb-1">Employment Type</label>
                  <select
                    value={jobType}
                    onChange={(e) => setJobType(e.target.value)}
                    className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                  >

    // --- SCHEDULE INTERVIEW MODAL ---
    function ScheduleInterviewModal({ app, jobId, onClose, onSuccess, addToast }) {
      const [round, setRound] = useState("Technical Round 1");
      const [dateTime, setDateTime] = useState("");
      const [meetingLink, setMeetingLink] = useState("https://meet.google.com/interview");
      const [notes, setNotes] = useState("");
      const [scheduling, setScheduling] = useState(false);

      useEffect(() => {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(10, 0, 0, 0);
        setDateTime(tomorrow.toISOString().slice(0, 16));
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setScheduling(true);
        try {
          await api.scheduleInterview(jobId, app.id, {
            interview_round: round,
            interview_scheduled_at: new Date(dateTime).toISOString(),
            interview_meeting_link: meetingLink,
            interview_notes: notes,
          });
          onSuccess();
        } catch (err) {
          addToast(`Error scheduling interview: ${err.message}`, "error");
        } finally {
          setScheduling(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-xl max-w-md w-full p-6 text-left border border-slate-200 shadow-xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-slate-200">
              <h3 className="font-bold text-base text-slate-900">Schedule Interview</h3>
              <button
                type="button"
                onClick={onClose}
                className="text-slate-400 hover:text-slate-600 text-base font-bold leading-none"
              >
                ✕
              </button>
            </div>

            <div className="p-3 rounded-lg bg-slate-50 border border-slate-200 text-xs">
              <div className="text-slate-500 font-medium">Candidate:</div>
              <div className="font-bold text-slate-900">{app.student?.full_name} ({app.student?.roll_number})</div>
              <div className="text-[11px] text-slate-500">{app.student?.email}</div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-slate-700 font-semibold mb-1">Interview Round Title</label>
                <input
                  type="text"
                  required
                  value={round}
                  onChange={(e) => setRound(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                />
              </div>

              <div>
                <label className="block text-slate-700 font-semibold mb-1">Scheduled Date &amp; Time</label>
                <input
                  type="datetime-local"
                  required
                  value={dateTime}
                  onChange={(e) => setDateTime(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                />
              </div>

              <div>
                <label className="block text-slate-700 font-semibold mb-1">Meeting Link (Google Meet / Zoom)</label>
                <input
                  type="url"
                  required
                  value={meetingLink}
                  onChange={(e) => setMeetingLink(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                />
              </div>

              <div>
                <label className="block text-slate-700 font-semibold mb-1">Candidate Preparation Notes</label>
                <textarea
                  rows={2}
                  placeholder="Topics, round format, or instructions..."
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                />
              </div>

              <div className="pt-2 flex gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2 rounded-lg bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-semibold text-xs shadow-sm transition-colors"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={scheduling}
                  className="flex-1 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-sm transition-colors disabled:opacity-50"
                >
                  {scheduling ? "Scheduling..." : "Schedule Interview"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }
