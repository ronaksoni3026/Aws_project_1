                      <tr key={s.id} className="hover:bg-gray-900/40">
                        <td className="py-3 px-3 font-mono font-bold text-cyan-400">{s.roll_number}</td>
                        <td className="py-3 px-3 font-semibold text-white">{s.full_name}</td>
                        <td className="py-3 px-3 text-gray-300">{s.branch}</td>
                        <td className="py-3 px-3 font-bold text-emerald-400">{s.cgpa.toFixed(2)}</td>
                        <td className="py-3 px-3 text-gray-400">{s.graduation_year}</td>
                        <td className="py-3 px-3">
                          {s.resume_url ? (
                            <a
                              href={s.resume_url}
                              target="_blank"
                              rel="noreferrer"
                              className="text-indigo-400 hover:underline"
                            >
                              View PDF ↗
                            </a>
                          ) : (
                            <span className="text-gray-500">—</span>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 3: PARTNER COMPANIES */}
          {activeTab === "RECRUITERS" && (
            <div className="glass-card rounded-2xl p-5 border border-gray-800 space-y-4">
              <div className="flex items-center justify-between pb-3 border-b border-gray-800">
                <h3 className="font-bold text-white text-sm">Partner Companies & Recruiters</h3>
                <span className="text-xs text-gray-400">{recruiters.length} Registered Companies</span>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-gray-800 text-gray-400 uppercase text-[10px]">
                      <th className="py-2.5 px-3">Company</th>
                      <th className="py-2.5 px-3">HR Lead</th>
                      <th className="py-2.5 px-3">Email</th>
                      <th className="py-2.5 px-3">Status</th>
                      <th className="py-2.5 px-3">Active Drives</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-800/60">
                    {recruiters.map((r) => (
                      <tr key={r.id} className="hover:bg-gray-900/40">
                        <td className="py-3 px-3 font-bold text-white">{r.company_name}</td>
                        <td className="py-3 px-3 text-gray-300">{r.hr_name}</td>
                        <td className="py-3 px-3 text-gray-400">{r.email}</td>
                        <td className="py-3 px-3">
                          <span
                            className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                              r.status === "ACTIVE"
                                ? "bg-emerald-500/20 text-emerald-300"
                                : "bg-amber-500/20 text-amber-300"
                            }`}
                          >
                            {r.status}
                          </span>
                        </td>
                        <td className="py-3 px-3 font-bold text-indigo-400">{r.jobs_count || 0}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 4: AUDIT TRAIL */}
          {activeTab === "AUDIT" && (
            <div className="glass-card rounded-2xl p-5 border border-gray-800 space-y-4">
              <div className="flex items-center justify-between pb-3 border-b border-gray-800">
                <h3 className="font-bold text-white text-sm">Application-Level Immutable Audit Trail</h3>
                <span className="text-[11px] text-gray-400 font-mono">HASH: SHA256 Relational Integrity</span>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-gray-800 text-gray-400 uppercase text-[10px]">
                      <th className="py-2.5 px-3">Timestamp</th>
                      <th className="py-2.5 px-3">Admin</th>
                      <th className="py-2.5 px-3">Action</th>
                      <th className="py-2.5 px-3">Entity</th>
                      <th className="py-2.5 px-3">Details</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-800/60 font-mono text-[11px]">
                    {auditLogs.map((log) => (
                      <tr key={log.id} className="hover:bg-gray-900/40">
                        <td className="py-2.5 px-3 text-gray-400">{new Date(log.timestamp).toLocaleString()}</td>
                        <td className="py-2.5 px-3 text-purple-300">{log.admin_email}</td>
                        <td className="py-2.5 px-3 font-bold text-white">{log.action}</td>
                        <td className="py-2.5 px-3 text-cyan-400">{log.target_entity} #{log.target_id}</td>
                        <td className="py-2.5 px-3 text-gray-300 font-sans">{log.details}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* REQUEST CHANGES FEEDBACK MODAL */}
          {feedbackModalJob && (
            <RequestFeedbackModal
              job={feedbackModalJob}
              onClose={() => setFeedbackModalJob(null)}
              onSuccess={() => {
                setFeedbackModalJob(null);
                addToast("Changes requested and feedback sent to recruiter.", "info");
                loadAdminData();
              }}
              addToast={addToast}
            />
          )}
        </div>
      );
    }

    // --- REQUEST FEEDBACK MODAL ---
    function RequestFeedbackModal({ job, onClose, onSuccess, addToast }) {
      const [feedback, setFeedback] = useState("");
      const [sending, setSending] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSending(true);
        try {
          await api.requestChanges(job.id, feedback);
          onSuccess();
        } catch (err) {
          addToast(`Error: ${err.message}`, "error");
        } finally {
          setSending(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
          <div className="glass-panel rounded-2xl max-w-md w-full p-6 text-left border border-gray-700 shadow-2xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-gray-800">
              <h3 className="font-bold text-base text-white">Request Job Corrections</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-gray-400 font-semibold mb-1">
                  Mandatory Admin Feedback for {job.company_name}
                </label>
                <textarea
                  required
                  rows={4}
                  placeholder="Explain required corrections (e.g., clarify branch eligibility, adjust minimum CGPA)..."
                  value={feedback}
                  onChange={(e) => setFeedback(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-amber-500"
                />
              </div>

              <div className="pt-2 flex gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={sending}
                  className="flex-1 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold disabled:opacity-50"
                >
                  {sending ? "Sending..." : "Submit Feedback"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- CHANGE PASSWORD MODAL ---
    function ChangePasswordModal({ isOpen, onClose, addToast }) {
      const [oldPassword, setOldPassword] = useState("");
      const [newPassword, setNewPassword] = useState("");
      const [saving, setSaving] = useState(false);

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          await api.changePassword({ old_password: oldPassword, new_password: newPassword });
          addToast("Password changed successfully!", "success");
          onClose();
        } catch (err) {
          addToast(`Error: ${err.message}`, "error");
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
          <div className="glass-panel rounded-2xl max-w-sm w-full p-6 text-left border border-gray-700 shadow-2xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-gray-800">
              <h3 className="font-bold text-base text-white">Change Account Password</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-gray-400 font-semibold mb-1">Current Password</label>
                <input
                  type="password"
                  required
                  value={oldPassword}
                  onChange={(e) => setOldPassword(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">New Password (Min 6 chars)</label>
                <input
                  type="password"
                  required
                  minLength={6}
                  value={newPassword}
                  onChange={(e) => setNewPassword(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="pt-2 flex gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold disabled:opacity-50"
                >
                  {saving ? "Updating..." : "Update Password"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- NOTIFICATION MODAL ---
    function NotificationModal({ isOpen, onClose, notifications, onRefresh }) {
      if (!isOpen) return null;

      const handleMarkRead = async (id) => {
        try {
          await api.markNotificationRead(id);
          onRefresh();
        } catch (e) {}
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
          <div className="glass-panel rounded-2xl max-w-md w-full p-6 text-left border border-gray-700 shadow-2xl space-y-4 max-h-[80vh] flex flex-col">
            <div className="flex items-center justify-between pb-3 border-b border-gray-800">
              <h3 className="font-bold text-base text-white">Student Alert Inbox</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-2.5 pr-1">
              {notifications.length === 0 ? (
                <div className="py-8 text-center text-gray-400 text-xs">No alerts in your inbox.</div>
              ) : (
                notifications.map((n) => (
                  <div
                    key={n.id}
                    className={`p-3.5 rounded-xl border text-xs space-y-1.5 transition-all ${
                      n.is_read
                        ? "bg-gray-900/40 border-gray-800 text-gray-400"
                        : "bg-indigo-950/40 border-indigo-700/50 text-gray-200"
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <div className="font-bold text-white text-xs">{n.title}</div>
                      {!n.is_read && (
                        <button
                          onClick={() => handleMarkRead(n.id)}
                          className="text-[10px] text-cyan-400 hover:underline"
                        >
                          Mark as read
                        </button>
                      )}
                    </div>
                    <div className="text-[11px] leading-relaxed">{n.message}</div>
                    <div className="text-[10px] text-gray-500 font-mono">
                      {new Date(n.created_at).toLocaleString()}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- AUTH MODAL ---
    function AuthModal({ isOpen, initialMode, onClose, onSuccess }) {
      const [mode, setMode] = useState(initialMode || "LOGIN"); // "LOGIN" | "REGISTER_STUDENT" | "REGISTER_RECRUITER"
      const [role, setRole] = useState("STUDENT");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [fullName, setFullName] = useState("");
      const [rollNumber, setRollNumber] = useState("");
      const [cgpa, setCgpa] = useState(8.0);
      const [branch, setBranch] = useState("CSE");
      const [gradYear, setGradYear] = useState(2025);
      const [companyName, setCompanyName] = useState("");
      const [hrName, setHrName] = useState("");
      const [error, setError] = useState("");
      const [submitting, setSubmitting] = useState(false);

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError("");
        setSubmitting(true);

        try {
          if (mode === "LOGIN") {
            const res = await api.login({ email, password, role });
            setStoredToken(res.access_token);
            const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
            setStoredUser(u);
            onSuccess(u);
            onClose();
          } else if (mode === "REGISTER_STUDENT") {
            const res = await api.registerStudent({
              email,
              password,
              full_name: fullName,
              roll_number: rollNumber,
              cgpa: parseFloat(cgpa),
              branch,
              graduation_year: parseInt(gradYear),
            });
            setStoredToken(res.access_token);
            const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
            setStoredUser(u);
            onSuccess(u);
            onClose();
          } else if (mode === "REGISTER_RECRUITER") {
            const res = await api.registerRecruiter({
              email,
              password,
              company_name: companyName,
              hr_name: hrName,
            });
            setStoredToken(res.access_token);
            const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
            setStoredUser(u);
            onSuccess(u);
            onClose();
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
          <div className="glass-panel rounded-2xl max-w-md w-full p-6 text-left border border-gray-700 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between pb-3 border-b border-gray-800">
              <h3 className="font-bold text-base text-white">
                {mode === "LOGIN"
                  ? "Sign In to Placement Portal"
                  : mode === "REGISTER_STUDENT"
                  ? "Register Student Applicant"
                  : "Register Partner Recruiter"}
              </h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            {error && (
              <div className="p-3 rounded-xl bg-rose-950/60 border border-rose-800 text-rose-200 text-xs whitespace-pre-line">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              {mode === "LOGIN" && (
                <div>
                  <label className="block text-gray-400 font-semibold mb-1">Target Account Role</label>
                  <div className="grid grid-cols-3 gap-2">
                    {["STUDENT", "RECRUITER", "ADMIN"].map((r) => (
                      <button
                        type="button"
                        key={r}
                        onClick={() => setRole(r)}
                        className={`py-2 rounded-xl font-bold text-xs transition-all ${
                          role === r
                            ? "bg-indigo-600 text-white shadow-md shadow-indigo-600/30"
                            : "bg-gray-800 text-gray-400 hover:text-white"
                        }`}
                      >
                        {r}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {mode === "REGISTER_STUDENT" && (
                <>
                  <div>
                    <label className="block text-gray-400 font-semibold mb-1">Full Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Ronak Soni"
                      value={fullName}
                      onChange={(e) => setFullName(e.target.value)}
                      className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-gray-400 font-semibold mb-1">Roll Number</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. 21CS001"
                        value={rollNumber}
                        onChange={(e) => setRollNumber(e.target.value)}
                        className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block text-gray-400 font-semibold mb-1">Academic CGPA</label>
                      <input
                        type="number"
                        step="0.01"
                        min="0"
                        max="10"
                        required
                        value={cgpa}
                        onChange={(e) => setCgpa(e.target.value)}
                        className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-gray-400 font-semibold mb-1">Branch</label>
                      <select
                        value={branch}
                        onChange={(e) => setBranch(e.target.value)}
                        className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                      >
                        <option value="CSE">CSE</option>
                        <option value="ECE">ECE</option>
                        <option value="IT">IT</option>
                        <option value="ME">ME</option>
                        <option value="CE">CE</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-gray-400 font-semibold mb-1">Graduation Batch</label>
                      <input
                        type="number"
                        required
                        value={gradYear}
                        onChange={(e) => setGradYear(e.target.value)}
                        className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>
                </>
              )}

              {mode === "REGISTER_RECRUITER" && (
                <>
                  <div>
                    <label className="block text-gray-400 font-semibold mb-1">Company Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Amazon Web Services"
                      value={companyName}
                      onChange={(e) => setCompanyName(e.target.value)}
                      className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="block text-gray-400 font-semibold mb-1">HR Representative Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Priya Sharma"
                      value={hrName}
                      onChange={(e) => setHrName(e.target.value)}
                      className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </>
              )}

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Email Address</label>
                <input
                  type="email"
                  required
                  placeholder="name@placement.edu"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Password</label>
                <input
                  type="password"
                  required
                  placeholder="••••••••"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="pt-2">
                <button
                  type="submit"
                  disabled={submitting}
                  className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg shadow-indigo-600/30 transition-all disabled:opacity-50"
                >
                  {submitting
                    ? "Authenticating..."
                    : mode === "LOGIN"
                    ? "Sign In →"
                    : "Create Account →"}
                </button>
              </div>

              {/* Mode switch links */}
              <div className="pt-2 text-center text-[11px] text-gray-400 space-y-1">
                {mode === "LOGIN" ? (
                  <>
                    <div>
                      Student?{" "}
                      <button
                        type="button"
                        onClick={() => { setMode("REGISTER_STUDENT"); setError(""); }}
                        className="text-cyan-400 hover:underline font-bold"
                      >
                        Register as Applicant
                      </button>
                    </div>
                    <div>
                      Company Recruiter?{" "}
                      <button
                        type="button"
                        onClick={() => { setMode("REGISTER_RECRUITER"); setError(""); }}
                        className="text-indigo-400 hover:underline font-bold"
                      >
                        Register Company
                      </button>
                    </div>
                  </>
                ) : (
                  <div>
                    Already registered?{" "}
                    <button
                      type="button"
                      onClick={() => { setMode("LOGIN"); setError(""); }}
                      className="text-indigo-400 hover:underline font-bold"
                    >
                      Sign In here
                    </button>
                  </div>
                )}
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render the React app into #root
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
