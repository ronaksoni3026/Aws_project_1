<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex • Institutional Campus Placement Portal & Recruitment OS</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 4s ease-in-out infinite',
            'shimmer': 'shimmer 2s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            }
          }
        }
      }
    }
  </script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for runtime JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');
    
    :root {
      --bg-main: #030712;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.4);
    }
    
    body {
      background-color: var(--bg-main);
      color: #f3f4f6;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* Subtle grid background like Linear/Vercel */
    .bg-grid-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* Ambient spotlight glow */
    .spotlight {
      background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.05) 45%, transparent 70%);
    }

    /* Enterprise Glassmorphic card styling */
    .company-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .company-card:hover {
      border-color: rgba(99, 102, 241, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 20px 0 rgba(99, 102, 241, 0.1);
    }

    /* Pop-up Micro-interaction on cursor hover */
    .pop-trigger {
      position: relative;
    }
    .pop-content {
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%) translateY(6px) scale(0.92);
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 60;
      white-space: nowrap;
    }
    .pop-trigger:hover .pop-content {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Animated interactive button sheen */
    .btn-shine {
      position: relative;
      overflow: hidden;
    }
    .btn-shine::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.12) 50%, transparent 70%);
      transform: rotate(25deg) translateY(-100%);
      transition: transform 0.6s ease;
    }
    .btn-shine:hover::after {
      transform: rotate(25deg) translateY(100%);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #030712;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 antialiased selection:bg-indigo-500 selection:text-white min-h-screen flex flex-col relative bg-grid-pattern">
  <!-- Top ambient aura spotlight -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[500px] spotlight pointer-events-none -z-10"></div>
  
  <div id="root" class="flex-1 flex flex-col z-10"></div>

  <!-- React Application Core -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- API CLIENT ---
    const API_BASE = "/api";
    const getStoredToken = () => localStorage.getItem("placement_token");
    const setStoredToken = (t) => localStorage.setItem("placement_token", t);
    const removeStoredToken = () => {
      localStorage.removeItem("placement_token");
      localStorage.removeItem("placement_user");
    };
    const getStoredUser = () => {
      const u = localStorage.getItem("placement_user");
      return u ? JSON.parse(u) : null;
    };
    const setStoredUser = (u) => localStorage.setItem("placement_user", JSON.stringify(u));

    async function apiRequest(endpoint, options = {}) {
      const token = getStoredToken();
      const headers = { ...(options.headers || {}) };

      if (!(options.body instanceof FormData) && !headers["Content-Type"]) {
        headers["Content-Type"] = "application/json";
      }
      if (token) {
        headers["Authorization"] = `Bearer ${token}`;
      }

      const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        let msg = "A server error occurred.";
        if (data.detail) {
          if (typeof data.detail === "object" && data.detail.reasons) {
            msg = `Eligibility Criteria Unmet:\n• ` + data.detail.reasons.join("\n• ");
          } else if (typeof data.detail === "object") {
            msg = data.detail.message || JSON.stringify(data.detail);
          } else {
            msg = data.detail;
          }
        }
        const err = new Error(msg);
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    const api = {
      // System & AWS
      getAwsStatus: () => apiRequest("/aws/status"),

      // Auth
      login: (creds) => apiRequest("/auth/login", { method: "POST", body: JSON.stringify(creds) }),
      registerStudent: (d) => apiRequest("/auth/register/student", { method: "POST", body: JSON.stringify(d) }),
      registerRecruiter: (d) => apiRequest("/auth/register/recruiter", { method: "POST", body: JSON.stringify(d) }),
      getMe: () => apiRequest("/auth/me"),
      changePassword: (d) => apiRequest("/auth/change-password", { method: "POST", body: JSON.stringify(d) }),

      // Student
      getStudentProfile: () => apiRequest("/student/profile"),
      updateStudentProfile: (p) => apiRequest("/student/profile", { method: "PUT", body: JSON.stringify(p) }),
      uploadResume: (file) => {
        const formData = new FormData();
        formData.append("file", file);
        return apiRequest("/student/resume/upload", { method: "POST", body: formData });
      },
      getStudentJobs: () => apiRequest("/student/jobs"),
      applyJob: (id) => apiRequest(`/student/jobs/${id}/apply`, { method: "POST" }),
      getStudentApplications: () => apiRequest("/student/applications"),
      getStudentNotifications: () => apiRequest("/student/notifications"),
      markNotificationRead: (id) => apiRequest(`/student/notifications/${id}/read`, { method: "POST" }),

      // Recruiter
      getRecruiterProfile: () => apiRequest("/recruiter/profile"),
      getRecruiterJobs: () => apiRequest("/recruiter/jobs"),
      createJob: (j) => apiRequest("/recruiter/jobs", { method: "POST", body: JSON.stringify(j) }),
      updateJob: (id, j) => apiRequest(`/recruiter/jobs/${id}`, { method: "PUT", body: JSON.stringify(j) }),
      submitJob: (id) => apiRequest(`/recruiter/jobs/${id}/submit`, { method: "POST" }),
      closeJob: (id) => apiRequest(`/recruiter/jobs/${id}/close`, { method: "POST" }),
      deleteJob: (id) => apiRequest(`/recruiter/jobs/${id}`, { method: "DELETE" }),
      getJobApplications: (id, page = 1, limit = 50, status = "", branch = "") => {
        let u = `/recruiter/jobs/${id}/applications?page=${page}&limit=${limit}`;
        if (status) u += `&status=${encodeURIComponent(status)}`;
        if (branch) u += `&branch=${encodeURIComponent(branch)}`;
        return apiRequest(u);
      },
      batchUpdate: (id, ids, status) => apiRequest(`/recruiter/jobs/${id}/applications/batch-update`, {
        method: "POST",
        body: JSON.stringify({ application_ids: ids, status }),
      }),
      scheduleInterview: (jobId, appId, payload) => apiRequest(`/recruiter/jobs/${jobId}/applications/${appId}/schedule-interview`, {
        method: "POST",
        body: JSON.stringify(payload),
      }),
      exportJobCsvUrl: (jobId) => `${API_BASE}/recruiter/jobs/${jobId}/export-csv`,

      // Admin
      getPendingRecruiters: () => apiRequest("/admin/recruiters/pending"),
      approveRecruiter: (id) => apiRequest(`/admin/recruiters/${id}/approve`, { method: "POST" }),
      rejectRecruiter: (id) => apiRequest(`/admin/recruiters/${id}/reject`, { method: "POST" }),
      getPendingJobs: () => apiRequest("/admin/jobs/pending"),
      approveJob: (id) => apiRequest(`/admin/jobs/${id}/approve`, { method: "POST" }),
      requestChanges: (id, feedback) => apiRequest(`/admin/jobs/${id}/request-changes`, {
        method: "POST",
        body: JSON.stringify({ admin_feedback: feedback }),
      }),
      getAuditLogs: (page = 1) => apiRequest(`/admin/audit-logs?page=${page}&limit=25`),
      getMetrics: () => apiRequest("/admin/metrics"),
      getAdminStudents: (page = 1, limit = 50, search = "", branch = "") => {
        let u = `/admin/students?page=${page}&limit=${limit}`;
        if (search) u += `&search=${encodeURIComponent(search)}`;
        if (branch) u += `&branch=${encodeURIComponent(branch)}`;
        return apiRequest(u);
      },
      getAdminRecruiters: (page = 1, limit = 50, status = "", search = "") => {
        let u = `/admin/recruiters?page=${page}&limit=${limit}`;
        if (status) u += `&status=${encodeURIComponent(status)}`;
        if (search) u += `&search=${encodeURIComponent(search)}`;
        return apiRequest(u);
      },
      exportStudentsCsvUrl: () => `${API_BASE}/admin/export/students-csv`,
      exportPlacementsCsvUrl: () => `${API_BASE}/admin/export/placements-csv`,
    };

    // --- POPUP HOVER COMPONENT ---
    // Provides smooth floating card pop-up on cursor hover
    function HoverPopup({ children, title, subtitle, badge, align = "center" }) {
      return (
        <div className="pop-trigger inline-flex items-center">
          {children}
          <div className="pop-content">
            <div className="px-3 py-2 rounded-xl bg-gray-900/95 backdrop-blur-xl border border-white/10 text-left shadow-2xl shadow-black/80 flex flex-col gap-0.5">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-white tracking-wide">{title}</span>
                {badge && (
                  <span className="px-1.5 py-0.2 rounded-md bg-indigo-500/20 text-indigo-300 text-[9px] font-extrabold uppercase border border-indigo-500/30">
                    {badge}
                  </span>
                )}
              </div>
              {subtitle && <span className="text-[10px] text-gray-400 font-medium">{subtitle}</span>}
              {/* Bottom arrow notch */}
              <div className="w-2 h-2 bg-gray-900 border-r border-b border-white/10 rotate-45 absolute -bottom-1 left-1/2 -translate-x-1/2"></div>
            </div>
          </div>
        </div>
      );
    }

    // --- TOAST COMPONENT ---
    function ToastContainer({ toasts, onDismiss }) {
      return (
        <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2.5 max-w-sm pointer-events-none">
          {toasts.map((t) => (
            <div
              key={t.id}
              className={`pointer-events-auto p-4 rounded-2xl shadow-2xl border backdrop-blur-xl flex items-start gap-3 transition-all duration-300 transform translate-y-0 ${
                t.type === "error"
                  ? "bg-rose-950/90 border-rose-600/40 text-rose-100"
                  : t.type === "success"
                  ? "bg-emerald-950/90 border-emerald-600/40 text-emerald-100"
                  : "bg-gray-900/95 border-gray-700/60 text-gray-100"
              }`}
            >
              <div className="text-xl">
                {t.type === "error" ? "🚨" : t.type === "success" ? "✨" : "💡"}
              </div>
              <div className="flex-1 text-xs whitespace-pre-line leading-relaxed font-medium">
                {t.message}
              </div>
              <button
                onClick={() => onDismiss(t.id)}
                className="text-gray-400 hover:text-white text-xs font-bold leading-none p-1"
              >
                ✕
              </button>
            </div>
          ))}
        </div>
      );
    }

    // --- APPLICATION ROOT COMPONENT ---
    function App() {
      const [user, setUser] = useState(null);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authModalMode, setAuthModalMode] = useState("LOGIN");
      const [passwordModalOpen, setPasswordModalOpen] = useState(false);
      const [notificationsOpen, setNotificationsOpen] = useState(false);
      const [notifications, setNotifications] = useState([]);
      const [awsStatus, setAwsStatus] = useState(null);
      const [loading, setLoading] = useState(true);
      const [toasts, setToasts] = useState([]);

      const addToast = (message, type = "info") => {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 5000);
      };

      const dismissToast = (id) => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      };

      useEffect(() => {
        const u = getStoredUser();
        const t = getStoredToken();
        if (u && t) {
          setUser(u);
          if (u.role === "STUDENT") loadNotifications();
        }
        loadAwsStatus();
        setLoading(false);
      }, []);

      const loadAwsStatus = async () => {
        try {
          const s = await api.getAwsStatus();
          setAwsStatus(s);
        } catch (e) {
          console.error("AWS status check:", e);
        }
      };

      const loadNotifications = async () => {
        try {
          const list = await api.getStudentNotifications();
          setNotifications(list);
        } catch (e) {}
      };

      const handleLogout = () => {
        removeStoredToken();
        setUser(null);
        setNotifications([]);
        addToast("Signed out of session safely.", "info");
      };

      const handleQuickLogin = async (email, password, role) => {
        try {
          const res = await api.login({ email, password, role });
          setStoredToken(res.access_token);
          const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
          setStoredUser(u);
          setUser(u);
          if (u.role === "STUDENT") loadNotifications();
          addToast(`Authenticated as ${u.name} (${u.role})`, "success");
        } catch (e) {
          addToast(`Authentication failed: ${e.message}`, "error");
        }
      };

      const unreadCount = notifications.filter((n) => !n.is_read).length;

      if (loading) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center text-indigo-400 gap-4">
            <div className="relative">
              <div className="w-12 h-12 border-2 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
              <div className="w-6 h-6 border-2 border-cyan-400/30 border-b-cyan-400 rounded-full animate-spin absolute inset-3"></div>
            </div>
            <div className="text-xs font-semibold tracking-widest text-gray-400 uppercase">
              Loading Apex Institutional Engine...
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-950 text-gray-100 flex flex-col font-sans relative">
          {/* Top Enterprise Navigation */}
          <header className="sticky top-0 z-40 bg-gray-950/80 backdrop-blur-2xl border-b border-white/[0.08] shadow-2xl shadow-black/40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              
              {/* Brand Logo & AWS Cloud Pulse */}
              <div className="flex items-center space-x-4 cursor-pointer" onClick={() => setUser(user)}>
                <HoverPopup title="Apex Campus OS" subtitle="Institutional Campus Placement Portal" badge="v2.0">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 p-[1px] shadow-lg shadow-indigo-500/25 group transition-transform duration-300 hover:scale-105">
                    <div className="w-full h-full bg-gray-950 rounded-[15px] flex items-center justify-center">
                      <span className="text-sm font-black tracking-tight bg-gradient-to-tr from-white to-indigo-200 bg-clip-text text-transparent">
                        AP
                      </span>
                    </div>
                  </div>
                </HoverPopup>

                <div>
                  <div className="flex items-center gap-2.5">
                    <span className="font-extrabold text-sm sm:text-base tracking-tight text-white flex items-center gap-1.5">
                      Apex <span className="text-gray-400 font-medium text-xs hidden sm:inline">| Campus Placement Portal</span>
                    </span>

                    {/* AWS Cloud Live Status Indicator with Pop-Up Animation */}
                    <HoverPopup
                      title={awsStatus?.s3_configured ? "AWS Cloud Active" : "Local Storage Sandbox"}
                      subtitle={awsStatus ? `Region: ${awsStatus.region} • S3 Bucket: ${awsStatus.s3_configured ? 'Online' : 'Fallback'}` : "AWS Engine Standby"}
                      badge={awsStatus?.s3_configured ? "AWS S3 / SES" : "Local Mock"}
                    >
                      <div className="cursor-pointer flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 shadow-sm transition-all hover:bg-emerald-500/20">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span className="hidden md:inline">AWS Cloud Engine</span>
                        <span className="md:hidden">AWS</span>
                      </div>
                    </HoverPopup>
                  </div>
                </div>
              </div>

              {/* Navigation Controls */}
              <div className="flex items-center space-x-2.5 sm:space-x-3">
                {user ? (
                  <>
                    {/* Student Alert Inbox */}
                    {user.role === "STUDENT" && (
                      <HoverPopup title="Notification Inbox" subtitle={`${unreadCount} unread system announcements`}>
                        <button
                          onClick={() => setNotificationsOpen(true)}
                          className="relative p-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-gray-300 hover:text-white border border-white/10 transition-all hover:border-indigo-500/40"
                        >
                          🔔
                          {unreadCount > 0 && (
                            <span className="absolute -top-1 -right-1 px-1.5 py-0.5 bg-rose-500 text-white font-extrabold text-[9px] rounded-full animate-bounce shadow-md">
                              {unreadCount}
                            </span>
                          )}
                        </button>
                      </HoverPopup>
                    )}

                    {/* User Identity Pill with Pop-Up Details */}
                    <HoverPopup
                      title={user.name || user.email}
                      subtitle={`Role: ${user.role} • Status: ${user.status || 'Verified'}`}
                      badge={user.role}
                    >
                      <div className="cursor-pointer flex items-center space-x-2.5 bg-gray-900/90 px-3 py-1.5 rounded-xl border border-white/10 shadow-inner">
                        <div className="w-7 h-7 rounded-lg bg-gradient-to-tr from-indigo-500 to-cyan-500 flex items-center justify-center font-bold text-white text-xs shadow-md">
                          {user.name ? user.name.charAt(0).toUpperCase() : "U"}
                        </div>
                        <div className="text-right hidden sm:block">
                          <div className="text-xs font-bold text-white leading-tight">{user.name}</div>
                          <div className="text-[10px] text-gray-400 font-mono">{user.email}</div>
                        </div>
                      </div>
                    </HoverPopup>

                    {/* Change Password Key */}
                    <HoverPopup title="Security Credentials" subtitle="Update current account password">
                      <button
                        onClick={() => setPasswordModalOpen(true)}
                        className="p-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-gray-400 hover:text-white border border-white/10 transition-all hover:border-indigo-500/40"
                      >
                        🔑
                      </button>
                    </HoverPopup>

                    {/* Sign Out */}
                    <HoverPopup title="End Active Session" subtitle="Safely revoke JWT token and logout">
                      <button
                        onClick={handleLogout}
                        className="text-xs font-bold px-3 py-2 rounded-xl bg-rose-500/10 text-rose-300 hover:bg-rose-500/20 border border-rose-500/30 transition-all"
                      >
                        Sign Out
                      </button>
                    </HoverPopup>
                  </>
                ) : (
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => { setAuthModalMode("LOGIN"); setAuthModalOpen(true); }}
                      className="btn-shine text-xs font-bold px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white shadow-lg shadow-indigo-600/30 transition-all"
                    >
                      Sign In / Register →
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Main Workspace Body */}
          <main className="flex-1 flex flex-col">
            {!user ? (
              <LandingView
                onQuickLogin={handleQuickLogin}
                onOpenAuth={(mode) => { setAuthModalMode(mode); setAuthModalOpen(true); }}
                awsStatus={awsStatus}
              />
            ) : user.role === "STUDENT" ? (
              <StudentView user={user} onRefreshNotifications={loadNotifications} addToast={addToast} />
            ) : user.role === "RECRUITER" ? (
              <RecruiterView user={user} addToast={addToast} />
            ) : user.role === "ADMIN" ? (
              <AdminView user={user} addToast={addToast} />
            ) : null}
          </main>

          {/* Global Modals */}
          <AuthModal
            isOpen={authModalOpen}
            initialMode={authModalMode}
            onClose={() => setAuthModalOpen(false)}
            onSuccess={(u) => {
              setUser(u);
              if (u.role === "STUDENT") loadNotifications();
              addToast(`Welcome back, ${u.name}!`, "success");
            }}
          />

          <ChangePasswordModal
            isOpen={passwordModalOpen}
            onClose={() => setPasswordModalOpen(false)}
            addToast={addToast}
          />

          <NotificationModal
            isOpen={notificationsOpen}
            onClose={() => setNotificationsOpen(false)}
            notifications={notifications}
            onRefresh={loadNotifications}
          />

          <ToastContainer toasts={toasts} onDismiss={dismissToast} />

          {/* Professional Enterprise Footer */}
          <footer className="border-t border-white/[0.08] bg-gray-950/90 py-6 text-xs text-gray-500">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="font-extrabold text-white">Apex Institutional Suite</span>
                <span>&bull;</span>

      useEffect(() => {

      const loadData = async () => {
        try {
          const [p, j, a] = await Promise.all([
            api.getStudentProfile(),
            api.getStudentJobs(),
            api.getStudentApplications(),
          ]);
          setProfile(p);
          setJobs(j);
          setApplications(a);
        } catch (e) {
          addToast(`Error loading student data: ${e.message}`, "error");
        }
      };

      const handleResumeFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.name.toLowerCase().endsWith(".pdf")) {
          addToast("Only PDF documents (.pdf) are permitted for resumes.", "error");
          return;
        }

        setUploadingResume(true);
        try {
          const res = await api.uploadResume(file);
          setProfile((prev) => ({ ...prev, resume_url: res.resume_url }));
          addToast(`Resume uploaded successfully (${res.storage})`, "success");
          loadData();
        } catch (err) {
          addToast(`Upload failed: ${err.message}`, "error");
        } finally {
          setUploadingResume(false);
          if (fileInputRef.current) fileInputRef.current.value = "";
        }

        try {
          await api.applyJob(job.id);

            (j.job_location && j.job_location.toLowerCase().includes(searchQuery.toLowerCase()));

                    return (
                      <div

                            ? "border-rose-900/40 bg-rose-950/10"

                        <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b border-white/[0.08]">

                            <div
                              className={`h-full transition-all duration-700 ${

                                  ? "bg-gradient-to-r from-cyan-500 to-emerald-400 w-full"
                                  : app.status === "SHORTLISTED"
                                  ? "bg-gradient-to-r from-cyan-500 to-indigo-500 w-3/4"
                                  : app.status === "UNDER_REVIEW"
                                  ? "bg-cyan-500 w-1/2"
                                  : app.status === "REJECTED"
                                  ? "bg-rose-500 w-full"
                                  : "bg-gray-700 w-1/4"
                              }`}
                            ></div>
                          </div>
                        </div>

                        {/* Scheduled Interview Card */}
                        {hasInterview && (
                          <div className="mt-2 p-4 rounded-xl bg-gradient-to-r from-indigo-950/60 via-purple-950/40 to-gray-900 border border-indigo-500/30 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div className="space-y-1">
                              <div className="flex items-center gap-2">
                                <span className="text-lg">🎙️</span>
                                <span className="text-xs font-bold text-indigo-300 uppercase tracking-wide">
                                  Interview Scheduled &bull; {app.interview_round}
                                </span>
                              </div>
                              <div className="text-xs text-gray-200">
                                Date & Time: <b>{new Date(app.interview_scheduled_at).toLocaleString()}</b>

                                  "{app.interview_notes}"

                              <HoverPopup title="Join Meeting" subtitle="External video link">
                                <a

                                  target="_blank"
                                  rel="noreferrer"
                                  className="btn-shine px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md shadow-indigo-600/30 whitespace-nowrap"
                                >
                                  Join Meeting ↗
                                </a>
                              </HoverPopup>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* ELIGIBILITY DETAILS MODAL */}
          {eligibilityModalJob && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
              <div className="company-card rounded-2xl max-w-md w-full p-6 text-left border border-white/10 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                  <h3 className="font-extrabold text-base text-white">Server-Side Eligibility Breakdown</h3>
                  <button onClick={() => setEligibilityModalJob(null)} className="text-gray-400 hover:text-white text-sm">✕</button>
                </div>

                <div>
                  <div className="text-xs text-gray-400">{eligibilityModalJob.company_name}</div>
                  <div className="text-sm font-bold text-white">{eligibilityModalJob.title}</div>
                </div>

                <div className="space-y-2.5 text-xs">
                  <div className="flex items-center justify-between p-3 rounded-xl bg-gray-900 border border-white/5">
                    <div>
                      <div className="font-semibold text-gray-200">CGPA Requirement</div>
                      <div className="text-[11px] text-gray-400">Your profile: {profile?.cgpa.toFixed(2)}</div>
                    </div>
                    <span className={`font-bold ${profile?.cgpa >= eligibilityModalJob.min_cgpa ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {eligibilityModalJob.min_cgpa.toFixed(2)} {profile?.cgpa >= eligibilityModalJob.min_cgpa ? '✓' : '✗'}
                    </span>
                  </div>

                  <div className="flex items-center justify-between p-3 rounded-xl bg-gray-900 border border-white/5">
                    <div>
                      <div className="font-semibold text-gray-200">Eligible Departments</div>
                      <div className="text-[11px] text-gray-400">Your branch: {profile?.branch}</div>
                    </div>
                    <span className="font-bold text-gray-300 max-w-[140px] truncate text-right">
                      [{eligibilityModalJob.allowed_branches.join(", ")}]
                    </span>
                  </div>

                  <div className="flex items-center justify-between p-3 rounded-xl bg-gray-900 border border-white/5">
                    <div>
                      <div className="font-semibold text-gray-200">Resume Attached</div>
                      <div className="text-[11px] text-gray-400">AWS S3 or Verified URL</div>
                    </div>
                    <span className={`font-bold ${profile?.resume_url ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {profile?.resume_url ? 'Attached ✓' : 'Missing ✗'}
                    </span>
                  </div>

                  {!eligibilityModalJob.is_eligible && eligibilityModalJob.reasons && (
                    <div className="p-3 rounded-xl bg-rose-950/40 border border-rose-800/50 text-rose-300 text-[11px] space-y-1">
                      <div className="font-bold">Reasons for Gating:</div>
                      {eligibilityModalJob.reasons.map((r, idx) => (
                        <div key={idx}>• {r}</div>
                      ))}
                    </div>
                  )}
                </div>

                <button
                  onClick={() => setEligibilityModalJob(null)}
                  className="w-full py-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-white font-bold text-xs border border-white/10"
                >
                  Dismiss Breakdown
                </button>
              </div>
            </div>
          )}

          {/* EDIT PROFILE MODAL */}
          {profileModalOpen && profile && (
            <EditProfileModal
              profile={profile}
              onClose={() => setProfileModalOpen(false)}
              onSuccess={(updated) => {
                setProfile(updated);
                addToast("Profile metrics updated successfully", "success");
                setProfileModalOpen(false);
                loadData();
              }}
              addToast={addToast}
            />
          )}
        </div>
      );
    }

    // --- EDIT PROFILE MODAL ---
    function EditProfileModal({ profile, onClose, onSuccess, addToast }) {
      const [fullName, setFullName] = useState(profile.full_name || "");
      const [cgpa, setCgpa] = useState(profile.cgpa || 0.0);
      const [branch, setBranch] = useState(profile.branch || "CSE");
      const [gradYear, setGradYear] = useState(profile.graduation_year || 2025);
      const [saving, setSaving] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          const updated = await api.updateStudentProfile({
            full_name: fullName,
            cgpa: parseFloat(cgpa),
            branch: branch,
            graduation_year: parseInt(gradYear),
          });
          onSuccess(updated);
        } catch (err) {
          addToast(`Error updating profile: ${err.message}`, "error");
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
          <div className="company-card rounded-2xl max-w-md w-full p-6 text-left border border-white/10 shadow-2xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-white/10">
              <h3 className="font-extrabold text-base text-white">Edit Academic Metrics</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-gray-400 font-semibold mb-1">Full Name</label>
                <input
                  type="text"
                  required
                  value={fullName}
                  onChange={(e) => setFullName(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Academic CGPA (0.00 - 10.00)</label>
                <input
                  type="number"
                  step="0.01"
                  min="0"
                  max="10"
                  required
                  value={cgpa}
                  onChange={(e) => setCgpa(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Department / Branch</label>
                <select
                  value={branch}
                  onChange={(e) => setBranch(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                >
                  <option value="CSE">CSE (Computer Science & Engineering)</option>
                  <option value="ECE">ECE (Electronics & Communication)</option>
                  <option value="IT">IT (Information Technology)</option>
                  <option value="ME">ME (Mechanical Engineering)</option>
                  <option value="CE">CE (Civil Engineering)</option>
                  <option value="EEE">EEE (Electrical & Electronics)</option>
                </select>
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Graduation Batch Year</label>
                <input
                  type="number"
                  required
                  value={gradYear}
                  onChange={(e) => setGradYear(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                />
              </div>

              <div className="pt-2 flex gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-gray-300 font-bold border border-white/5"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="btn-shine flex-1 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold disabled:opacity-50"
                >
                  {saving ? "Saving..." : "Save Metrics"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- RECRUITER VIEW (ATS COMMAND CENTER) ---
    function RecruiterView({ user, addToast }) {
      const [profile, setProfile] = useState(null);
      const [jobs, setJobs] = useState([]);
      const [selectedJob, setSelectedJob] = useState(null);
      const [applications, setApplications] = useState([]);
      const [selectedAppIds, setSelectedAppIds] = useState([]);
      const [statusFilter, setStatusFilter] = useState("");
      const [branchFilter, setBranchFilter] = useState("");
      const [createModalOpen, setCreateModalOpen] = useState(false);
      const [interviewModalApp, setInterviewModalApp] = useState(null);
      const [loadingApps, setLoadingApps] = useState(false);

      useEffect(() => {
        loadRecruiterData();
      }, []);

      const loadRecruiterData = async () => {
        try {
          const [p, j] = await Promise.all([
            api.getRecruiterProfile(),
            api.getRecruiterJobs(),
          ]);
          setProfile(p);
          setJobs(j);
          if (j.length > 0 && !selectedJob) {
            selectJobForAts(j[0]);
          }
        } catch (e) {
          addToast(`Error: ${e.message}`, "error");
        }
      };

      const selectJobForAts = async (job) => {
        setSelectedJob(job);
        setSelectedAppIds([]);
        setLoadingApps(true);
        try {
          const res = await api.getJobApplications(job.id, 1, 50, statusFilter, branchFilter);
          setApplications(res.items || []);
        } catch (err) {
          addToast(`Failed to load applications: ${err.message}`, "error");
        } finally {
          setLoadingApps(false);
        }
      };

      useEffect(() => {
        if (selectedJob) {
          selectJobForAts(selectedJob);
        }
      }, [statusFilter, branchFilter]);

      const handleBatchUpdate = async (newStatus) => {
        if (selectedAppIds.length === 0) {
          addToast("Please select at least one candidate using the checkboxes.", "info");
          return;
        }
        try {
          const res = await api.batchUpdate(selectedJob.id, selectedAppIds, newStatus);
          addToast(`Atomic Batch Completed: ${res.updated_count} candidate(s) set to ${newStatus}`, "success");
          setSelectedAppIds([]);
          selectJobForAts(selectedJob);
        } catch (e) {
          addToast(`Batch update failed: ${e.message}`, "error");
        }
      };

      const handleSubmitJob = async (jobId) => {
        try {
          await api.submitJob(jobId);
          addToast("Job successfully submitted for placement cell vetting!", "success");
          loadRecruiterData();
        } catch (e) {
          addToast(e.message, "error");
        }
      };

      const handleCloseJob = async (jobId) => {
        try {
          await api.closeJob(jobId);
          addToast("Job posting closed.", "info");
          loadRecruiterData();
        } catch (e) {
          addToast(e.message, "error");
        }
      };

      const handleDeleteJob = async (jobId) => {
        if (!confirm("Are you sure you want to soft-delete this job? Applicants will receive automated background notifications.")) return;
        try {
          await api.deleteJob(jobId);
          addToast("Job deleted and background notifications dispatched.", "info");
          loadRecruiterData();
        } catch (e) {
          addToast(e.message, "error");
        }
      };

      const toggleAppSelection = (id) => {
        setSelectedAppIds((prev) =>
          prev.includes(id) ? prev.filter((i) => i !== id) : [...prev, id]
        );
      };

      const toggleSelectAll = () => {
        if (selectedAppIds.length === applications.length) {
          setSelectedAppIds([]);
        } else {
          setSelectedAppIds(applications.map((a) => a.id));
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
          
          {/* Recruiter Workspace Header */}
          <div className="company-card rounded-2xl p-6 shadow-2xl">
            <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <h2 className="text-xl sm:text-2xl font-extrabold text-white">{profile?.company_name}</h2>
                  <HoverPopup title="Account Verification" subtitle="Placement cell vetted status">
                    <span
                      className={`cursor-pointer px-2.5 py-0.5 rounded-full text-xs font-bold ${
                        profile?.status === "ACTIVE"
                          ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40"
                          : "bg-amber-500/20 text-amber-300 border border-amber-500/40"
                      }`}
                    >
                      {profile?.status}
                    </span>
                  </HoverPopup>
                </div>
                <div className="text-xs text-gray-400 mt-1">
                  HR Representative: <b className="text-gray-200">{profile?.hr_name}</b> &bull; Account: {profile?.email}
                </div>
              </div>

              <div className="flex items-center gap-3">
                <HoverPopup title="New Recruitment Drive" subtitle="Post opening with package & criteria">
                  <button
                    onClick={() => setCreateModalOpen(true)}
                    disabled={profile?.status !== "ACTIVE"}
                    className="btn-shine px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center gap-2 shadow-lg shadow-indigo-600/30 transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                  >
                    <span>➕ Post New Job Opening</span>
                  </button>
                </HoverPopup>
              </div>
            </div>

            {profile?.status === "PENDING" && (
              <div className="mt-4 p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs flex items-center gap-2.5">
                <span>⏳</span>
                <span>
                  Your recruiter organization is pending approval by the Placement Director. Posting jobs is temporarily locked.
                </span>
              </div>
            )}
          </div>

          {/* Drives Grid */}
          <div className="space-y-3">
            <h3 className="text-xs font-bold uppercase tracking-wider text-gray-400">Recruitment Drives</h3>
            {jobs.length === 0 ? (
              <div className="company-card rounded-2xl p-8 text-center text-gray-400 text-xs">
                No active drives posted. Click "Post New Job Opening" to get started!
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {jobs.map((job) => {
                  const isSelected = selectedJob?.id === job.id;
                  return (
                    <div
                      key={job.id}
                      onClick={() => selectJobForAts(job)}
                      className={`company-card rounded-2xl p-5 text-left border cursor-pointer transition-all flex flex-col justify-between space-y-3 ${
                        isSelected
                          ? "border-indigo-500 bg-indigo-950/20 ring-1 ring-indigo-500"
                          : "border-white/[0.08]"
                      }`}
                    >
                      <div className="space-y-1.5">
                        <div className="flex items-center justify-between gap-2">
                          <span
                            className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${
                              job.status === "ACTIVE"
                                ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40"
                                : job.status === "REQUIRES_CHANGES"
                                ? "bg-rose-500/20 text-rose-300 border border-rose-500/40"
                                : job.status === "PENDING_APPROVAL"
                                ? "bg-amber-500/20 text-amber-300 border border-amber-500/40"
                                : "bg-gray-800 text-gray-400"
                            }`}
                          >
                            {job.status.replace("_", " ")}
                          </span>
                          {job.ctc_lpa > 0 && (
                            <span className="text-xs font-bold text-emerald-400">₹{job.ctc_lpa} LPA</span>
                          )}
                        </div>
                        <h4 className="text-sm font-extrabold text-white line-clamp-1">{job.title}</h4>
                        <div className="text-[11px] text-gray-400">{job.job_location || "On-site / Hybrid"}</div>
                      </div>

                      {/* Admin Feedback Block */}
                      {job.status === "REQUIRES_CHANGES" && job.admin_feedback && (
                        <div className="p-2.5 rounded-xl bg-rose-950/60 border border-rose-800 text-rose-200 text-[11px]">
                          <b>Admin Feedback:</b> {job.admin_feedback}
                        </div>
                      )}

                      {/* Job Controls Bar */}
                      <div className="pt-2 border-t border-white/[0.08] flex items-center justify-between gap-2 text-xs">
                        <div className="flex items-center gap-1.5">
                          {["DRAFT", "REQUIRES_CHANGES"].includes(job.status) && (
                            <button
                              onClick={(e) => { e.stopPropagation(); handleSubmitJob(job.id); }}
                              className="px-2.5 py-1 rounded-lg bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 hover:bg-indigo-600/50 text-[10px] font-bold"
                            >
                              Submit
                            </button>
                          )}
                          {job.status === "ACTIVE" && (
                            <button
                              onClick={(e) => { e.stopPropagation(); handleCloseJob(job.id); }}
                              className="px-2.5 py-1 rounded-lg bg-gray-900 text-gray-300 hover:bg-gray-800 text-[10px]"
                            >
                              Close
                            </button>
                          )}

    // --- CREATE JOB MODAL ---
    function CreateJobModal({ onClose, onSuccess, addToast }) {
      const [title, setTitle] = useState("");
      const [description, setDescription] = useState("");
      const [ctcLpa, setCtcLpa] = useState(16.0);
      const [jobLocation, setJobLocation] = useState("Bengaluru / Hybrid");
      const [jobType, setJobType] = useState("Full-Time");
      const [minCgpa, setMinCgpa] = useState(7.0);
      const [allowedBranches, setAllowedBranches] = useState(["CSE", "IT"]);
      const [allowedGradYears, setAllowedGradYears] = useState([2025, 2026]);
      const [submitting, setSubmitting] = useState(false);

      const handleBranchToggle = (branch) => {
        setAllowedBranches((prev) =>
          prev.includes(branch) ? prev.filter((b) => b !== branch) : [...prev, branch]
        );
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        try {
          await api.createJob({
            title,
            description,
            ctc_lpa: parseFloat(ctcLpa) || 0.0,
            job_location: jobLocation,
            job_type: jobType,
            min_cgpa: parseFloat(minCgpa) || 0.0,
            allowed_branches: allowedBranches,
            allowed_graduation_years: allowedGradYears,
          });
          onSuccess();
        } catch (err) {
          addToast(`Error creating job: ${err.message}`, "error");
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
          <div className="company-card rounded-2xl max-w-lg w-full p-6 text-left border border-white/10 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between pb-3 border-b border-white/10">
              <h3 className="font-extrabold text-base text-white">Post New Recruitment Opening</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-gray-400 font-semibold mb-1">Job Title</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Cloud Solutions Engineer (AWS)"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Role Description</label>
                <textarea
                  required
                  rows={3}
                  placeholder="Detail tech stack, responsibilities, and qualifications..."
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-gray-400 font-semibold mb-1">Package (LPA)</label>
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    required
                    value={ctcLpa}
                    onChange={(e) => setCtcLpa(e.target.value)}
                    className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-gray-400 font-semibold mb-1">Minimum CGPA</label>
                  <input
                    type="number"
                    step="0.01"
                    min="0"
                    max="10"
                    required
                    value={minCgpa}
                    onChange={(e) => setMinCgpa(e.target.value)}

                <div>
                  <label className="block text-gray-400 font-semibold mb-1">Location</label>

                    value={jobType}

            </form>
          </div>
        </div>
      );

    // --- SCHEDULE INTERVIEW MODAL ---
    function ScheduleInterviewModal({ app, jobId, onClose, onSuccess, addToast }) {
      const [round, setRound] = useState("Technical Round 1: Cloud Architecture");
      const [dateTime, setDateTime] = useState("");
      const [meetingLink, setMeetingLink] = useState("https://meet.google.com/aws-interview");
      const [notes, setNotes] = useState("");
      const [scheduling, setScheduling] = useState(false);

      useEffect(() => {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(10, 0, 0, 0);
        setDateTime(tomorrow.toISOString().slice(0, 16));
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setScheduling(true);
        try {
          await api.scheduleInterview(jobId, app.id, {
            interview_round: round,
            interview_scheduled_at: new Date(dateTime).toISOString(),
            interview_meeting_link: meetingLink,
            interview_notes: notes,
          });
          onSuccess();
        } catch (err) {
          addToast(`Error scheduling interview: ${err.message}`, "error");
        } finally {
          setScheduling(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
          <div className="company-card rounded-2xl max-w-md w-full p-6 text-left border border-white/10 shadow-2xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-white/10">
              <h3 className="font-extrabold text-base text-white">Schedule Candidate Interview</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <div className="p-3.5 rounded-xl bg-gray-900 border border-white/5 text-xs">
              <div className="text-gray-400">Target Candidate:</div>
              <div className="font-bold text-white text-sm">{app.student?.full_name} ({app.student?.roll_number})</div>
              <div className="text-[11px] text-gray-400">{app.student?.email}</div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-gray-400 font-semibold mb-1">Interview Round Title</label>
                <input
                  type="text"
                  required
                  value={round}
                  onChange={(e) => setRound(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-purple-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Scheduled Date & Time</label>
                <input
                  type="datetime-local"
                  required
                  value={dateTime}
                  onChange={(e) => setDateTime(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-purple-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Meeting Link (Google Meet / Zoom / Chime)</label>
                <input
                  type="url"
                  required
                  value={meetingLink}
                  onChange={(e) => setMeetingLink(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-purple-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Candidate Preparation Notes</label>
                <textarea
                  rows={2}
                  placeholder="Topics to prepare, assessment format, etc."
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-purple-500"
                />
              </div>

              <div className="pt-2 flex gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-gray-300 font-bold border border-white/5"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={scheduling}
                  className="btn-shine flex-1 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold disabled:opacity-50"
                >
                  {scheduling ? "Scheduling..." : "Send Invite →"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );

        loadAdminData();

        try {
          const [m, pr, pj, s, r, al] = await Promise.all([
            api.getMetrics(),
            api.getPendingRecruiters(),
            api.getPendingJobs(),
            api.getAdminStudents(1, 50),

            api.getAuditLogs(1),

          setPendingRecruiters(pr);
          setPendingJobs(pj);

          addToast(`Error: ${e.message}`, "error");

          addToast(e.message, "error");

          addToast(e.message, "error");

          addToast(e.message, "error");

        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-6">
          
          {/* Admin Command Header */}

              <div className="text-xs font-bold uppercase tracking-wider text-purple-400">Institutional Governance Console</div>

    // --- REQUEST FEEDBACK MODAL ---
    function RequestFeedbackModal({ job, onClose, onSuccess, addToast }) {
      const [feedback, setFeedback] = useState("");
      const [sending, setSending] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSending(true);
        try {
          await api.requestChanges(job.id, feedback);
          onSuccess();
        } catch (err) {
          addToast(`Error: ${err.message}`, "error");
        } finally {
          setSending(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
          <div className="company-card rounded-2xl max-w-md w-full p-6 text-left border border-white/10 shadow-2xl space-y-4">
            <div className="flex items-center justify-between pb-3 border-b border-white/10">
              <h3 className="font-extrabold text-base text-white">Request Job Corrections</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-gray-400 font-semibold mb-1">
                  Mandatory Correction Feedback for {job.company_name}
                </label>
                <textarea
                  required
                  rows={4}
                  placeholder="Explain requested corrections (e.g. adjust minimum CGPA, clarify branch requirements)..."
                  value={feedback}
                  onChange={(e) => setFeedback(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-amber-500"
                />
              </div>

              <div className="pt-2 flex gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl bg-gray-900 hover:bg-gray-800 text-gray-300 font-bold border border-white/5"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={sending}
                  className="btn-shine flex-1 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold disabled:opacity-50"
                >
                  {sending ? "Sending..." : "Submit Feedback"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- CHANGE PASSWORD MODAL ---
    function ChangePasswordModal({ isOpen, onClose, addToast }) {
      const [oldPassword, setOldPassword] = useState("");

      const [saving, setSaving] = useState(false);

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          await api.changePassword({ old_password: oldPassword, new_password: newPassword });
          addToast("Password updated successfully!", "success");
          onClose();
        } catch (err) {
          addToast(`Error: ${err.message}`, "error");
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
          <div className="company-card rounded-2xl max-w-sm w-full p-6 text-left border border-white/10 shadow-2xl space-y-4">

      const [mode, setMode] = useState(initialMode || "LOGIN");
      const [role, setRole] = useState("STUDENT");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [fullName, setFullName] = useState("");
      const [rollNumber, setRollNumber] = useState("");
      const [cgpa, setCgpa] = useState(8.0);
      const [branch, setBranch] = useState("CSE");
      const [gradYear, setGradYear] = useState(2025);
      const [companyName, setCompanyName] = useState("");
      const [hrName, setHrName] = useState("");
      const [error, setError] = useState("");
      const [submitting, setSubmitting] = useState(false);

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError("");
        setSubmitting(true);

        try {
          if (mode === "LOGIN") {
            const res = await api.login({ email, password, role });
            setStoredToken(res.access_token);
            const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
            setStoredUser(u);
            onSuccess(u);
            onClose();
          } else if (mode === "REGISTER_STUDENT") {
            const res = await api.registerStudent({
              email,
              password,
              full_name: fullName,
              roll_number: rollNumber,
              cgpa: parseFloat(cgpa),
              branch,
              graduation_year: parseInt(gradYear),
            });
            setStoredToken(res.access_token);
            const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
            setStoredUser(u);
            onSuccess(u);
            onClose();
          } else if (mode === "REGISTER_RECRUITER") {
            const res = await api.registerRecruiter({
              email,
              password,
              company_name: companyName,
              hr_name: hrName,
            });
            setStoredToken(res.access_token);
            const u = { id: res.user_id, email: res.email, name: res.name, role: res.role, status: res.status };
            setStoredUser(u);
            onSuccess(u);
            onClose();
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
          <div className="company-card rounded-2xl max-w-md w-full p-6 text-left border border-white/10 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between pb-3 border-b border-white/10">
              <h3 className="font-extrabold text-base text-white">
                {mode === "LOGIN"
                  ? "Sign In • Campus Placement Portal"
                  : mode === "REGISTER_STUDENT"
                  ? "Register Student Applicant"
                  : "Register Partner Recruiter"}
              </h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-sm">✕</button>
            </div>

            {error && (
              <div className="p-3.5 rounded-xl bg-rose-950/60 border border-rose-800 text-rose-200 text-xs whitespace-pre-line">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              {mode === "LOGIN" && (
                <div>
                  <label className="block text-gray-400 font-semibold mb-1">Target Account Role</label>
                  <div className="grid grid-cols-3 gap-2">
                    {["STUDENT", "RECRUITER", "ADMIN"].map((r) => (
                      <button
                        type="button"
                        key={r}
                        onClick={() => setRole(r)}
                        className={`py-2 rounded-xl font-bold text-xs transition-all ${
                          role === r
                            ? "bg-indigo-600 text-white shadow-md shadow-indigo-600/30"
                            : "bg-gray-900 text-gray-400 hover:text-white border border-white/5"
                        }`}
                      >
                        {r}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {mode === "REGISTER_STUDENT" && (
                <>
                  <div>
                    <label className="block text-gray-400 font-semibold mb-1">Full Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Ronak Soni"
                      value={fullName}
                      onChange={(e) => setFullName(e.target.value)}
                      className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-gray-400 font-semibold mb-1">Roll Number</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. 21CS001"
                        value={rollNumber}
                        onChange={(e) => setRollNumber(e.target.value)}
                        className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block text-gray-400 font-semibold mb-1">Academic CGPA</label>
                      <input
                        type="number"
                        step="0.01"
                        min="0"
                        max="10"
                        required
                        value={cgpa}
                        onChange={(e) => setCgpa(e.target.value)}
                        className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-gray-400 font-semibold mb-1">Branch</label>
                      <select
                        value={branch}
                        onChange={(e) => setBranch(e.target.value)}
                        className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                      >
                        <option value="CSE">CSE</option>
                        <option value="ECE">ECE</option>
                        <option value="IT">IT</option>
                        <option value="ME">ME</option>
                        <option value="CE">CE</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-gray-400 font-semibold mb-1">Batch Year</label>
                      <input
                        type="number"
                        required
                        value={gradYear}
                        onChange={(e) => setGradYear(e.target.value)}
                        className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>
                </>
              )}

              {mode === "REGISTER_RECRUITER" && (
                <>
                  <div>
                    <label className="block text-gray-400 font-semibold mb-1">Company Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Amazon Web Services"
                      value={companyName}
                      onChange={(e) => setCompanyName(e.target.value)}
                      className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="block text-gray-400 font-semibold mb-1">HR Representative Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Priya Sharma"
                      value={hrName}
                      onChange={(e) => setHrName(e.target.value)}
                      className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </>
              )}

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Email Address</label>
                <input
                  type="email"
                  required
                  placeholder="name@placement.edu"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-gray-400 font-semibold mb-1">Password</label>
                <input
                  type="password"
                  required
                  placeholder="••••••••"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-3.5 py-2 bg-gray-900 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="pt-2">
                <button
                  type="submit"
                  disabled={submitting}
                  className="btn-shine w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg shadow-indigo-600/30 transition-all disabled:opacity-50"
                >
                  {submitting
                    ? "Validating..."
                    : mode === "LOGIN"
                    ? "Enter Workspace →"
                    : "Create Profile →"}
                </button>
              </div>

              <div className="pt-2 text-center text-[11px] text-gray-400 space-y-1">
                {mode === "LOGIN" ? (
                  <>
                    <div>
                      Student applicant?{" "}
                      <button
                        type="button"
                        onClick={() => { setMode("REGISTER_STUDENT"); setError(""); }}
                        className="text-cyan-400 hover:underline font-bold"
                      >
                        Register as Student
                      </button>
                    </div>
                    <div>
                      Company recruiter?{" "}
                      <button
                        type="button"
                        onClick={() => { setMode("REGISTER_RECRUITER"); setError(""); }}
                        className="text-indigo-400 hover:underline font-bold"
                      >
                        Register Organization
                      </button>
                    </div>
                  </>
                ) : (
                  <div>
                    Already registered?{" "}
                    <button
                      type="button"
                      onClick={() => { setMode("LOGIN"); setError(""); }}
                      className="text-indigo-400 hover:underline font-bold"
                    >
                      Sign In here
                    </button>
                  </div>
                )}
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render into root
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
